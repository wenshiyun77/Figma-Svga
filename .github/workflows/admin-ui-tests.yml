name: Admin UI tests

on:
  push:
    branches:
      - main
    paths:
      - 'cache-bridge/admin/**'
      - '.github/workflows/admin-ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run admin UI regression tests
        run: node --test cache-bridge/admin/src/admin-ui-v5.test.mjs
