name: Import GPT v0.8.53 engine
# retry: 2026-10-02

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-gpt-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-gpt-engine
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Download private transfer archive
        env:
          ENGINE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-bfdc-81fd-b02b-0184297b1989/raw?se=2026-10-02T03%3A15%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=07be6260-82f4-5fc8-9ef6-e3bfc9ee9f76&skoid=b869bb08-96ac-4184-ab38-9c45e2890c4c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T01%3A19%3A59Z&ske=2026-10-03T01%3A19%3A59Z&sks=b&skv=2026-02-06&sig=UBxeEeobV6yogN7%2Bus64P6bkzVhk37BorRcaOgw7%2BoI%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ENGINE_URL" -o /tmp/svga-engine.tar.gz
          mkdir -p /tmp/svga-engine
          tar -xzf /tmp/svga-engine.tar.gz -C /tmp/svga-engine
          find /tmp/svga-engine -maxdepth 3 -type f -print
      - name: Install engine assets
        run: |
          set -euo pipefail
          mkdir -p cache-bridge/gpt/engine
          cp /tmp/svga-engine/assets/v0853.engine.js cache-bridge/gpt/engine/v0853.engine.js
          cp /tmp/svga-engine/assets/v0853.css cache-bridge/gpt/engine/v0853.css
          cp /tmp/svga-engine/assets/v0853.body.html cache-bridge/gpt/engine/v0853.body.html
          cp /tmp/svga-engine/assets/v0853.json cache-bridge/gpt/engine/v0853.json
          node --check cache-bridge/gpt/engine/v0853.engine.js
          sha256sum cache-bridge/gpt/engine/v0853.engine.js
      - name: Commit imported engine
        run: |
          set -euo pipefail
          git config user.name "svga-editor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cache-bridge/gpt/engine/v0853.engine.js cache-bridge/gpt/engine/v0853.css cache-bridge/gpt/engine/v0853.body.html cache-bridge/gpt/engine/v0853.json
          if git diff --cached --quiet; then
            echo "Engine already current."
            exit 0
          fi
          git commit -m "Import GPT v0.8.53 native animation engine"
          git push origin HEAD:main
