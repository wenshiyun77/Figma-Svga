name: Deploy SVGA Cache Bridge

on:
  push:
    branches:
      - main
    paths:
      - 'cache-bridge/**'
      - '.github/workflows/cache-bridge-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload cache bridge
        uses: actions/upload-pages-artifact@v4
        with:
          path: cache-bridge

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
