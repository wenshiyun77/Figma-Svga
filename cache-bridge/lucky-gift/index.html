<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幸运礼物 · SVGA Editor</title>
<style>
:root {
  color-scheme: dark;
  font: 14px/1.45 system-ui, -apple-system, sans-serif;
  color: #f1effa;
  background: #121217;
  --line: #33323d;
  --muted: #a6a3b5;
  --accent: #b2aaff;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button, select, .duration {
  border: 1px solid var(--line); border-radius: 8px; background: #24232e;
}
button { min-height: 34px; padding: 5px 11px; cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
button:hover:not(:disabled) { border-color: var(--accent); }
:is(button,select,input):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 21px; line-height: 1.2; }
h2 { font-size: 14px; font-weight: 650; }
h3 { font-size: 13px; margin-bottom: 9px; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 12px 22px; border-bottom: 1px solid var(--line); background: #1b1a22;
}
.brand { display: grid; gap: 2px; }
.brand span, .spec { font-size: 12px; color: var(--muted); white-space: nowrap; }
#export-form { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.duration { display: flex; align-items: center; padding: 4px 8px; gap: 2px; }
.duration input { width: 65px; min-width: 0; background: transparent; border: 0; padding: 1px 3px; }
.primary { color: #1a132f; background: var(--accent); font-weight: 700; white-space: nowrap; }
.workspace {
  display: grid; grid-template-columns: clamp(190px, 19vw, 260px) minmax(270px,1fr) clamp(258px, 28vw, 340px);
  height: calc(100dvh - 70px);
}
.panel { background: #1b1a22; padding: 17px; overflow: auto; }
.panel h2 { margin-bottom: 13px; }
.media { border-right: 1px solid var(--line); }
.settings { border-left: 1px solid var(--line); }
.upload {
  width: 100%; min-height: 148px; display: grid; align-content: center; justify-items: center;
  gap: 6px; padding: 12px; border-style: dashed; color: var(--accent); overflow-wrap: anywhere;
}
.upload canvas { width: 100%; height: 128px; object-fit: contain; }
.upload small,.note,.file-info p,.preview-bar span,.playback span { color: var(--muted); font-size: 12px; }
.media.dragging .upload { border-color: var(--accent); background: #30274a; }
.file-info { padding: 12px 0 4px; overflow-wrap: anywhere; }
.note { margin-top: 10px; line-height: 1.55; }
.preview { display: flex; flex-direction: column; min-height: 0; }
.preview-bar,.playback {
  display: flex; align-items: center; gap: 8px; padding: 10px 15px; background: #1b1a22;
}
.preview-bar { justify-content: space-between; border-bottom: 1px solid var(--line); }
.playback { border-top: 1px solid var(--line); flex-wrap: wrap; }
.playback span { margin-left: auto; }
.preview-space {
  flex: 1; min-height: 0; display: grid; place-items: center;
  padding: 20px 25px; container-type: size;
}
.stage {
  position: relative; width: min(100cqw, calc(100cqh * 750 / 1624));
  aspect-ratio: 750 / 1624; outline: 1px solid #666379; background: #252430;
  background-image: conic-gradient(#2a2935 25%, #24232d 0 50%, #2a2935 0 75%, #24232d 0);
  background-size: 18px 18px;
}
.stage canvas { display: block; width: 100%; height: 100%; }
.fade-guide {
  position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed #b2aaff92;
  pointer-events: none;
}
.fade-guide button {
  position: absolute; right: 0; transform: translate(50%, -50%); width: 24px; height: 24px;
  min-height: 0; border: 0; padding: 0; background: transparent; cursor: ns-resize;
  touch-action: none; pointer-events: auto; display: grid; place-items: center;
}
.fade-guide button::after {
  content: ''; display: block; width: 10px; height: 10px;
  border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #302952;
}
.choice-label { margin-bottom: 6px; color: var(--muted); font-size: 12px; }
.categories {
  display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 3px;
  margin-bottom: 14px; padding: 4px; border: 1px solid var(--line); border-radius: 9px;
  background: #15141b;
}
.categories button {
  min-height: 27px; padding: 3px 4px; border: 0; border-radius: 5px;
  background: transparent; color: var(--muted); font-size: 12px;
}
.categories button:hover { background: #2a2834; color: #f1effa; }
.categories button[aria-pressed="true"] { background: var(--accent); color: #1a132f; font-weight: 700; }
.effects { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 6px; }
.effects button {
  display: flex; align-items: center; justify-content: space-between; gap: 7px;
  min-height: 34px; padding: 5px 9px; text-align: left; font-size: 12px;
}
.effects button[aria-pressed="true"] { color: #e4dfff; border-color: #a296ff; background: #302943; }
.effects button[aria-pressed="true"]::after {
  content: ''; flex: 0 0 5px; height: 9px; margin-right: 2px;
  border: solid var(--accent); border-width: 0 2px 2px 0; transform: rotate(45deg) translateY(-1px);
}
.controls { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
.field { display: grid; gap: 1px; margin-bottom: 4px; }
.field input { width: 100%; margin: 0; height: 18px; }
.timing { display: flex; justify-content: space-between; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.timing select { padding: 6px 7px; }
#status {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
  max-width: min(90vw,620px); padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: #24232e;
}
#status[data-error="true"] { border-color: #f399a6; color: #ffb7c3; }
@media(max-width: 780px) {
  .workspace { grid-template-columns: minmax(198px,1fr) minmax(214px,1fr); height: auto; }
  .preview { grid-column: 1 / -1; grid-row: 1; height: min(74dvh,650px); min-height: 340px; }
  .panel { border-top: 1px solid var(--line); padding: 12px; }
  .topbar { padding: 10px; }
}
@media(max-width: 425px) {
  .workspace { grid-template-columns: 1fr; }
  .spec { display: none; }
  .duration input { width: 50px; }
  #export-form > label { font-size: 11px; }
}
.bottom button { right: auto; left: 0; transform: translate(-50%, -50%); }

/* Default skin for every configuration range, including dynamically inserted controls.
   Keep each panel's width, height, grid and flex geometry intact. */
input[type="range"] {
  appearance: none !important;
  -webkit-appearance: none !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 3px !important;
  border: 0 !important;
  border-radius: 999px !important;
  background: linear-gradient(to right, #9b92ff var(--config-slider-fill, 50%), #3c3c46 var(--config-slider-fill, 50%)) !important;
}
input[type="range"]::-webkit-slider-thumb {
  appearance: none !important;
  -webkit-appearance: none !important;
  width: 10px !important;
  height: 10px !important;
  margin-top: -3.5px !important;
  border: 0 !important;
  border-radius: 50% !important;
  background: #b2aaff !important;
  box-shadow: 0 0 0 2px #18181f !important;
}
input[type="range"]::-moz-range-track {
  height: 3px !important;
  border: 0 !important;
  border-radius: 999px !important;
  background: linear-gradient(to right, #9b92ff var(--config-slider-fill, 50%), #3c3c46 var(--config-slider-fill, 50%)) !important;
}
input[type="range"]::-moz-range-progress { background: transparent !important; }
input[type="range"]::-moz-range-thumb {
  width: 10px !important;
  height: 10px !important;
  border: 0 !important;
  border-radius: 50% !important;
  background: #b2aaff !important;
  box-shadow: 0 0 0 2px #18181f !important;
}
input[type="range"]:focus-visible { outline: 1px solid #9b92ff !important; outline-offset: 3px; }
input[type="range"]:disabled { opacity: .35 !important; cursor: default; }
.field:has(input[type="range"]) > label {
  display: flex !important;
  align-items: center;
  justify-content: space-between !important;
  font-size: 11px !important;
  font-weight: 450 !important;
  line-height: 18px !important;
  letter-spacing: 0 !important;
  text-transform: none !important;
  color: rgba(255,255,255,.58) !important;
}
.field:has(input[type="range"]) > label span {
  font-weight: 500 !important;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0 !important;
  white-space: nowrap;
  color: #d9d7e9 !important;
}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span>SVGA Editor</span><h1>幸运礼物</h1></div>
  <form id="export-form">
    <label for="duration">导出时长</label>
    <div class="duration"><input id="duration" type="number" min="3.01" step="any" value="5" required><span>秒</span></div>
    <span class="spec">24 帧/秒</span>
    <button type="submit" class="primary" id="export" disabled>导出 SVGA</button>
  </form>
</header>
<main class="workspace">
  <aside class="media panel" aria-labelledby="media-title">
    <h2 id="media-title">主体素材</h2>
    <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp,image/avif,image/svg+xml,.png,.jpg,.jpeg,.gif,.webp,.bmp,.avif,.svg" hidden>
    <button id="upload" class="upload" type="button">
      <canvas id="thumbnail" role="img" aria-label="主体素材预览" hidden></canvas>
      <span id="upload-label">＋ 添加主体</span>
      <small id="upload-hint">点击添加或拖入图片</small>
    </button>
    <div id="file-info" class="file-info" hidden>
      <strong id="filename"></strong>
      <p id="metadata"></p>
    </div>
    <p id="material-note" class="note" hidden></p>
    <p class="note">支持 PNG、JPG、SVG 等静态图片，以及 GIF、WebP 动图。</p>
  </aside>
  <section class="preview" aria-labelledby="preview-title">
    <div class="preview-bar"><h2 id="preview-title">画布预览</h2><span>750 × 1624</span></div>
    <div class="preview-space">
      <div class="stage" id="stage">
        <canvas id="canvas" width="750" height="1624" aria-label="幸运礼物预览"></canvas>
        <div class="fade-guide top" id="top-guide"><button type="button" id="top-handle" aria-label="顶部淡入边界" role="slider" aria-orientation="vertical"></button></div>
        <div class="fade-guide bottom" id="bottom-guide"><button type="button" id="bottom-handle" aria-label="底部淡出边界" role="slider" aria-orientation="vertical"></button></div>
      </div>
    </div>
    <div class="playback">
      <button id="play" type="button">暂停</button>
      <button id="restart" type="button">从头播放</button>
      <span id="fade-label">顶部 0 px · 底部 0 px</span>
    </div>
  </section>
  <aside class="settings panel" aria-labelledby="settings-title">
    <h2 id="settings-title">动效配置</h2>
    <h3 id="category-label" class="choice-label">动效类型</h3>
    <div class="categories" id="categories" role="group" aria-labelledby="category-label"></div>
    <h3 id="effect-label" class="choice-label">动效</h3>
    <div class="effects" id="effects" role="group" aria-labelledby="effect-label"></div>
    <section class="controls">
      <h3>主体粒子</h3>
      <div id="appearance"></div>
    </section>
    <section class="controls">
      <h3>单个粒子怎么动</h3>
      <div id="movement"></div>
    </section>
    <section class="controls">
      <h3>粒子之间的关系</h3>
      <div id="group"></div>
      <label class="timing">出场节奏
        <select id="timing">
          <option value="staggered">错峰连续</option>
          <option value="together">同时出场</option>
          <option value="waves">分四批</option>
        </select>
      </label>
    </section>
  </aside>
</main>
<div id="status" role="status" aria-live="polite" hidden></div>
<script>
/* Presentation only: no synthetic input/change events, application state or timers per frame. */
(() => {
  if (window.__configSlidersInstalled) return;
  window.__configSlidersInstalled = true;
  const selector = 'input[type="range"]';
  function update(input) {
    if (!(input instanceof HTMLInputElement) || input.type !== 'range') return;
    const bound = (text, fallback) => text.trim() !== '' && Number.isFinite(Number(text)) ? Number(text) : fallback;
    const min = bound(input.min, 0), max = bound(input.max, 100);
    const fraction = max > min ? Math.max(0, Math.min(1, (input.valueAsNumber - min) / (max - min))) : 0;
    const fill = `${Number((fraction * 100).toFixed(6))}%`;
    if (input.style.getPropertyValue('--config-slider-fill') !== fill) input.style.setProperty('--config-slider-fill', fill);
  }
  // The browser does not emit input/change when application sync code assigns value.
  // Delegate to native setters first; preserve their validation and event semantics.
  for (const property of ['value', 'valueAsNumber']) {
    const descriptor = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, property);
    if (!descriptor?.set || !descriptor.configurable) continue;
    Object.defineProperty(HTMLInputElement.prototype, property, {
      ...descriptor,
      set(value) { descriptor.set.call(this, value); update(this); }
    });
  }
  // Native step methods also change the value without dispatching input/change.
  for (const method of ['stepUp', 'stepDown']) {
    const native = HTMLInputElement.prototype[method];
    HTMLInputElement.prototype[method] = function(...args) { const result = native.apply(this, args); update(this); return result; };
  }
  function scan(root) {
    if (root.nodeType !== 1 && root.nodeType !== 9) return;
    if (root.matches?.(selector)) update(root);
    root.querySelectorAll(selector).forEach(update);
  }
  document.addEventListener('input', event => update(event.target), true);
  document.addEventListener('change', event => update(event.target), true);
  document.addEventListener('reset', event => {
    const form = event.target;
    // Reset's default action occurs after the event dispatch.
    queueMicrotask(() => scan(form));
  }, true);
  const observer = new MutationObserver(records => {
    for (const record of records) {
      if (record.type === 'attributes') update(record.target);
      else record.addedNodes.forEach(scan);
    }
  });
  observer.observe(document, {subtree: true, childList: true, attributes: true, attributeFilter: ['type', 'value', 'min', 'max', 'step']});
  scan(document);
})();

/* SVGA native import core. No network, dependencies, or canvas side effects. */
(function installSVGAImportCore(root) {
  'use strict';
  const LIMITS = Object.freeze({ inputBytes: 64 * 1024 * 1024, expandedBytes: 128 * 1024 * 1024, zipEntries: 20000, sprites: 20000, frames: 100000, frameRecords: 1000000, fields: 2000000 });
  const utf8 = new TextDecoder('utf-8', { fatal: true }), encoder = new TextEncoder();
  const fail = (s) => { throw new Error('SVGA import: ' + s); };
  const bytes = (b) => { if (!(b instanceof Uint8Array)) fail('expected Uint8Array'); return b; };
  const join = (parts) => { const n = parts.reduce((v,b)=>v+b.length,0); if(n>LIMITS.expandedBytes) fail('message exceeds size limit'); const out=new Uint8Array(n);let p=0;for(const b of parts){out.set(b,p);p+=b.length;}return out; };
  const varint = (n) => { if (!Number.isSafeInteger(n) || n<0) fail('invalid integer'); const b=[]; do{const v=n%128;n=Math.floor(n/128);b.push(v|(n?128:0));}while(n);return Uint8Array.from(b); };
  const wire = (n,type,value) => join([varint(n*8+type),type===2?join([varint(value.length),value]):value]);
  const floatField = (n,value) => {if(!Number.isFinite(value))fail('non-finite number');const b=new Uint8Array(4);new DataView(b.buffer).setFloat32(0,value,true);return wire(n,5,b);};
  const strField = (n,value) => wire(n,2,encoder.encode(value));
  const intField = (n,value) => wire(n,0,varint(value));
  const fields = (b) => {
    const out=[];let p=0;
    const read = () => {let v=0n,s=0n;for(let i=0;i<10;i++){if(p>=b.length)fail('truncated protobuf varint');const c=b[p++];if(i===9 && c>1)fail('protobuf varint overflow');v|=BigInt(c&127)<<s;if(!(c&128))return v;s+=7n;}fail('invalid protobuf varint');};
    while(p<b.length){if(out.length>=LIMITS.fields)fail('too many protobuf fields');const start=p,t=read();if(t>0xffffffffn)fail('invalid protobuf tag');const tag=Number(t),n=tag>>>3,w=tag&7;if(!n)fail('invalid protobuf field zero');let value;
      if(w===0)value=read();else if(w===2){const count=read();if(count>BigInt(b.length-p))fail('truncated protobuf message');value=b.subarray(p,p+Number(count));p+=Number(count);}else if(w===1||w===5){const count=w===1?8:4;if(p+count>b.length)fail('truncated protobuf scalar');value=b.subarray(p,p+count);p+=count;}else fail('unsupported protobuf wire type '+w);
      out.push({number:n,wire:w,value,raw:b.subarray(start,p)});
    }return out;
  };
  const number = (f,type) => {if(type==='i'){if(f.wire!==0)fail('integer wire mismatch');return Number(BigInt.asIntN(32,f.value));}if(f.wire!==5)fail('float wire mismatch');const v=new DataView(f.value.buffer,f.value.byteOffset,4).getFloat32(0,true);if(!Number.isFinite(v))fail('non-finite protobuf float');return v;};
  const blob = (f) => {if(f.wire!==2)fail('message wire mismatch');return f.value;};
  const defs = {
    layout: {1:['x','f'],2:['y','f'],3:['width','f'],4:['height','f']},
    transform:{1:['a','f'],2:['b','f'],3:['c','f'],4:['d','f'],5:['tx','f'],6:['ty','f']},
    color:{1:['r','f'],2:['g','f'],3:['b','f'],4:['a','f']},
    path:{1:['d','s']},rect:{1:['x','f'],2:['y','f'],3:['width','f'],4:['height','f'],5:['cornerRadius','f']},
    ellipse:{1:['x','f'],2:['y','f'],3:['radiusX','f'],4:['radiusY','f']},
    styles:{1:['fill','color'],2:['stroke','color'],3:['strokeWidth','f'],4:['lineCap','i'],5:['lineJoin','i'],6:['miterLimit','f'],7:['lineDashI','f'],8:['lineDashII','f'],9:['lineDashIII','f']},
    shape:{1:['type','i'],2:['path','path'],3:['rect','rect'],4:['ellipse','ellipse'],10:['styles','styles'],11:['transform','transform']},
    frame:{1:['alpha','f'],2:['layout','layout'],3:['transform','transform'],4:['clipPath','s'],5:['shapes','shape',true]},
    sprite:{1:['imageKey','s'],2:['frames','frame',true],3:['matteKey','s']},
    audio:{1:['audioKey','s'],2:['startFrame','i'],3:['endFrame','i'],4:['startTime','i'],5:['totalTime','i']},
    params:{1:['viewBoxWidth','f'],2:['viewBoxHeight','f'],3:['fps','i'],4:['frames','i']}
  };
  const decode = (b,type) => {
    const def=defs[type],out={raw:b,unknownFields:[]};
    for(const [key,kind,repeated] of Object.values(def))if(repeated)out[key]=[];else if(kind==='s')out[key]='';else if(kind==='f'||kind==='i')out[key]=0;
    for(const f of fields(b)){const d=def[f.number];if(!d){out.unknownFields.push(f.raw);continue;}const [key,kind,repeated]=d;const v=kind==='s'?utf8.decode(blob(f)):(kind==='f'||kind==='i')?number(f,kind):decode(blob(f),kind);if(repeated)out[key].push(v);else {if(type==='shape'&&['path','rect','ellipse'].includes(key)){delete out.path;delete out.rect;delete out.ellipse;}out[key]=v;}}
    return out;
  };
  const encode = (obj,type,raw=true) => {
    if(raw && obj.raw)return obj.raw;
    const parts=[];for(const [n,[key,kind,repeated]] of Object.entries(defs[type])){if(obj[key]==null)continue;for(const v of repeated?obj[key]:[obj[key]])parts.push(kind==='s'?strField(+n,v):kind==='f'?floatField(+n,v):kind==='i'?intField(+n,v):wire(+n,2,encode(v,kind)));}return join(parts.concat(obj.unknownFields||[]));
  };
  const validate = (m) => {
    const p=m.params;if(!p||!(p.viewBoxWidth>0)||!(p.viewBoxHeight>0)||p.viewBoxWidth>32768||p.viewBoxHeight>32768)fail('invalid or oversized canvas');
    if(!Number.isInteger(p.fps)||p.fps<1||p.fps>240||!Number.isInteger(p.frames)||p.frames<1||p.frames>LIMITS.frames)fail('invalid or oversized timeline');
    if(m.sprites.length>LIMITS.sprites||m.sprites.reduce((s,x)=>s+x.frames.length,0)>LIMITS.frameRecords)fail('too many sprite frame records');
    return m;
  };
  function decodeMovie(input, onProgress) {
    bytes(input);if(input.length>LIMITS.expandedBytes)fail('movie exceeds size limit');const b=input.slice();
    const m={version:'',params:null,images:new Map(),imageEntries:new Map(),sprites:[],audios:[],unknownFields:[],raw:b};
    const movieFields=fields(b);let decodedFields=0;
    for(const f of movieFields){
      if(onProgress && decodedFields++%32===0)onProgress(decodedFields/movieFields.length);
      if(f.number===1)m.version=utf8.decode(blob(f));else if(f.number===2)m.params=decode(blob(f),'params');
      else if(f.number===3){let key='',value=new Uint8Array();const extras=[];for(const e of fields(blob(f))){if(e.number===1)key=utf8.decode(blob(e));else if(e.number===2)value=blob(e);else extras.push(e.raw);}m.images.set(key,value);m.imageEntries.set(key,{raw:blob(f),value,unknownFields:extras});}
      else if(f.number===4)m.sprites.push(decode(blob(f),'sprite'));else if(f.number===5)m.audios.push(decode(blob(f),'audio'));else m.unknownFields.push(f.raw);
    }
    return validate(m);
  }
  function patchFrame(frame,patch={}) {
    const updates={1:'alpha',2:'layout',3:'transform'},present=new Set(Object.keys(updates).filter(n=>Object.prototype.hasOwnProperty.call(patch,updates[n])).map(Number));
    const original=frame.raw||encode(frame,'frame',false),parts=fields(original).filter(f=>!present.has(f.number)).map(f=>f.raw);
    for(const n of present){const key=updates[n],v=patch[key];if(v==null)continue;parts.push(n===1?floatField(n,v):wire(n,2,encode(v,key,false)));}return join(parts);

          thumbnailContext.drawImage(atlas, x, y, width, height, 0, 0, width, height);
          lastThumbnailCell = cell;
        }
        for (const particle of sampler()(progress)) {
          if (particle.alpha <= 0) continue;
          const scale = particle.size / Math.max(width, height);
          context.save();
          context.translate(particle.x, particle.y);
          context.rotate(particle.angle);
          context.globalAlpha = particle.alpha;
          context.drawImage(atlas, x, y, width, height, -width * scale / 2, -height * scale / 2, width * scale, height * scale);
          context.restore();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  function restart() {
    started = performance.now();
    pausedAt = 0;
    lastFrame = -1;
  }
  function renderEffects() {
    for (const [index, button] of [...$("categories").children].entries()) {
      button.setAttribute("aria-pressed", index === category);
    }
    const selected = selectedEffects[category];
    const current = categories[category];
    $("motion-amplitude").firstChild.textContent = current.tuning;
    $("effects").replaceChildren(...current.effects.map(([name], index) => choice(name, index === selected, () => {
      selectedEffects[category] = index;
      for (const [position, button] of [...$("effects").children].entries()) {
        button.setAttribute("aria-pressed", position === index);
      }
      restart();
    })));
    restart();
  }
  function choice(name, active, action) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = name;
    button.setAttribute("aria-pressed", active);
    button.addEventListener("click", action);
    return button;
  }
  var sliderSpecs = {
    appearance: [
      ["size", "\u5927\u5C0F", 24, 320, 1, " px"],
      ["variance", "\u5927\u5C0F\u5DEE\u5F02", 0, 70, 1, "%"],
      ["opacity", "\u4E0D\u900F\u660E\u5EA6", 10, 100, 1, "%"],
      ["rotation", "\u521D\u59CB\u89D2\u5EA6", -180, 180, 1, "\xB0"]
    ],
    movement: [
      ["cycles", "\u5FAA\u73AF\u901F\u5EA6", 1, 5, 1, " \u5708"],
      ["amplitude", "\u79FB\u52A8\u5E45\u5EA6", 25, 160, 1, "%"],
      ["spin", "\u81EA\u8F6C", -3, 3, 1, " \u5708"],
      ["pulse", "\u7F29\u653E\u5E45\u5EA6", 0, 60, 1, "%"]
    ],
    group: [
      ["count", "\u7C92\u5B50\u6570\u91CF", 1, 48, 1, " \u4E2A"],
      ["spread", "\u6574\u4F53\u5206\u5E03", 30, 130, 1, "%"]
    ]
  };
  function slider([key, label, min, max, step, unit]) {
    const field = document.createElement("div");
    field.className = "field";
    const input = Object.assign(document.createElement("input"), {
      type: "range",
      id: key,
      min,
      max,
      step,
      value: settings[key]
    });
    const caption = Object.assign(document.createElement("label"), { htmlFor: key, id: "motion-" + key });
    const value = document.createElement("span");
    caption.append(label, value);
    value.textContent = input.value + unit;
    input.addEventListener("input", () => {
      settings[key] = input.valueAsNumber;
      value.textContent = input.value + unit;
      refresh();
    });
    field.append(caption, input);
    return field;
  }
  function bindGuide(key) {
    const guide = $(key + "-guide");
    const handle = $(key + "-handle");
    const top = key === "top";
    const lower = () => top ? 0 : settings.top;
    const upper = () => top ? settings.bottom : HEIGHT;
    function render() {
      const y = settings[key];
      guide.style.top = y / HEIGHT * 100 + "%";
      handle.setAttribute("aria-valuemin", lower());
      handle.setAttribute("aria-valuemax", upper());
      handle.setAttribute("aria-valuenow", y);
      handle.setAttribute("aria-valuetext", y + " px");
    }
    function set(y) {
      settings[key] = clamp(Math.round(y), lower(), upper());
      refresh();
      render();
      $(top ? "bottom-handle" : "top-handle").setAttribute(top ? "aria-valuemin" : "aria-valuemax", settings[key]);
      $("fade-label").textContent = `\u9876\u90E8 ${settings.top} px \xB7 \u5E95\u90E8 ${HEIGHT - settings.bottom} px`;
    }
    render();
    let pointer, grab;
    function yAt(event) {
      const rect = stage.getBoundingClientRect();
      return (event.clientY - rect.top) / rect.height * HEIGHT;
    }
    handle.addEventListener("pointerdown", (event) => {
      if (!event.isPrimary || event.button !== 0) return;
      pointer = event.pointerId;
      grab = yAt(event) - settings[key];
      handle.setPointerCapture(pointer);
    });
    handle.addEventListener("pointermove", (event) => {
      if (event.pointerId === pointer) set(yAt(event) - grab);
    });
    handle.addEventListener("lostpointercapture", () => {
      pointer = void 0;
    });
    handle.addEventListener("keydown", (event) => {
      const step = event.shiftKey ? 10 : 1;
      const change = { ArrowUp: settings[key] - step, ArrowDown: settings[key] + step, Home: lower(), End: upper() };
      if (event.key in change) {
        event.preventDefault();
        set(change[event.key]);
      }
    });
  }
  async function selectFile(file) {
    if (!file || exporting) return;
    pending?.abort();
    const controller = new AbortController();
    pending = controller;
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.src = url;
    updateExport();
    notify("\u6B63\u5728\u8BFB\u53D6\u4E3B\u4F53\u7D20\u6750\u2026");
    try {
      await image.decode();
      const next = await loadMaterial(file, image, controller.signal);
      controller.signal.throwIfAborted();
      material = next;
      thumbnail.width = next.width;
      thumbnail.height = next.height;
      thumbnail.hidden = false;
      $("upload-label").textContent = "\u66FF\u6362\u4E3B\u4F53";
      $("upload-hint").textContent = "\u70B9\u51FB\u9009\u62E9\u6216\u62D6\u5165\u65B0\u7D20\u6750";
      $("filename").textContent = file.name;
      $("metadata").textContent = `${image.naturalWidth} \xD7 ${image.naturalHeight} px \xB7 ${formatSize(file.size)}`;
      $("file-info").hidden = false;
      $("material-note").hidden = !next.sampled;
      $("material-note").textContent = next.sampled ? `\u52A8\u56FE\u5DF2\u5408\u6210\u4E3A ${next.cells.length} \u5E27\u3002` : "";
      restart();
      notify("");
    } catch (error) {
      if (!controller.signal.aborted) {
        notify(error instanceof DOMException ? "\u65E0\u6CD5\u6253\u5F00\u8FD9\u5F20\u56FE\u7247\uFF0C\u8BF7\u68C0\u67E5\u683C\u5F0F\u6216\u6587\u4EF6\u662F\u5426\u635F\u574F\u3002" : error.message, true);
      }
    } finally {
      URL.revokeObjectURL(url);
      if (pending === controller) {
        pending = null;
        updateExport();
      }
    }
  }
  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const anchor = Object.assign(document.createElement("a"), { href: url, download: name });
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3e4);
  }
  $("export-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!material || pending || exporting || !duration.reportValidity()) return;
    const frames = currentFrameCount();
    if (frames > 1e5 || frames * settings.count > 1e6) {
      notify("\u5F53\u524D\u65F6\u957F\u4E0E\u7C92\u5B50\u6570\u91CF\u8D85\u51FA\u5BFC\u51FA\u8303\u56F4\u3002\u8BF7\u7F29\u77ED\u65F6\u957F\u6216\u51CF\u5C11\u7C92\u5B50\u3002", true);
      return;
    }
    const sample = sampler();
    const count = settings.count;
    exporting = true;
    updateExport();
    notify("\u6B63\u5728\u751F\u6210\u5E76\u538B\u7F29 SVGA\u2026");
    try {
      await new Promise((resolve) => setTimeout(resolve, 20));
      const blob = await exportMovie(material, sample, frames, count, window.optimizeLuckyGiftAtlas);
      const sourceName = $("filename").textContent.replace(/\.[^.]+$/, "");
      download(blob, sourceName + "-\u5E78\u8FD0\u793C\u7269.svga");
      notify("");
    } catch (error) {
      console.error(error);
      notify("SVGA \u5BFC\u51FA\u5931\u8D25\u3002\u8BF7\u51CF\u5C11\u7C92\u5B50\u6570\u91CF\u6216\u7F29\u77ED\u65F6\u957F\u540E\u91CD\u8BD5\u3002", true);
    } finally {
      exporting = false;
      updateExport();
    }
  });
  $("file").addEventListener("change", (event) => {
    void selectFile(event.target.files[0]);
    event.target.value = "";
  });
  $("upload").addEventListener("click", () => $("file").click());
  var media = document.querySelector(".media");
  for (const type of ["dragover", "drop"]) {
    document.addEventListener(type, (event) => {
      if (event.dataTransfer.types.includes("Files")) event.preventDefault();
    });
  }
  media.addEventListener("dragover", (event) => {
    if (!event.dataTransfer.types.includes("Files")) return;
    event.dataTransfer.dropEffect = exporting ? "none" : "copy";
    media.classList.add("dragging");
  });
  media.addEventListener("dragleave", (event) => {
    if (!media.contains(event.relatedTarget)) media.classList.remove("dragging");
  });
  document.addEventListener("drop", (event) => {
    media.classList.remove("dragging");
    if (event.dataTransfer.files.length) void selectFile(event.dataTransfer.files[0]);
  });
  $("play").addEventListener("click", (event) => {
    const now = performance.now();
    if (playing) pausedAt = now - started;
    else started = now - pausedAt;
    playing = !playing;
    event.currentTarget.textContent = playing ? "\u6682\u505C" : "\u64AD\u653E";
  });
  $("restart").addEventListener("click", () => {
    playing = true;
    $("play").textContent = "\u6682\u505C";
    restart();
  });
  $("timing").addEventListener("change", (event) => {
    settings.timing = event.target.value;
    refresh();
  });
  duration.addEventListener("input", restart);
  for (const [id, specs] of Object.entries(sliderSpecs)) $(id).append(...specs.map(slider));
  $("categories").append(...categories.map(({ name }, index) => choice(name, index === 0, () => {
    category = index;
    renderEffects();
  })));
  bindGuide("top");
  bindGuide("bottom");
  renderEffects();
  requestAnimationFrame(draw);
})();

</script>
