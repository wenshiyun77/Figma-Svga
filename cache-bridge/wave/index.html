<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声浪实验室</title><link rel="stylesheet" href="./styles.css?v=20261010"><style>html,body{height:100%;margin:0;background:#0c0b11;color:#e8e3f0}.stage-viewport{display:grid;place-items:center;overflow:hidden}.stage-canvas-world{min-width:0;min-height:0;width:auto;height:auto;padding:0}.canvas-frame{position:relative}.preview-canvas{position:absolute;inset:0;width:100%;height:100%}#exportModal{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:80;background:#21162f;color:#dfceff;padding:12px 20px;border-radius:10px;pointer-events:none}#exportModal[hidden]{display:none}#projectSettingsPopover{z-index:70;background:#19131f;padding:14px;border:1px solid #453353;display:grid;gap:9px}#projectSettingsPopover[hidden]{display:none}.wave-web-exports{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-left:auto}.wave-web-exports input{width:48px}.wave-web-exports button{color:#d5c4ff;background:#8b5cf619;border:1px solid #8b5cf655;border-radius:6px;padding:8px;cursor:pointer;font-size:11px}.wave-web-exports button[data-wave-web-export=pag]{background:#8b5cf6;color:white}button:disabled{opacity:.45;cursor:wait}#waveBackBtn,#waveSaveImage,.left-user-footer,.window-controls{display:none!important}.wave-stage-controls>button{flex:0 0 auto}.wave-shortcut{display:none!important}#waveWebStatus{font-size:10px;color:#ae9bc2}@media(max-width:1100px){.wave-web-exports{flex:1 0 100%;justify-content:flex-end}}</style></head><body><main class="app editor-shell"><section class="editor-layout"><aside class="left-sidebar"></aside><section class="stage"><div id="stageViewport" class="stage-viewport"><div id="stageCanvasWorld" class="stage-canvas-world"><div id="canvasFrame" class="canvas-frame"><canvas id="previewCanvas"></canvas></div></div></div></section><aside class="right-sidebar"></aside></section></main><input id="waveProjectInput" type="file" accept=".json" hidden><div class="project-settings-menu"><button id="projectSettingsBtn" type="button" title="画布与动画设置">⚙</button><div id="projectSettingsPopover" class="project-settings-popover" hidden><strong>画布与动画</strong><button id="projectSettingsCloseBtn" type="button" aria-label="关闭画布设置">×</button><label>宽度<input id="waveCanvasWidth" type="number" min="32" max="2048" value="300"></label><label>高度<input id="waveCanvasHeight" type="number" min="32" max="2048" value="300"></label><label>帧率<input id="fps" type="number" min="1" max="60" value="24"></label><label>时长（秒）<input id="exportDuration" type="number" min="0.5" max="30" step="0.5" value="3"></label><label class="field" hidden><select id="materialType"></select></label><label class="field" hidden><select id="svgaQuality"></select></label><div class="project-settings-license-slot" hidden></div></div></div><div id="exportModal" hidden role="status"><strong id="exportTitle"></strong><div id="exportDetail"></div></div><script src="./runtime.js?v=20261010"></script></body></html>
