  }

  function renderRulers() {
    syncGuideToolbar();
    if (!state.image || !state.rulersVisible) return;

    const size = 24;
    const stageW = Math.max(size + 1, els.stage.clientWidth);
    const stageH = Math.max(size + 1, els.stage.clientHeight);
    const hW = Math.max(1, stageW - size);
    const vH = Math.max(1, stageH - size);

    // 标尺本身由 CSS 固定在编辑区边缘，这里只负责尺寸和刻度。
    const hctx = prepareRulerCanvas(els.horizontalRuler, hW, size);
    const vctx = prepareRulerCanvas(els.verticalRuler, size, vH);
    const major = rulerMajorStep();
    const minor = major / 5;

    const drawBase = (ctx, w, h, horizontal) => {
      ctx.fillStyle = '#1b1f25';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#343a44';
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (horizontal) {
        ctx.moveTo(0, h - .5); ctx.lineTo(w, h - .5);
      } else {
        ctx.moveTo(w - .5, 0); ctx.lineTo(w - .5, h);
      }
      ctx.stroke();
      ctx.fillStyle = '#8f96a2';
      ctx.font = '9px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textBaseline = 'top';
    };
    drawBase(hctx, hW, size, true);
    drawBase(vctx, size, vH, false);

    // 画布可能在编辑区中居中，或因为滚动而离开视口。
    // 轨道固定不动，只把刻度平移到“当前画布在视口中的实际位置”。
    const canvasRect = els.mainCanvas.getBoundingClientRect();
    const viewportRect = els.stageViewport.getBoundingClientRect();
    const canvasOffsetX = canvasRect.left - viewportRect.left;
    const canvasOffsetY = canvasRect.top - viewportRect.top;

    // 单帧局部坐标重复：每一列 / 每一行都从 0 重新计数。
    for (let col = 0; col < state.cols && colFrameCount(col) > 0; col++) {
      const base = col * state.cellW;
      for (let value = 0; value < state.cellW - .001; value += minor) {
        const px = canvasOffsetX + (base + value) * state.stageScale;
        if (px < -20 || px > hW + 20) continue;
        const majorTick = Math.abs((value / major) - Math.round(value / major)) < .001;
        hctx.strokeStyle = value === 0 ? '#929aa6' : (majorTick ? '#747c88' : '#4b525c');
        hctx.beginPath();
        hctx.moveTo(Math.round(px) + .5, size);
        hctx.lineTo(Math.round(px) + .5, size - (value === 0 ? 13 : (majorTick ? 10 : 5)));
        hctx.stroke();
        if (majorTick && px > -18 && px < hW - 18) {
          hctx.fillStyle = value === 0 ? '#c0c6cf' : '#9ba2ad';
          hctx.fillText(String(Math.round(value)), px + 3, 2);
        }
      }
    }

    for (let row = 0; row < state.rows && rowFrameCount(row) > 0; row++) {
      const base = row * state.cellH;
      for (let value = 0; value < state.cellH - .001; value += minor) {
        const py = canvasOffsetY + (base + value) * state.stageScale;
        if (py < -20 || py > vH + 20) continue;
        const majorTick = Math.abs((value / major) - Math.round(value / major)) < .001;
        vctx.strokeStyle = value === 0 ? '#929aa6' : (majorTick ? '#747c88' : '#4b525c');
        vctx.beginPath();
        vctx.moveTo(size, Math.round(py) + .5);
        vctx.lineTo(size - (value === 0 ? 13 : (majorTick ? 10 : 5)), Math.round(py) + .5);
        vctx.stroke();
        if (majorTick && py > -18 && py < vH - 18) {
          vctx.save();
          vctx.translate(2, py + 17);
          vctx.rotate(-Math.PI / 2);
          vctx.fillStyle = value === 0 ? '#c0c6cf' : '#9ba2ad';
          vctx.fillText(String(Math.round(value)), 0, 0);
          vctx.restore();
        }
      }
    }

    if (state.guidesVisible) {
      for (const g of state.guides) {
        const selected = g.id === state.selectedGuideId;
        const color = selected ? '#f4c96b' : '#45bfff';
        if (g.orientation === 'v') {
          for (let col = 0; col < state.cols && colFrameCount(col) > 0; col++) {
            const x = canvasOffsetX + (col * state.cellW + g.position) * state.stageScale;
            if (x < -8 || x > hW + 8) continue;
            hctx.fillStyle = color;
            hctx.beginPath();
            hctx.moveTo(x, size - 1); hctx.lineTo(x - 4, size - 7); hctx.lineTo(x + 4, size - 7); hctx.closePath(); hctx.fill();
          }
        } else {
          for (let row = 0; row < state.rows && rowFrameCount(row) > 0; row++) {
            const y = canvasOffsetY + (row * state.cellH + g.position) * state.stageScale;
            if (y < -8 || y > vH + 8) continue;
            vctx.fillStyle = color;
            vctx.beginPath();
            vctx.moveTo(size - 1, y); vctx.lineTo(size - 7, y - 4); vctx.lineTo(size - 7, y + 4); vctx.closePath(); vctx.fill();
          }
        }
      }
    }
  }

  function guideSegments(g) {
    const segments = [];
    if (g.orientation === 'h') {
      for (let row = 0; row < state.rows; row++) {
        const count = rowFrameCount(row);
        if (!count) continue;
        segments.push({
          left: 0,
          top: (row * state.cellH + g.position) * state.stageScale,
          width: count * state.cellW * state.stageScale,
          height: 1
        });
      }
    } else {
      for (let col = 0; col < state.cols; col++) {
        const count = colFrameCount(col);
        if (!count) continue;
        segments.push({
          left: (col * state.cellW + g.position) * state.stageScale,
          top: 0,
          width: 1,
          height: count * state.cellH * state.stageScale
        });
      }
    }
    return segments;
  }

  function appendGuideSegments(frag, guide, { preview = false } = {}) {
    const segments = guideSegments(guide);
    segments.forEach((seg, index) => {
      const line = document.createElement('div');
      const selected = !preview && guide.id === state.selectedGuideId;
      line.className = `guide ${guide.orientation === 'v' ? 'vertical' : 'horizontal'} ${selected ? 'selected' : ''} ${preview ? 'preview' : ''}`;
      if (!preview) line.dataset.guideId = String(guide.id);
      line.style.left = `${seg.left}px`;
      line.style.top = `${seg.top}px`;
      if (guide.orientation === 'v') line.style.height = `${seg.height}px`;
      else line.style.width = `${seg.width}px`;
      if (!preview && selected && index === 0) {
        const label = document.createElement('span');
        label.className = 'guide-label';
        label.textContent = `${guide.orientation === 'v' ? 'X' : 'Y'} ${Math.round(guide.position)} px · ${guide.orientation === 'v' ? '每列同步' : '每行同步'}`;
        line.appendChild(label);
      }
      if (!preview) line.addEventListener('pointerdown', ev => beginGuideMove(guide.id, ev));
      frag.appendChild(line);
    });
  }

  function renderGuides() {
    syncGuideToolbar();
    els.guideLayer.innerHTML = '';
    if (!state.image || !state.guidesVisible) return;
    const frag = document.createDocumentFragment();
    for (const g of state.guides) appendGuideSegments(frag, g);
    const gd = state.guideDrag;
    if (gd && gd.mode === 'new' && gd.valid && Number.isFinite(gd.position)) {
      appendGuideSegments(frag, { id: -1, orientation: gd.orientation, position: gd.position }, { preview: true });
    }
    els.guideLayer.appendChild(frag);
  }

  function guidePointFromEvent(ev) {
    const rect = els.canvasStack.getBoundingClientRect();
    const x = (ev.clientX - rect.left) / state.stageScale;
    const y = (ev.clientY - rect.top) / state.stageScale;
    return {
      x, y,
      insideCanvas: x >= 0 && x <= stageWidth() && y >= 0 && y <= stageHeight()
    };
  }

  function guidePositionForEvent(orientation, ev) {
    const p = guidePointFromEvent(ev);
    let position = 0;
    if (orientation === 'v') {
      const col = clamp(Math.floor(p.x / Math.max(.0001, state.cellW)), 0, Math.max(0, state.cols - 1));
      position = p.x - col * state.cellW;
      position = clamp(position, 0, state.cellW);
    } else {
      const row = clamp(Math.floor(p.y / Math.max(.0001, state.cellH)), 0, Math.max(0, state.rows - 1));
      position = p.y - row * state.cellH;
      position = clamp(position, 0, state.cellH);
    }
    const frameIndex = p.insideCanvas ? frameAtPoint(p) : -1;
    return { position, inside: frameIndex >= 0, point: p, frameIndex };
  }

  function showRulerTip(ev, orientation, position) {
    const stageRect = els.stage.getBoundingClientRect();
    els.rulerTip.textContent = `${orientation === 'v' ? 'X' : 'Y'} ${Math.round(position)} px · ${orientation === 'v' ? '每列同步' : '每行同步'}`;
    els.rulerTip.style.left = `${ev.clientX - stageRect.left + 10}px`;
    els.rulerTip.style.top = `${ev.clientY - stageRect.top + 10}px`;
    els.rulerTip.style.display = 'block';
  }

  function hideRulerTip() { els.rulerTip.style.display = 'none'; }

  function beginGuideFromRuler(orientation, ev) {
    if (!state.image || ev.button !== 0 || !state.rulersVisible) return;
    ev.preventDefault();
    state.selectedGuideId = null;
    const pos = guidePositionForEvent(orientation, ev);
    state.guideDrag = { mode: 'new', orientation, position: pos.position, valid: pos.inside };
    renderGuides();
    renderRulers();
    showRulerTip(ev, orientation, pos.position);
  }

  function beginGuideMove(id, ev) {
    if (!state.image || ev.button !== 0 || !state.guidesVisible) return;
    const guide = state.guides.find(g => g.id === id);
    if (!guide) return;
    ev.preventDefault();
    ev.stopPropagation();
    state.selectedGuideId = id;
    state.guideDrag = {
      mode: 'move', id, orientation: guide.orientation, startPosition: guide.position,
      startClientX: ev.clientX, startClientY: ev.clientY, changed: false, historyPushed: false
    };
    renderGuides();
    renderRulers();
    showRulerTip(ev, guide.orientation, guide.position);
  }

  function handleGuidePointerMove(ev) {
    const gd = state.guideDrag;
    if (!state.image || !gd) return;
    if (gd.mode === 'new') {
      const pos = guidePositionForEvent(gd.orientation, ev);
      gd.position = pos.position;
      gd.valid = pos.inside;
      renderGuides();
      showRulerTip(ev, gd.orientation, gd.position);
      return;
    }
    const guide = state.guides.find(g => g.id === gd.id);
    if (!guide) return;
    const clientDelta = gd.orientation === 'v' ? ev.clientX - gd.startClientX : ev.clientY - gd.startClientY;
    if (!gd.changed && Math.abs(clientDelta) >= 2) {
      pushHistory();
      gd.historyPushed = true;
      gd.changed = true;
    }
    if (gd.changed) {
      const delta = clientDelta / Math.max(.0001, state.stageScale);
      const limit = gd.orientation === 'v' ? state.cellW : state.cellH;
      guide.position = clamp(gd.startPosition + delta, 0, limit);
    }
    renderGuides();
    renderRulers();
    showRulerTip(ev, gd.orientation, guide.position);
  }

  function handleGuidePointerUp(ev) {
    const gd = state.guideDrag;
    if (!gd) return;
    if (gd.mode === 'new') {
      const pos = guidePositionForEvent(gd.orientation, ev);
      if (pos.inside) {
        pushHistory();
        const guide = { id: nextGuideId++, orientation: gd.orientation, position: pos.position };
        state.guides.push(guide);
        state.selectedGuideId = guide.id;
      }
    }
    state.guideDrag = null;
    hideRulerTip();
    renderAll();
  }

  function deleteSelectedGuide() {
    if (state.selectedGuideId == null) return;
    const exists = state.guides.some(g => g.id === state.selectedGuideId);
    if (!exists) return;
    pushHistory();
    state.guides = state.guides.filter(g => g.id !== state.selectedGuideId);
    state.selectedGuideId = null;
    renderAll();
  }

  function clearGuides() {
    if (!state.image || !state.guides.length) return;
    pushHistory();
    state.guides = [];
    state.selectedGuideId = null;
    renderAll();
  }

  function toggleGuides() {
    if (!state.image) return;
    pushHistory();
    state.guidesVisible = !state.guidesVisible;
    if (!state.guidesVisible) state.selectedGuideId = null;
    renderAll();
  }

  function toggleRulers() {
    if (!state.image) return;
    pushHistory();
    state.rulersVisible = !state.rulersVisible;
    syncGuideToolbar();
    requestAnimationFrame(fitStage);
  }

  function renderMainCanvas() {
    if (!state.image) return;
    const canvas = els.mainCanvas;
    const w = Math.max(1, stageWidth());
    const h = Math.max(1, stageHeight());
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    const rd = state.reorderDrag;
    const dragIds = new Set(rd?.selectedIds || []);
    for (let i = 0; i < state.frameCount; i++) {
      const { col, row } = positionCellOrigin(i);
      if (rd && dragIds.has(state.frames[i]?.id)) {
        drawReorderSlot(ctx, i, false);
        continue;
      }
      drawFrame(ctx, i, col * state.cellW, row * state.cellH, state.cellW, state.cellH, {
        border: true,
        selected: isFrameSelected(i),
        selectionRank: state.selectedOrderIds.length > 1 ? selectionRank(i) : 0
      });
    }
    if (rd) {
      const count = Math.max(1, rd.selectedIds.length);
      const targetStart = clamp(rd.target, 0, Math.max(0, state.frameCount - count));
      for (let j = 0; j < count; j++) drawReorderSlot(ctx, targetStart + j, true);
      const gx = rd.currentX - rd.grabOffsetX;
      const gy = rd.currentY - rd.grabOffsetY;
      rd.selectedIds.forEach((id, order) => {
        const index = frameIndexById(id);
        if (index < 0) return;
        const offset = order * Math.max(5, 8 / state.stageScale);
        drawFrame(ctx, index, gx + offset, gy + offset, state.cellW, state.cellH, {
          border: true,
          selected: true,
          selectionRank: order + 1,
          alpha: Math.max(.62, .92 - order * .04),
          displayIndex: index
        });
      });
    }
    canvas.style.width = `${w * state.stageScale}px`;
    canvas.style.height = `${h * state.stageScale}px`;
    els.canvasStack.style.width = `${w * state.stageScale}px`;
    els.canvasStack.style.height = `${h * state.stageScale}px`;
    renderRulers();
    renderGuides();
  }

  function renderPreview(index = state.playIndex) {
    if (!state.image || index < 0 || index >= state.frameCount) return;
    const max = 360;
    let outW = Math.round(state.cellW);
    let outH = Math.round(state.cellH);
    const scale = Math.min(1, max / Math.max(outW, outH));
    outW = Math.max(1, Math.round(outW * scale));
    outH = Math.max(1, Math.round(outH * scale));
    const canvas = els.previewCanvas;
    canvas.width = outW;
    canvas.height = outH;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, outW, outH);
    drawFrame(ctx, index, 0, 0, outW, outH);
    els.previewInfo.textContent = `第 ${index+1}/${state.frameCount} 帧 · ${state.frames[index].name} · ${Math.round(state.cellW)} × ${Math.round(state.cellH)}px${state.importedAnimated ? ` · ${getFrameDurationMs(index)}ms` : ''}`;
  }

  function clearListDropTargets() {
    els.frameList.querySelectorAll('.dragging,.drop-target').forEach(el => el.classList.remove('dragging', 'drop-target'));
  }

  function renderFrameList() {
    els.frameList.innerHTML = '';
    const selectedCount = state.selectedOrderIds.length;
    els.frameListMeta.textContent = state.image
      ? `${state.frameCount || 0} 帧 · Shift 多选${selectedCount > 1 ? ` · 已选 ${selectedCount} 帧` : ''} · 可拖拽换序`
      : '0 帧';
    if (!state.image) return;
    const frag = document.createDocumentFragment();
    state.frames.forEach((f, i) => {
      const item = document.createElement('div');
      const rank = selectionRank(i);
      const multiRank = selectedCount > 1 ? rank : 0;
      item.className = `frame-item ${multiRank ? 'multi-selected' : ''} ${i === state.selected ? 'active' : ''}`;
      item.dataset.index = i;
      item.dataset.frameId = String(f.id);
      if (multiRank) item.dataset.selectOrder = String(multiRank);
      item.draggable = true;
      item.innerHTML = `<div class="frame-num">${i + 1}</div><div class="frame-name"></div><div class="frame-transform"></div>`;
      item.querySelector('.frame-name').textContent = f.name;
      item.querySelector('.frame-transform').textContent = `${Math.round(f.scale * 100)}% · ${Math.round(f.dx)},${Math.round(f.dy)}`;
      item.addEventListener('click', e => selectFrame(i, e.shiftKey));
      item.addEventListener('dragstart', e => {
        if (!isFrameSelected(i)) setSingleSelection(i);
        else state.selected = i;
        state.listDragFrom = i;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(i));
      });
      item.addEventListener('dragover', e => {
        e.preventDefault();
        clearListDropTargets();
        els.frameList.querySelectorAll('.frame-item').forEach(row => {
          const id = Number(row.dataset.frameId);
          if (state.selectedOrderIds.includes(id)) row.classList.add('dragging');
        });
        item.classList.add('drop-target');
        e.dataTransfer.dropEffect = 'move';
      });
      item.addEventListener('drop', e => {
        e.preventDefault();
        const from = state.listDragFrom;
        state.listDragFrom = -1;
        clearListDropTargets();
        if (from >= 0) moveSelectedFramesTo(i);
      });
      item.addEventListener('dragend', () => {
        state.listDragFrom = -1;
        clearListDropTargets();
        renderFrameList();
      });
      frag.appendChild(item);
    });
    els.frameList.appendChild(frag);
  }

  function syncSelectedControls() {
    const f = state.frames[state.selected];
    const enabled = !!f;
    [els.frameName, els.scaleRange, els.eraseSizeRange].forEach(el => el.disabled = !enabled);
    els.resetFrameBtn.disabled = !enabled;
    els.copyPrevBtn.disabled = !enabled || state.selected <= 0;
    els.clearEraseBtn.disabled = !enabled || !hasErasePaths(f);
    els.columnCount.max = String(state.frameCount || 1);
    els.columnCount.disabled = !state.image || state.layoutMode !== 'columns';
    els.eraseSizeRange.value = state.eraseBrushSize;
    els.eraseSizeValue.textContent = `${state.eraseBrushSize}px`;
    if (!enabled) {
      els.selectedBadge.textContent = '未选择';
      els.frameName.value = '';
      els.scaleRange.value = 100;
      els.scaleValue.textContent = '100%';
      return;
    }
    const sel = getSelectedFrames();
    const mixed = sel.length > 1 && sel.some(item => Math.abs(item.scale - sel[0].scale) > 0.0001);
    els.selectedBadge.textContent = state.selectedOrderIds.length > 1 ? `已选 ${state.selectedOrderIds.length} 帧 · 当前第 ${state.selected+1} 帧` : `第 ${state.selected+1} 帧`;
    els.frameName.value = f.name;
    els.scaleRange.value = Math.round(f.scale * 100);
    els.scaleValue.textContent = mixed ? '混合' : `${Math.round(f.scale * 100)}%`;
  }

  function updateMeta() {
    if (!state.image) { els.gridMeta.textContent = '等待导入图片'; return; }
    els.gridMeta.textContent = `${state.fileName} · ${state.cols} 列 × ${state.rows} 行 · ${state.frameCount} 帧 · 单帧约 ${Math.round(state.cellW)} × ${Math.round(state.cellH)}px`;
    syncGuideToolbar();
  }

  function renderAll() {
    updateMeta();
    syncSelectedControls();
    renderMainCanvas();
    renderFrameList();
    syncTimingInfo();
    if (state.image) renderPreview(state.playing ? state.playIndex : Math.max(0, state.selected));
  }

  function selectFrame(i, additive = false) {
    if (!state.image || i < 0 || i >= state.frameCount) return;
    if (additive) toggleFrameSelection(i);
    else setSingleSelection(i);
    renderAll();
  }

  function fitStage() {
    if (!state.image) return;
    const pad = 56;
    const maxW = Math.max(200, els.stageViewport.clientWidth - pad);
    const maxH = Math.max(200, els.stageViewport.clientHeight - pad);
    state.stageScale = Math.min(1, maxW / Math.max(1, stageWidth()), maxH / Math.max(1, stageHeight()));
    state.stageScale = Math.max(0.05, state.stageScale);
    renderMainCanvas();
  }

  function canvasPoint(ev) {
    const rect = els.mainCanvas.getBoundingClientRect();
    return { x: (ev.clientX - rect.left) / state.stageScale, y: (ev.clientY - rect.top) / state.stageScale };
  }

  function frameAtPoint(p) {
    const col = Math.floor(p.x / state.cellW);
    const row = Math.floor(p.y / state.cellH);
    if (col < 0 || col >= state.cols || row < 0 || row >= state.rows) return -1;
    const i = row * state.cols + col;
    return i < state.frameCount ? i : -1;
  }

  function isInReorderHandle(index, p) {
    const r = getHandleRect(index);
    return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
  }

  function toggleEraseMode(force = null) {
    if (!state.image) return;
    state.eraseMode = force == null ? !state.eraseMode : !!force;
    state.eraseStroke = null;
    if (!state.eraseMode && state.dragMode === 'erase') {
      state.dragMode = null;
      state.dragStart = null;
    }
    els.mainCanvas.style.cursor = state.eraseMode ? 'crosshair' : '';
    renderAll();
  }

  function beginEraseStroke(index, p) {
    const frame = state.frames[index];
    if (!frame) return;
    const { col, row } = positionCellOrigin(index);
    const cellX = col * state.cellW;
    const cellY = row * state.cellH;
    const point = normalizeLocalPoint(p.x, p.y, cellX, cellY, state.cellW, state.cellH);
    pushHistory();
    frame.erasePaths ||= [];
    const stroke = { sizeN: brushSizeToNormalized(state.eraseBrushSize), points: [point] };
    frame.erasePaths.push(stroke);
    state.dragMode = 'erase';
    state.eraseStroke = { index, stroke };
    els.mainCanvas.style.cursor = 'crosshair';
    renderAll();
  }

  function appendErasePoint(p) {
    if (!state.eraseStroke) return;
    const index = state.eraseStroke.index;
    const { col, row } = positionCellOrigin(index);
    const cellX = col * state.cellW;
    const cellY = row * state.cellH;
    const point = normalizeLocalPoint(p.x, p.y, cellX, cellY, state.cellW, state.cellH);
    const points = state.eraseStroke.stroke.points;
    const last = points[points.length - 1];
    if (last && Math.hypot(point.x - last.x, point.y - last.y) < 0.0025) return;
    points.push(point);
    renderMainCanvas();
    renderPreview(state.selected);
    renderFrameList();
  }

  function clearSelectedErase() {
    const frame = state.frames[state.selected];
    if (!frame || !hasErasePaths(frame)) return;
    pushHistory();
    frame.erasePaths = [];
    renderAll();
  }

  function handlePointerDown(ev) {
    if (!state.image || ev.button !== 0 || state.guideDrag) return;
    if (state.selectedGuideId != null) { state.selectedGuideId = null; renderGuides(); renderRulers(); }
    const p = canvasPoint(ev);
    const i = frameAtPoint(p);
    if (i < 0) return;
    if (state.eraseMode) {
      setSingleSelection(i);
      beginEraseStroke(i, p);
      els.mainCanvas.setPointerCapture?.(ev.pointerId);
      return;
    }
    const onHandle = isInReorderHandle(i, p);

    if (ev.shiftKey) {
      const alreadySelected = isFrameSelected(i);
      if (!(onHandle && alreadySelected && state.selectedOrderIds.length > 1)) {
        toggleFrameSelection(i);
        renderAll();
        return;
      }
    }

    const wasSelected = isFrameSelected(i);
    if (!(onHandle && wasSelected && state.selectedOrderIds.length > 1)) setSingleSelection(i);
    else {
      state.selected = i;
      if (!state.playing) state.playIndex = i;
    }

    const { col, row } = positionCellOrigin(i);
    const cellX = col * state.cellW;
    const cellY = row * state.cellH;
    if (onHandle) {
      state.dragMode = 'reorder';
      state.reorderDrag = {
        from: i,
        selectedIds: [...state.selectedOrderIds],
        target: i,
        currentX: p.x,
        currentY: p.y,
        grabOffsetX: p.x - cellX,
        grabOffsetY: p.y - cellY
      };
      state.dragStart = null;
      els.mainCanvas.style.cursor = 'grabbing';
      renderAll();
    } else {
      state.dragMode = 'content';
      state.dragStart = { x: p.x, y: p.y, dx: state.frames[i].dx, dy: state.frames[i].dy, i, axis: null, changed: false };
      state.reorderDrag = null;
      els.mainCanvas.style.cursor = 'move';
      renderAll();
    }
    els.mainCanvas.setPointerCapture?.(ev.pointerId);
  }

  function handlePointerMove(ev) {
    if (!state.image || !state.dragMode) return;
    const p = canvasPoint(ev);
    if (state.dragMode === 'erase' && state.eraseStroke) {
      appendErasePoint(p);
      return;
    }
    if (state.dragMode === 'reorder' && state.reorderDrag) {
      state.reorderDrag.currentX = p.x;
      state.reorderDrag.currentY = p.y;
      const target = frameAtPoint(p);
      if (target >= 0) state.reorderDrag.target = target;
      renderMainCanvas();
      return;
    }
    if (state.dragMode !== 'content' || !state.dragStart) return;
    const d = state.dragStart;
    const totalX = p.x - d.x;
    const totalY = p.y - d.y;
    if (!d.axis && Math.max(Math.abs(totalX), Math.abs(totalY)) >= Math.max(2, 2 / state.stageScale)) {
      d.axis = Math.abs(totalX) >= Math.abs(totalY) ? 'x' : 'y';
      pushHistory();
      d.changed = true;
    }
    if (!d.axis) return;
    const f = state.frames[d.i];
    if (d.axis === 'x') {
      f.dx = d.dx + totalX;
      f.dy = d.dy;
    } else {
      f.dx = d.dx;
      f.dy = d.dy + totalY;
    }
    syncSelectedControls();
    renderMainCanvas();
    renderPreview(state.selected);
  }

  function handlePointerUp() {
    if (!state.dragMode) return;
    if (state.dragMode === 'erase') {
      state.dragMode = null;
      state.eraseStroke = null;
      els.mainCanvas.style.cursor = state.eraseMode ? 'crosshair' : '';
      renderAll();
      return;
    }
    if (state.dragMode === 'reorder' && state.reorderDrag) {
      const { from, target } = state.reorderDrag;
      state.reorderDrag = null;
      state.dragMode = null;
      els.mainCanvas.style.cursor = state.eraseMode ? 'crosshair' : '';
      if (target >= 0) moveSelectedFramesTo(target);
      else renderAll();
      return;
    }
    const changed = !!state.dragStart?.changed;
    state.dragMode = null;
    state.dragStart = null;
    els.mainCanvas.style.cursor = state.eraseMode ? 'crosshair' : '';
    if (changed) renderAll();
    else renderAll();
  }

  function handleWheel(ev) {
    if (!state.image) return;
    ev.preventDefault();
    const p = canvasPoint(ev);
    const i = frameAtPoint(p);
    if (i < 0) return;
    if (!isFrameSelected(i)) setSingleSelection(i);
    else state.selected = i;
    if (!state.wheelHistoryActive) {
      pushHistory();
      state.wheelHistoryActive = true;
    }
    if (state.wheelHistoryTimer) clearTimeout(state.wheelHistoryTimer);
    state.wheelHistoryTimer = setTimeout(() => { state.wheelHistoryActive = false; }, 380);
    const f = state.frames[i];
    const factor = ev.deltaY < 0 ? 1.05 : 0.95;
    setUniformScaleOnSelection(clamp(f.scale * factor, 0.1, 4));
    renderAll();
  }

  function moveSelectedFramesTo(target) {
    if (!state.image || target < 0 || target >= state.frames.length) return;
    normalizeFrameSelection();
    const ids = state.selectedOrderIds.length ? [...state.selectedOrderIds] : [state.frames[state.selected]?.id].filter(Boolean);
    if (!ids.length) return;
    const selectedSet = new Set(ids);
    const orderedFrames = ids.map(id => state.frames.find(f => f.id === id)).filter(Boolean);
    const remaining = state.frames.filter(f => !selectedSet.has(f.id));
    const insertAt = clamp(target, 0, remaining.length);
    const nextFrames = [...remaining.slice(0, insertAt), ...orderedFrames, ...remaining.slice(insertAt)];
    const before = state.frames.map(f => f.id).join(',');
    const after = nextFrames.map(f => f.id).join(',');
    if (before === after) { renderAll(); return; }
    const activeId = state.frames[state.selected]?.id || ids[ids.length - 1];
    pushHistory();
    state.frames = nextFrames;
    normalizeAutomaticNames();
    state.selectedOrderIds = ids;
    state.selected = Math.max(0, frameIndexById(activeId));
    state.playIndex = state.selected;
    renderAll();
  }

  function moveFrame(from, to) {
    if (!state.image || from < 0 || from >= state.frames.length) return;
    setSingleSelection(from);
    moveSelectedFramesTo(to);
  }

  function stopPreview() {
    clearPlaybackTimer();
    if (state.image) renderPreview(Math.max(0, state.selected));
  }

  function previewTick() {
    if (!state.playing || !state.image) return;
    const i = state.playIndex;
    renderPreview(i);
    state.playIndex = (i + 1) % state.frameCount;
    state.playTimer = setTimeout(previewTick, getFrameDurationMs(i));
  }

  function togglePreview() {
    if (!state.image) return;
    if (state.playing) { stopPreview(); return; }
    state.playing = true;
    state.playIndex = Math.max(0, state.selected);
    els.playBtn.textContent = '停止预览';
    previewTick();
  }

  function beginInputHistory(el) {
    if (!state.image || state.inputHistoryEl === el) return;
    pushHistory();
    state.inputHistoryEl = el;
  }

  function endInputHistory(el) {
    if (state.inputHistoryEl === el) state.inputHistoryEl = null;
  }

  function updateSelectedFromInputs(ev) {
    const f = state.frames[state.selected];
    if (!f) return;
    if (ev?.target === els.frameName) {
      const raw = els.frameName.value.trim();
      if (raw) { f.name = raw; f.customName = raw !== defaultName(state.selected); }
      else { f.name = defaultName(state.selected); f.customName = false; }
    }
    if (ev?.target === els.scaleRange) setUniformScaleOnSelection(clamp(Number(els.scaleRange.value) / 100 || 1, 0.1, 4));
    els.scaleValue.textContent = `${Math.round(state.frames[state.selected].scale * 100)}%`;
    renderMainCanvas();
    renderPreview(state.selected);
    renderFrameList();
  }

  function nudgeSelectedFrame(dx, dy) {
    const f = state.frames[state.selected];
    if (!state.image || !f) return;
    f.dx += dx;
    f.dy += dy;
    syncSelectedControls();
    renderMainCanvas();
    renderPreview(state.selected);
    renderFrameList();
  }

  function resetSelected() {
    const f = state.frames[state.selected];
    if (!f) return;
    pushHistory();
    f.dx = 0; f.dy = 0; f.scale = 1; f.erasePaths = [];
    renderAll();
  }

  function copyPrevious() {
    const i = state.selected;
    if (i <= 0) return;
    pushHistory();
    const prev = state.frames[i - 1];
    state.frames[i].dx = prev.dx;
    state.frames[i].dy = prev.dy;
    state.frames[i].scale = prev.scale;
    renderAll();
  }

  function resetAll() {
    if (!state.image) return;
    if (!confirm('确定重置全部帧的位移和缩放吗？帧名称和排序会保留。')) return;
    pushHistory();
    state.frames.forEach(f => { f.dx = 0; f.dy = 0; f.scale = 1; f.erasePaths = []; });
    renderAll();
  }

  function updateWebpDimensions(force = false, changed = 'width') {
    if (!state.image) return;
    const ratio = state.cellW / state.cellH;
    if (force) {
      const max = 600;
      let w = Math.round(state.cellW), h = Math.round(state.cellH);
      if (Math.max(w, h) > max) { const s = max / Math.max(w, h); w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s)); }
      els.webpWidth.value = w; els.webpHeight.value = h;
      return;
    }
    if (!els.lockAspect.checked) return;
    if (changed === 'width') els.webpHeight.value = Math.max(1, Math.round((Number(els.webpWidth.value) || 1) / ratio));
    else els.webpWidth.value = Math.max(1, Math.round((Number(els.webpHeight.value) || 1) * ratio));
  }

  function setBusy(on, title = '正在处理…', text = '请不要关闭页面', progress = 0) {
    els.busyOverlay.hidden = !on;
    els.busyTitle.textContent = title;
    els.busyText.textContent = text;
    els.busyProgress.style.width = `${clamp(progress, 0, 100)}%`;
  }

  function updateBusy(text, progress) {
    els.busyText.textContent = text;
    els.busyProgress.style.width = `${clamp(progress, 0, 100)}%`;
  }

  function canvasToBlob(canvas, type = 'image/png', quality) {
    return new Promise((resolve, reject) => {
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('图片编码失败')), type, quality);
    });
  }

  async function blobToU8(blob) { return new Uint8Array(await blob.arrayBuffer()); }

  function rgbaBucketKey(r, g, b, a) {
    if (a === 0) return -1;
    return (r >> 3) | ((g >> 3) << 5) | ((b >> 3) << 10) | ((a >> 4) << 15);
  }

  function buildColorHistogram(data) {
    const map = new Map();
    let transparentCount = 0;
    for (let i = 0; i < data.length; i += 4) {
      const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
      if (a === 0) { transparentCount++; continue; }
      const key = rgbaBucketKey(r, g, b, a);
      let v = map.get(key);
      if (!v) {
        v = { key, r: 0, g: 0, b: 0, a: 0, count: 0 };
        map.set(key, v);
      }
      v.r += r; v.g += g; v.b += b; v.a += a; v.count++;
    }
    const items = [];
    for (const v of map.values()) {
      items.push({
        key: v.key,
        r: v.r / v.count,
        g: v.g / v.count,
        b: v.b / v.count,
        a: v.a / v.count,
        count: v.count
      });
    }
    return { items, transparentCount };
  }

  function colorBoxStats(items) {
    let minR=255,minG=255,minB=255,minA=255,maxR=0,maxG=0,maxB=0,maxA=0,total=0;
    for (const c of items) {
      if (c.r < minR) minR = c.r; if (c.r > maxR) maxR = c.r;
      if (c.g < minG) minG = c.g; if (c.g > maxG) maxG = c.g;
      if (c.b < minB) minB = c.b; if (c.b > maxB) maxB = c.b;
      if (c.a < minA) minA = c.a; if (c.a > maxA) maxA = c.a;
      total += c.count;
    }
    const ranges = [maxR-minR, maxG-minG, maxB-minB, (maxA-minA)*1.45];
    let channel = 0;
    for (let i=1;i<4;i++) if (ranges[i] > ranges[channel]) channel = i;
    const range = ranges[channel];
    return { total, channel, score: range * Math.log2(total + 1), range };
  }

  function splitColorBox(items) {
    if (items.length < 2) return null;
    const stats = colorBoxStats(items);
    if (stats.range <= 0) return null;
    const key = ['r','g','b','a'][stats.channel];
    const sorted = items.slice().sort((x,y) => x[key] - y[key]);
    const half = stats.total / 2;
    let acc = 0, cut = 1;
    for (let i=0;i<sorted.length-1;i++) {
      acc += sorted[i].count;
      if (acc >= half) { cut = i + 1; break; }
    }
    return [sorted.slice(0, cut), sorted.slice(cut)];
  }

  function makePalette(hist, maxColors) {
    const hasTransparent = hist.transparentCount > 0;
    const available = Math.max(1, maxColors - (hasTransparent ? 1 : 0));
    let boxes = hist.items.length ? [hist.items] : [];
    while (boxes.length < available) {
      let best = -1, bestScore = -1;
      for (let i=0;i<boxes.length;i++) {
        if (boxes[i].length < 2) continue;
        const st = colorBoxStats(boxes[i]);
        if (st.score > bestScore) { bestScore = st.score; best = i; }
      }
      if (best < 0) break;
      const split = splitColorBox(boxes[best]);
      if (!split || !split[0].length || !split[1].length) break;
      boxes.splice(best, 1, split[0], split[1]);
    }
    const palette = [];
    if (hasTransparent) palette.push({ r:0,g:0,b:0,a:0 });
    for (const box of boxes) {
      let r=0,g=0,b=0,a=0,n=0;
      for (const c of box) { r+=c.r*c.count; g+=c.g*c.count; b+=c.b*c.count; a+=c.a*c.count; n+=c.count; }
      palette.push({
        r: Math.round(r/n), g: Math.round(g/n), b: Math.round(b/n), a: Math.round(a/n)
      });
    }
    return palette.slice(0, 256);
  }

  function nearestPaletteIndex(c, palette, startIndex) {
    let best = startIndex || 0, bestD = Infinity;
    for (let i=startIndex||0;i<palette.length;i++) {
      const p = palette[i];
      const aa = c.a / 255, pa = p.a / 255;
      const dr = c.r * aa - p.r * pa;
      const dg = c.g * aa - p.g * pa;
      const db = c.b * aa - p.b * pa;
      const da = c.a - p.a;
      const d = dr*dr + dg*dg + db*db + da*da*1.65;
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function mapPixelsToPalette(data, hist, palette) {
    const keyToIndex = new Map();
    const hasTransparent = hist.transparentCount > 0;
    const start = hasTransparent ? 1 : 0;
    for (const c of hist.items) keyToIndex.set(c.key, nearestPaletteIndex(c, palette, start));
    const out = new Uint8Array(data.length / 4);
    for (let i=0, j=0;i<data.length;i+=4,j++) {
      const a = data[i+3];
      if (a === 0 && hasTransparent) { out[j] = 0; continue; }
      const key = rgbaBucketKey(data[i], data[i+1], data[i+2], a);
      let idx = keyToIndex.get(key);
      if (idx == null) {
        idx = nearestPaletteIndex({r:data[i],g:data[i+1],b:data[i+2],a}, palette, start);
        keyToIndex.set(key, idx);
      }
      out[j] = idx;
    }
    return out;
  }

  function u32be(v) { return Uint8Array.of((v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255); }

  function pngChunk(type, data) {
    const typeBytes = new TextEncoder().encode(type);
    const body = SpriteCodec.concat([typeBytes, data]);
    return SpriteCodec.concat([u32be(data.length), body, u32be(SpriteCodec.crc32(body))]);
  }

  async function deflateZlib(bytes) {
    if (typeof CompressionStream === 'undefined') throw new Error('当前浏览器不支持本地 PNG 智能压缩，请使用最新版 Chrome。');
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function encodeIndexedPng(imageData, maxColors) {
    const width = imageData.width, height = imageData.height;
    const hist = buildColorHistogram(imageData.data);
    const palette = makePalette(hist, Math.max(2, Math.min(256, maxColors)));
    if (!palette.length) palette.push({r:0,g:0,b:0,a:0});
    const indices = mapPixelsToPalette(imageData.data, hist, palette);

    const scan = new Uint8Array((width + 1) * height);
    let prev = null;
    for (let y=0;y<height;y++) {
      const src = indices.subarray(y*width, (y+1)*width);
      const none = new Uint8Array(width);
      const sub = new Uint8Array(width);
      const up = new Uint8Array(width);
      let scoreNone=0, scoreSub=0, scoreUp=0;
      for (let x=0;x<width;x++) {
        const v = src[x];
        none[x] = v;
        sub[x] = (v - (x ? src[x-1] : 0) + 256) & 255;
        up[x] = (v - (prev ? prev[x] : 0) + 256) & 255;
        scoreNone += Math.min(v, 256-v);
        scoreSub += Math.min(sub[x], 256-sub[x]);
        scoreUp += Math.min(up[x], 256-up[x]);
      }
      const row = y * (width + 1);
      if (scoreSub <= scoreNone && scoreSub <= scoreUp) { scan[row]=1; scan.set(sub,row+1); }
      else if (scoreUp <= scoreNone) { scan[row]=2; scan.set(up,row+1); }
      else { scan[row]=0; scan.set(none,row+1); }
      prev = src;
    }
    const compressed = await deflateZlib(scan);

    const ihdr = new Uint8Array(13);
    ihdr.set(u32be(width),0); ihdr.set(u32be(height),4);
    ihdr[8]=8; ihdr[9]=3; ihdr[10]=0; ihdr[11]=0; ihdr[12]=0;
    const plte = new Uint8Array(palette.length*3);
    const alpha = new Uint8Array(palette.length);
    let lastAlpha = -1;
    for (let i=0;i<palette.length;i++) {
      const p=palette[i];
      plte[i*3]=p.r; plte[i*3+1]=p.g; plte[i*3+2]=p.b; alpha[i]=p.a;
      if (p.a !== 255) lastAlpha = i;
    }
    const parts = [
      Uint8Array.of(137,80,78,71,13,10,26,10),
      pngChunk('IHDR', ihdr),
      pngChunk('PLTE', plte)
    ];
    if (lastAlpha >= 0) parts.push(pngChunk('tRNS', alpha.slice(0,lastAlpha+1)));
    parts.push(pngChunk('IDAT', compressed), pngChunk('IEND', new Uint8Array(0)));
    return { bytes: SpriteCodec.concat(parts), colors: palette.length };
  }

  async function buildPngFiles(outW, outH, mode) {
    const files = [];
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(outW));
    canvas.height = Math.max(1, Math.round(outH));
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const used = new Map();
    let baselineTotal = 0, outputTotal = 0, colorTotal = 0;
    const maxColors = mode === '64' ? 64 : mode === '128' ? 128 : 256;

    for (let i = 0; i < state.frameCount; i++) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawFrame(ctx, i, 0, 0, canvas.width, canvas.height);

      const baselineBlob = await canvasToBlob(canvas, 'image/png');
      const baseline = await blobToU8(baselineBlob);
      let data = baseline;
      let colors = 0;

      if (mode !== 'lossless') {
        updateBusy(`量化第 ${i + 1}/${state.frameCount} 帧色彩…`, 8 + (i / state.frameCount) * 62);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const optimized = await encodeIndexedPng(imageData, maxColors);
        colors = optimized.colors;
        if (optimized.bytes.length < baseline.length) data = optimized.bytes;
      }

      const base = sanitizeName(state.frames[i].name, defaultName(i));
      const count = (used.get(base) || 0) + 1;
      used.set(base, count);
      const finalName = count === 1 ? base : `${base}_${count}`;
      files.push({ name: `${finalName}.png`, data });
      baselineTotal += baseline.length;
      outputTotal += data.length;
      colorTotal += colors;
      updateBusy(`压缩第 ${i + 1}/${state.frameCount} 帧 · ${(data.length/1024).toFixed(1)} KB`, 10 + ((i + 1) / state.frameCount) * 68);
      await new Promise(r => setTimeout(r, 0));
    }
    return { files, baselineTotal, outputTotal, avgColors: state.frameCount ? Math.round(colorTotal/state.frameCount) : 0 };
  }

  async function buildWebPFrameBuffers(outW, outH, quality) {
    const frames = [];
    const canvas = document.createElement('canvas');
    canvas.width = outW;
    canvas.height = outH;
    const ctx = canvas.getContext('2d');
    for (let i = 0; i < state.frameCount; i++) {
      ctx.clearRect(0, 0, outW, outH);
      drawFrame(ctx, i, 0, 0, outW, outH);
      const blob = await canvasToBlob(canvas, 'image/webp', quality / 100);
      frames.push(await blob.arrayBuffer());
      updateBusy(`编码第 ${i + 1}/${state.frameCount} 帧 · 质量 ${quality}`, 10 + ((i + 1) / state.frameCount) * 64);
      await new Promise(r => setTimeout(r, 0));
    }
    return frames;
  }

  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1200);
  }

  async function exportPng() {
    if (!state.image) return;
    try {
      const mode = els.pngCompression.value || 'smart';
      const modeText = mode === 'lossless' ? '无损重编码' : mode === '64' ? '64 色极致量化' : mode === '128' ? '128 色强量化' : '256 色智能量化';
      setBusy(true, '正在导出 PNG 序列', `${modeText} · 保留透明通道…`, 3);
      els.pngExportResult.className = 'export-result';
      els.pngExportResult.textContent = '正在计算压缩结果…';
      const s = Number(els.pngScale.value) || 1;
      const w = Math.max(1, Math.round(state.cellW * s));
      const h = Math.max(1, Math.round(state.cellH * s));
      const result = await buildPngFiles(w, h, mode);
      updateBusy('打包 ZIP…', 88);
      const zipBytes = SpriteCodec.createZipStore(result.files);
      updateBusy('完成', 100);
      downloadBlob(new Blob([zipBytes], { type: 'application/zip' }), 'sprite_frames_png.zip');

      const beforeKb = result.baselineTotal / 1024;
      const afterKb = result.outputTotal / 1024;
      const saved = result.baselineTotal ? Math.max(0, (1 - result.outputTotal / result.baselineTotal) * 100) : 0;
      els.pngExportResult.className = `export-result ${saved >= 10 ? 'ok' : 'warn'}`;
      els.pngExportResult.textContent = mode === 'lossless'
        ? `已导出 ${state.frameCount} 帧 · ${w}×${h}px · PNG ${afterKb.toFixed(1)} KB（无损重编码）`
        : `已导出 ${state.frameCount} 帧 · ${w}×${h}px · ${beforeKb.toFixed(1)} KB → ${afterKb.toFixed(1)} KB · 减少 ${saved.toFixed(1)}% · 平均约 ${result.avgColors} 色`;
    } catch (e) {
      els.pngExportResult.className = 'export-result warn';
      els.pngExportResult.textContent = `压缩失败：${e.message}`;
      alert(`PNG 导出失败：${e.message}`);
    } finally {
      setTimeout(() => setBusy(false), 160);
    }
  }

  async function encodeAnimationAtQuality(w, h, fps, quality) {
    const buffers = await buildWebPFrameBuffers(w, h, quality);
    const bytes = SpriteCodec.muxAnimatedWebP(buffers,w,h,getFrameDurations(fps));
    return bytes;
  }

  async function exportWebp() {
    if (!state.image) return;
    if (!state.webpSupported) { alert('当前浏览器不支持 WebP 编码。建议用最新版 Chrome 打开本工具。'); return; }
    try {
      els.exportResult.className = 'export-result';
      els.exportResult.textContent = '';
      const w = clamp(Math.round(Number(els.webpWidth.value) || 1), 1, 4096);
      const h = clamp(Math.round(Number(els.webpHeight.value) || 1), 1, 4096);
      const fps = clamp(Math.round(Number(els.webpFps.value) || 12), 1, 60);
      const requestedQ = clamp(Math.round(Number(els.webpQuality.value) || 82), 10, 100);
      const targetKb = Math.max(0, Math.round(Number(els.webpTargetKb.value) || 0));
      let q = requestedQ;
      let bytes;
      setBusy(true, '正在导出动态 WebP', `生成 ${w} × ${h}px 动画…`, 3);

      bytes = await encodeAnimationAtQuality(w, h, fps, q);
      if (targetKb > 0) {
        const target = targetKb * 1024;
        while (bytes.length > target && q > 20) {
          q = Math.max(20, q - 8);
          updateBusy(`当前 ${(bytes.length / 1024).toFixed(1)} KB，继续压缩到质量 ${q}…`, 76);
          bytes = await encodeAnimationAtQuality(w, h, fps, q);
        }
      }

      updateBusy('完成', 100);
      downloadBlob(new Blob([bytes], { type: 'image/webp' }), 'sprite_preview.webp');
      const kb = bytes.length / 1024;
      const hit = !targetKb || kb <= targetKb;
      els.exportResult.className = `export-result ${hit ? 'ok' : 'warn'}`;
      els.exportResult.textContent = `已导出 ${w} × ${h}px · ${fps} FPS · 实际质量 ${q} · ${kb.toFixed(1)} KB${targetKb && !hit ? '（已压到质量 20，仍高于目标；建议再降低导出尺寸）' : ''}`;
    } catch (e) {
      console.error(e);
      alert(`WebP 导出失败：${e.message}\n建议使用最新版 Chrome 再试一次。`);
    } finally {
      setTimeout(() => setBusy(false), 160);
    }
  }

  function gifFixedNineBitLZW(indices) {
    const clear=256, stop=257;
    let codes=new Map(), next=258;
    const reset=()=>{codes=new Map();next=258;};
    const bits=[];
    let buffer=0,used=0;
    const write=(n)=>{buffer|=(n<<used);used+=9;while(used>=8){bits.push(buffer&255);buffer>>>=8;used-=8;}};
    write(clear);
    let prefix=Number(indices[0] ?? 0);
    for(let i=1;i<indices.length;i++) {
      const nextByte=Number(indices[i]);
      const key=`${prefix},${nextByte}`;
      const found=codes.get(key);
      if(found!==undefined) {prefix=found;continue;}
      write(prefix);
      if(next<500) codes.set(key,next++);
      else {write(clear);reset();}
      prefix=nextByte;
    }
    write(prefix);write(stop);
    if(used>0)bits.push(buffer&255);
    return new Uint8Array(bits);
  }

  function gifChunkBlocks(buffer) {
    const blocks=[];
    for(let at=0;at<buffer.length;at+=255) {
      const part=buffer.subarray(at,Math.min(at+255,buffer.length));
      blocks.push(Uint8Array.of(part.length),part);
    }
    blocks.push(Uint8Array.of(0));
    return SpriteCodec.concat(blocks);
  }

  function encodeGifCanvasImage(imageData) {
    const rgba=new Uint8ClampedArray(imageData.data);
    for(let i=0;i<rgba.length;i+=4) {
      if(rgba[i+3]<128) {rgba[i]=0;rgba[i+1]=0;rgba[i+2]=0;rgba[i+3]=0;}
      else rgba[i+3]=255;
    }
    const hist=buildColorHistogram(rgba);
    const pal=makePalette(hist,256);
    if(!pal.length)pal.push({r:0,g:0,b:0,a:0});
    const indices=mapPixelsToPalette(rgba,hist,pal);
    const rgb=new Uint8Array(256*3);
    pal.forEach((p,i)=>{rgb[i*3]=p.r;rgb[i*3+1]=p.g;rgb[i*3+2]=p.b;});
    return {indices,rgb,hasTransparency:hist.transparentCount>0};
  }

  async function exportGif() {
    if(!state.image)return;
    try {
      const width=clamp(Math.round(Number(els.webpWidth.value)||1),1,4096);
      const height=clamp(Math.round(Number(els.webpHeight.value)||1),1,4096);
      if(width*height*state.frameCount>60000000) throw new Error('导出帧总像素过大，请减小宽高');
      setBusy(true,'正在导出 GIF','正在量化颜色与保留各帧时间…',2);
      const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
      const ctx=canvas.getContext('2d',{willReadFrequently:true});
      const parts=[],txt=new TextEncoder();
      const u16=(n)=>Uint8Array.of(n&255,(n>>8)&255);
      parts.push(txt.encode('GIF89a'),u16(width),u16(height),Uint8Array.of(0x70,0,0));
      parts.push(Uint8Array.from([0x21,0xFF,0x0B,...txt.encode('NETSCAPE2.0'),0x03,0x01,0,0,0]));
      const durations=getFrameDurations(clamp(Number(els.webpFps.value)||12,1,60));
      for(let i=0;i<state.frameCount;i++) {
        ctx.clearRect(0,0,width,height);
        drawFrame(ctx,i,0,0,width,height);
        const frame=encodeGifCanvasImage(ctx.getImageData(0,0,width,height));
        const delay=clamp(Math.round(durations[i]/10),1,65535);
        const packed=((2<<2)|(frame.hasTransparency?1:0));
        parts.push(Uint8Array.of(0x21,0xF9,0x04,packed,delay&255,delay>>8,0,0));
        parts.push(Uint8Array.of(0x2C,0,0,0,0,width&255,width>>8,height&255,height>>8,0x87));
        parts.push(frame.rgb,Uint8Array.of(8),gifChunkBlocks(gifFixedNineBitLZW(frame.indices)));
        updateBusy(`GIF 第 ${i+1}/${state.frameCount} 帧`,6+90*(i+1)/state.frameCount);
        await new Promise(r=>setTimeout(r,0));
      }
      parts.push(Uint8Array.of(0x3B));
      const result=SpriteCodec.concat(parts);
      downloadBlob(new Blob([result],{type:'image/gif'}),'sprite_animation.gif');
      els.gifExportResult.className='export-result ok';
      els.gifExportResult.textContent=`GIF ${state.frameCount} 帧 · ${width}×${height}px · ${(result.length/1024).toFixed(1)} KB${state.importedAnimated?' · 保留原始帧时长':''}`;
    } catch(e) {
      console.error(e);
      els.gifExportResult.className='export-result warn';
      els.gifExportResult.textContent=`GIF 导出失败：${e.message}`;
      alert(`GIF 导出失败：${e.message}`);
    } finally {setTimeout(()=>setBusy(false),120);}
  }

  function firstImageFileFromTransfer(transfer) {
    const file=Array.from(transfer?.files || []).find(isImageFile);
    if(file) return file;
    for (const item of Array.from(transfer?.items || [])) {
      if (item?.kind === 'file' && (/^image\//i.test(item.type || '') || !item.type)) {
        const candidate=item.getAsFile?.();
        if(candidate && isImageFile(candidate)) return candidate;
      }
    }
    return null;
  }

  function chooseImageUrlFromTransfer(transfer) {
    const html=transfer?.getData?.('text/html') || '';
    if(html) {
      const doc=new DOMParser().parseFromString(html,'text/html');
      const img=doc.querySelector('img[src],img[data-src],img[srcset],source[srcset]');
      if(img) {
        let url=img.getAttribute('src') || img.getAttribute('data-src') || '';
        if(!url && img.getAttribute('srcset')) url=img.getAttribute('srcset').split(',')[0].trim().split(/\s+/)[0];
        if(url) {
          try {
            const base=doc.querySelector('base[href]')?.getAttribute('href') || '';
            if(base && !/^(?:https?:|data:|blob:)/i.test(url)) url=new URL(url,base).href;
          } catch(_) {}
          if(/^(?:https?:\/\/|data:image\/|blob:)/i.test(url)) return url;
        }
      }
    }
    const uri=transfer?.getData?.('text/uri-list') || '';
    const plain=transfer?.getData?.('text/plain') || '';
    const test=uri.split(/\r?\n/).find(line=>line && !line.startsWith('#')) || plain.trim();
    if(/^(?:https?:\/\/|data:image\/|blob:)/i.test(test)) return test;
    return '';
  }

  async function importImageUrl(url,sourceLabel) {
    try {
      if (!/^(?:https?:\/\/|data:image\/|blob:)/i.test(url)) throw new Error('粘贴内容不是受支持的图片地址');
      setBusy(true,'正在获取网页图片…','尝试读取图片原始数据',8);
      const response=await fetch(url,{mode:'cors',credentials:'omit'});
      if(!response.ok) throw new Error(`下载失败：HTTP ${response.status}`);
      const blob=await response.blob();
      const mime=blob.type || (url.toLowerCase().split('?')[0].endsWith('.gif') ? 'image/gif' : 'image/png');
      if (!mime.startsWith('image/')) throw new Error('链接返回的内容不是图片');
      const ext=mime.includes('gif') ? 'gif' : mime.includes('webp') ? 'webp' : mime.includes('jpeg') ? 'jpg' : 'png';
      const fromUrl=/^https?:\/\//i.test(url) ? decodeURIComponent(new URL(url).pathname.split('/').pop() || '') : '';
      const cleanName=(fromUrl && /\.(png|apng|gif|webp|jpe?g)$/i.test(fromUrl)) ? fromUrl : `clipboard_web.${ext}`;
      const file=new File([blob],cleanName,{type:mime});
      await setImage(file,sourceLabel);
    } catch(e) {
      setBusy(false);
      console.warn('网页图片导入失败',e);
      alert(`网页图片无法直接下载：${e.message}。\n该网站可能禁止跨域读取。请右键「复制图片」（而不是复制图片地址），或保存图片后直接拖到中间画布。`);
    }
  }

  function handlePaste(e) {
    const transfer=e.clipboardData;
    const file=firstImageFileFromTransfer(transfer);
    if(file) {
      e.preventDefault();
      void setImage(file,'粘贴导入');
      return;
    }
    const url=chooseImageUrlFromTransfer(transfer);
    if(url) {
      e.preventDefault();
      void importImageUrl(url,'网页图片粘贴');
    }
  }

  function handleStageDragOver(e) {
    e.preventDefault();
    if(e.dataTransfer) e.dataTransfer.dropEffect='copy';
    els.stage.classList.add('drag-active');
  }

  function handleStageDragLeave(e) {
    if(e.relatedTarget && els.stage.contains(e.relatedTarget)) return;
    els.stage.classList.remove('drag-active');
  }

  function handleStageDrop(e) {
    e.preventDefault();e.stopPropagation();
    els.stage.classList.remove('drag-active');
    const file=firstImageFileFromTransfer(e.dataTransfer);
    if(file) {
      void setImage(file,'拖入画布');
      return;
    }
    const url=chooseImageUrlFromTransfer(e.dataTransfer);
    if(url) void importImageUrl(url,'网页图片拖入');
  }

  // Events
  els.fileInput.addEventListener('change',e => { if(e.target.files?.[0]) void setImage(e.target.files[0],'选择图片'); e.target.value=''; });
  els.stageEmpty.addEventListener('click', () => els.fileInput.click());
  els.stage.addEventListener('dragenter',handleStageDragOver);
  els.stage.addEventListener('dragover',handleStageDragOver);
  els.stage.addEventListener('dragleave',handleStageDragLeave);
  els.stage.addEventListener('drop',handleStageDrop);
  els.frameCount.addEventListener('change',() => { pushHistory(); rebuildGrid({preserve:true,resetSources:!state.sourceGrid}); });
  els.layoutMode.addEventListener('change',() => { pushHistory(); rebuildGrid({preserve:true,resetSources:!state.sourceGrid}); requestAnimationFrame(fitStage); });
  els.columnCount.addEventListener('change',() => { if(els.layoutMode.value==='columns'){ pushHistory();rebuildGrid({preserve:true,resetSources:!state.sourceGrid});requestAnimationFrame(fitStage); } });
  [els.frameName, els.scaleRange].forEach(el => {
    el.addEventListener('focus', () => beginInputHistory(el));
    el.addEventListener('blur', () => endInputHistory(el));
    el.addEventListener('input', updateSelectedFromInputs);
  });
  els.eraseSizeRange.addEventListener('input', () => { state.eraseBrushSize = clamp(Number(els.eraseSizeRange.value) || 24, 4, 120); els.eraseSizeValue.textContent = `${state.eraseBrushSize}px`; });
  els.resetFrameBtn.addEventListener('click', resetSelected);
  els.copyPrevBtn.addEventListener('click', copyPrevious);
  els.clearEraseBtn.addEventListener('click', clearSelectedErase);
  els.resetAllBtn.addEventListener('click', resetAll);
  els.fitStageBtn.addEventListener('click', fitStage);
  els.toggleRulersBtn.addEventListener('click', toggleRulers);
  els.toggleGuidesBtn.addEventListener('click', toggleGuides);
  els.toggleEraseBtn.addEventListener('click', () => toggleEraseMode());
  els.clearGuidesBtn.addEventListener('click', clearGuides);
  els.horizontalRuler.addEventListener('pointerdown', e => beginGuideFromRuler('v', e));
  els.verticalRuler.addEventListener('pointerdown', e => beginGuideFromRuler('h', e));
  let rulerViewportRaf = 0;
  const scheduleViewportRulers = () => {
    if (rulerViewportRaf) return;
    rulerViewportRaf = requestAnimationFrame(() => {
      rulerViewportRaf = 0;
      if (state.image && state.rulersVisible) renderRulers();
    });
  };
  els.stageViewport.addEventListener('scroll', scheduleViewportRulers, { passive: true });
  window.addEventListener('resize', scheduleViewportRulers);
  els.playBtn.addEventListener('click', togglePreview);
  els.previewFps.addEventListener('change', () => { if (state.playing) { if (state.playTimer) clearTimeout(state.playTimer); previewTick(); } });
  els.mainCanvas.addEventListener('pointerdown', handlePointerDown);
  window.addEventListener('pointermove', handlePointerMove);
  window.addEventListener('pointermove', handleGuidePointerMove);
  window.addEventListener('pointerup', handlePointerUp);
  window.addEventListener('pointerup', handleGuidePointerUp);
  window.addEventListener('pointercancel', handlePointerUp);
  window.addEventListener('pointercancel', handleGuidePointerUp);
  els.mainCanvas.addEventListener('wheel', handleWheel, { passive: false });
  els.webpWidth.addEventListener('input', () => updateWebpDimensions(false, 'width'));
  els.webpHeight.addEventListener('input', () => updateWebpDimensions(false, 'height'));
  els.pngCompression.addEventListener('change', () => {
    const v = els.pngCompression.value;
    els.pngExportResult.className = 'export-result';
    els.pngExportResult.textContent = v === 'lossless'
      ? '无损重编码只移除元数据，体积下降通常有限。'
      : v === '64'
        ? '极致压缩：最多 64 色，体积最小，渐变素材可能出现色阶。'
        : v === '128'
          ? '强压缩：最多 128 色，适合游戏特效和体积敏感素材。'
          : '智能压缩：最多 256 色，保留透明 Alpha，机制接近 Tinify/TinyPNG 的索引色量化。';
  });

  els.exportPngBtn.addEventListener('click', exportPng);
  els.exportWebpBtn.addEventListener('click', exportWebp);
  els.exportGifBtn.addEventListener('click', exportGif);
  document.addEventListener('paste', handlePaste, true);
  window.addEventListener('keydown', e => {
    const key = String(e.key || '').toLowerCase();
    const activeEl = document.activeElement;
    const editing = /^(INPUT|TEXTAREA|SELECT)$/.test(activeEl?.tagName || '') || !!activeEl?.isContentEditable;
    if (!editing && !e.metaKey && !e.ctrlKey && !e.altKey && ['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
      if (state.image && state.selected >= 0) {
        e.preventDefault();
        if (!state.nudgeHistoryActive) {
          pushHistory();
          state.nudgeHistoryActive = true;
        }
        state.lastNudgeKey = key;
        if (state.nudgeHistoryTimer) clearTimeout(state.nudgeHistoryTimer);
        state.nudgeHistoryTimer = setTimeout(() => {
          state.nudgeHistoryActive = false;
          state.lastNudgeKey = '';
          state.nudgeHistoryTimer = null;
        }, 220);
        const step = e.shiftKey ? 10 : 1;
        if (key === 'arrowleft') nudgeSelectedFrame(-step, 0);
        else if (key === 'arrowright') nudgeSelectedFrame(step, 0);
        else if (key === 'arrowup') nudgeSelectedFrame(0, -step);
        else if (key === 'arrowdown') nudgeSelectedFrame(0, step);
      }
      return;
    }
    if (!editing && (key === 'delete' || key === 'backspace') && state.selectedGuideId != null) {
      e.preventDefault();
      deleteSelectedGuide();
      return;
    }
    if (!editing && key === 'escape' && state.selectedGuideId != null) {
      state.selectedGuideId = null; renderGuides(); renderRulers(); return;
    }
    if (!editing && key === 'escape' && state.eraseMode) {
      e.preventDefault();
      toggleEraseMode(false);
      return;
    }
    if (!editing && (e.metaKey || e.ctrlKey) && key === ';') {
      e.preventDefault(); toggleGuides(); return;
    }
    if (!editing && e.shiftKey && key === 'r') {
      e.preventDefault(); toggleRulers(); return;
    }
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && key === 'z') {
      if (state.history.length) {
        e.preventDefault();
        undo();
      }
    }
  });
  window.addEventListener('keyup', e => {
    const key = String(e.key || '').toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key) && state.lastNudgeKey === key) {
      state.nudgeHistoryActive = false;
      state.lastNudgeKey = '';
      if (state.nudgeHistoryTimer) {
        clearTimeout(state.nudgeHistoryTimer);
        state.nudgeHistoryTimer = null;
      }
    }
  });
  window.addEventListener('resize', () => { if (state.image) fitStage(); });
  window.addEventListener('beforeunload', () => state.objectUrls.forEach(url => { try { URL.revokeObjectURL(url); } catch (_) {} }));

  state.layoutMode = normalizeLayoutMode(els.layoutMode.value);
  state.columnCount = clamp(parseInt(els.columnCount.value || '2', 10), 1, state.frameCount);
  els.columnCount.disabled = true;
  els.eraseSizeValue.textContent = `${state.eraseBrushSize}px`;
  initRuntime();
  enableProjectControls(false);
  syncSelectedControls();
  syncGuideToolbar();
})();

</script>
</body>
