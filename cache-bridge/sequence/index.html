<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>雪碧图拆帧工具 v1.1.0</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #0f1115;
  --panel: #171a20;
  --panel-2: #1c2027;
  --line: #2a2f38;
  --line-2: #363d48;
  --text: #f4f5f7;
  --muted: #949aa6;
  --accent: #f4c96b;
  --accent-2: #ffd98b;
  --danger: #ff7575;
  --ok: #72d6a2;
  --shadow: 0 18px 60px rgba(0,0,0,.28);
}
* { box-sizing: border-box; }
html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif; }
button, input, select { font:inherit; }
button { cursor:pointer; }
button:disabled, input:disabled { opacity:.45; cursor:not-allowed; }
.app-shell { min-width:1180px; min-height:100vh; }
.topbar { height:72px; padding:0 20px 0 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background:#12151a; position:sticky; top:0; z-index:10; }
.topbar h1 { font-size:17px; line-height:1.2; margin:0; letter-spacing:.2px; }
.topbar p { font-size:12px; color:var(--muted); margin:6px 0 0; }
.status-pill { font-size:12px; padding:8px 11px; border-radius:999px; background:#21252c; color:var(--muted); border:1px solid var(--line); }
.status-pill.ok { color:var(--ok); }
.status-pill.warn { color:var(--danger); }
.workspace { display:grid; grid-template-columns:300px minmax(500px,1fr) 320px; height:calc(100vh - 72px); }
.panel { background:var(--panel); overflow:auto; border-right:1px solid var(--line); }
.right-panel { border-right:0; border-left:1px solid var(--line); }
.panel-section { padding:16px; border-bottom:1px solid var(--line); }
.section-title { font-weight:700; font-size:13px; }
.section-sub { color:var(--muted); font-size:11px; margin-top:4px; }
.section-row { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:12px; }
.sticky-row { position:sticky; top:0; background:var(--panel); z-index:3; padding-top:2px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.field { display:flex; flex-direction:column; gap:7px; font-size:11px; color:var(--muted); margin-top:10px; }
.field:first-child { margin-top:0; }
.field input, .field select { width:100%; height:34px; border-radius:8px; border:1px solid var(--line-2); background:#101318; color:var(--text); outline:none; padding:0 10px; }
.field input:focus, .field select:focus { border-color:#7e6a3e; box-shadow:0 0 0 2px rgba(244,201,107,.08); }
.field input[type="range"] { padding:0; border:0; background:transparent; }
.field-inline-label { display:flex; align-items:center; justify-content:space-between; }
.field-inline-label b { color:var(--accent); font-size:11px; }
.button-field { justify-content:flex-end; }
.btn { height:34px; border-radius:8px; border:1px solid transparent; padding:0 12px; color:var(--text); background:#252a32; font-size:12px; font-weight:650; }
.btn:hover:not(:disabled) { filter:brightness(1.08); }
.btn.primary { background:linear-gradient(180deg,#f2d18b,#d5ab55); color:#211b10; }
.btn.secondary { background:#232832; border-color:#343b47; }
.btn.ghost { background:transparent; border-color:var(--line-2); color:#c7cbd2; }
.btn.full { width:100%; margin-top:12px; }
.button-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
.hint { color:#707782; font-size:10px; line-height:1.55; margin-top:10px; }
.frame-badge { background:#262b33; color:var(--accent); border:1px solid #363d47; border-radius:999px; padding:4px 8px; font-size:10px; }
.stage-panel { min-width:0; display:flex; flex-direction:column; background:#0b0d10; }
.stage-toolbar { min-height:48px; padding:7px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; background:#15181d; border-bottom:1px solid var(--line); }
.stage-toolbar > div:first-child { display:flex; align-items:center; gap:10px; min-width:0; }
.stage-toolbar b { font-size:12px; }
.stage-toolbar span { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.toolbar-actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
.toolbar-actions .btn.active { border-color:#8d7441; background:#2a2418; color:#f7d58d; }
.stage { --ruler-size:24px; flex:1; min-height:0; overflow:hidden; position:relative; background:#0b0d10; }
.stage-viewport { position:absolute; left:var(--ruler-size); top:var(--ruler-size); right:0; bottom:0; overflow:auto; display:flex; align-items:flex-start; justify-content:center; padding:24px; background-image:linear-gradient(45deg,#101318 25%,transparent 25%),linear-gradient(-45deg,#101318 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#101318 75%),linear-gradient(-45deg,transparent 75%,#101318 75%); background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0px; }
.stage.rulers-hidden .stage-viewport, .stage.no-image .stage-viewport { left:0; top:0; }
.stage-empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--muted); pointer-events:none; }
.stage-empty strong { color:#cfd2d8; font-size:14px; }
.stage-empty span { font-size:11px; }
.stage-icon { width:50px; height:50px; display:grid; place-items:center; border:1px solid var(--line); border-radius:14px; background:#14171c; font-size:21px; color:var(--accent); margin-bottom:4px; }
#mainCanvas { display:block; box-shadow:var(--shadow); background:transparent; touch-action:none; }
/* 标尺属于编辑区本身，永久贴在窗口上沿/左沿；画布在独立滚动视口里移动。 */
.canvas-editor { display:none; position:relative; flex:none; user-select:none; }
.stage.rulers-hidden .ruler, .stage.rulers-hidden .ruler-corner,
.stage.no-image .ruler, .stage.no-image .ruler-corner { display:none; }
.ruler-corner { position:absolute; left:0; top:0; width:var(--ruler-size); height:var(--ruler-size); background:#1b1f25; border-right:1px solid #414957; border-bottom:1px solid #414957; z-index:30; }
.ruler-corner::after { content:''; position:absolute; right:5px; bottom:5px; width:5px; height:5px; border-right:1px solid #8b94a1; border-bottom:1px solid #8b94a1; }
.ruler { display:block; position:absolute; background:#1b1f25; z-index:29; touch-action:none; }
.ruler.horizontal { left:var(--ruler-size); top:0; height:var(--ruler-size); cursor:row-resize; border-bottom:1px solid #414957; }
.ruler.vertical { left:0; top:var(--ruler-size); width:var(--ruler-size); cursor:col-resize; border-right:1px solid #414957; }
.canvas-stack { position:relative; flex:none; line-height:0; }
.guide-layer { position:absolute; inset:0; z-index:4; pointer-events:none; overflow:visible; }
.guide-layer.hidden { display:none; }
.guide { position:absolute; pointer-events:auto; z-index:5; background:#45bfff; box-shadow:0 0 0 1px rgba(0,0,0,.18); }
.guide.vertical { width:1px; cursor:col-resize; transform:translateX(-.5px); }
.guide.horizontal { height:1px; cursor:row-resize; transform:translateY(-.5px); }
.guide.vertical::before { content:''; position:absolute; top:0; bottom:0; left:-5px; width:11px; }
.guide.horizontal::before { content:''; position:absolute; left:0; right:0; top:-5px; height:11px; }
.guide.selected { background:#f4c96b; box-shadow:0 0 0 1px rgba(244,201,107,.16); }
.guide.preview { pointer-events:none; opacity:.82; background:#72d6ff; }
.guide-label { position:absolute; display:none; min-width:34px; height:18px; line-height:18px; padding:0 5px; border-radius:4px; background:#101318; border:1px solid #46505e; color:#f4f5f7; font-size:9px; white-space:nowrap; box-shadow:0 4px 14px rgba(0,0,0,.28); }
.guide.selected .guide-label { display:block; }
.guide.vertical .guide-label { top:5px; left:5px; }
.guide.horizontal .guide-label { left:5px; top:5px; }
.ruler-tip { position:absolute; pointer-events:none; z-index:20; background:#101318; border:1px solid #46505e; color:#f4f5f7; border-radius:4px; font-size:9px; line-height:18px; height:18px; padding:0 5px; display:none; }
.preview-wrap { margin-top:10px; border-radius:10px; min-height:150px; border:1px solid var(--line); overflow:hidden; position:relative; display:grid; place-items:center; background-image:linear-gradient(45deg,#1e2229 25%,transparent 25%),linear-gradient(-45deg,#1e2229 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1e2229 75%),linear-gradient(-45deg,transparent 75%,#1e2229 75%); background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0; }
.preview-wrap canvas { max-width:100%; max-height:210px; image-rendering:auto; }
.preview-wrap span { position:absolute; color:var(--muted); font-size:11px; }
.preview-info { color:var(--muted); font-size:10px; margin-top:7px; text-align:center; }
.frame-list-section { min-height:260px; max-height:43vh; overflow:auto; }
.frame-list { display:flex; flex-direction:column; gap:6px; }
.frame-item { width:100%; min-width:0; display:grid; grid-template-columns:32px minmax(0,1fr) auto; align-items:center; gap:8px; border:1px solid var(--line); background:#12151a; border-radius:8px; padding:7px 8px; cursor:pointer; }
.frame-item:hover { border-color:#3d4551; }
.frame-item { position:relative; }
.frame-item.multi-selected { border-color:#735f37; background:#191711; }
.frame-item.active { border-color:#c49a45; background:#211b12; box-shadow:0 0 0 1px rgba(244,201,107,.16) inset; }
.frame-item.multi-selected::after { content:attr(data-select-order); position:absolute; right:4px; top:3px; min-width:16px; height:16px; padding:0 4px; display:grid; place-items:center; border-radius:999px; background:#f4c96b; color:#211b10; font-size:9px; font-weight:800; line-height:1; }
.frame-item[draggable="true"] { cursor:grab; }
.frame-item.dragging { opacity:.42; }
.frame-item.drop-target { border-color:var(--accent); box-shadow:0 0 0 1px rgba(244,201,107,.18) inset; }
.frame-num { width:26px; height:26px; display:grid; place-items:center; border-radius:6px; background:#232832; color:#b7bdc7; font-size:10px; }
.frame-item.active .frame-num { background:#5e4b28; color:#ffe6b0; }
.frame-name { min-width:0; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.frame-transform { color:#6f7680; font-size:9px; white-space:nowrap; }
.export-section { background:#15181d; }
.checkbox-row { display:flex; gap:8px; align-items:center; margin-top:10px; font-size:11px; color:var(--muted); }
.export-result { color:var(--muted); font-size:10px; line-height:1.5; margin-top:8px; min-height:15px; }
.export-result.ok { color:var(--ok); }
.export-result.warn { color:#f3bf70; }
.busy-overlay { position:fixed; inset:0; background:rgba(5,7,9,.72); backdrop-filter:blur(7px); z-index:100; display:grid; place-items:center; }
.busy-overlay[hidden] { display:none; }
.busy-card { width:310px; padding:24px; border-radius:14px; border:1px solid var(--line-2); background:#171a20; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center; }
.busy-card b { font-size:13px; }
.busy-card span { color:var(--muted); font-size:10px; }
.spinner { width:28px; height:28px; border:3px solid #343943; border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin-bottom:3px; }
.progress { width:100%; height:4px; border-radius:99px; background:#272c34; overflow:hidden; margin-top:4px; }
.progress i { display:block; width:0%; height:100%; background:var(--accent); transition:width .12s linear; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (max-width:1280px) { .workspace { grid-template-columns:285px minmax(450px,1fr) 300px; } }

/* Compact left panel: import happens directly in the middle canvas. */
.left-panel .panel-section { padding:11px 12px; }
.config-section { padding-top:10px !important; padding-bottom:10px !important; }
.grid-3-compact { display:grid; grid-template-columns:.78fr 1.36fr .72fr; gap:6px; align-items:end; }
.grid-3-compact .field { margin:0; gap:5px; font-size:10px; min-width:0; }
.grid-3-compact .field input, .grid-3-compact .field select { height:30px; padding:0 6px; font-size:11px; min-width:0; }
.preview-section { padding-top:10px !important; padding-bottom:10px !important; }
.preview-head { margin-bottom:0; }
.preview-actions { display:flex; align-items:center; gap:6px; }
.preview-fps { display:flex; align-items:center; gap:4px; color:var(--muted); font-size:10px; }
.preview-fps input { width:46px; height:28px; border-radius:7px; border:1px solid var(--line-2); background:#101318; color:var(--text); padding:0 5px; }
.preview-actions .btn { height:28px; padding:0 9px; font-size:11px; }
.compact-selected .section-row { margin-bottom:6px; }
.compact-input-row, .compact-slider-row { display:grid; grid-template-columns:38px minmax(0,1fr) 43px; align-items:center; gap:7px; margin-top:8px; color:var(--muted); font-size:10px; }
.compact-input-row { grid-template-columns:38px minmax(0,1fr); }
.compact-input-row input { height:30px; min-width:0; border-radius:7px; border:1px solid var(--line-2); background:#101318; color:var(--text); outline:none; padding:0 9px; }
.compact-slider-row input[type=range] { width:100%; min-width:0; margin:0; }
.compact-slider-row b { color:var(--accent); font-size:11px; text-align:right; white-space:nowrap; }
.compact-actions { margin-top:10px; gap:6px; }
.compact-actions .btn { height:30px; padding:0 7px; font-size:11px; }
.compact-clear { margin-top:7px !important; height:29px !important; }
.left-panel .preview-wrap { margin-top:7px; min-height:155px; }
.stage.drag-active .stage-viewport { box-shadow:inset 0 0 0 2px rgba(244,201,107,.95); background-color:rgba(244,201,107,.035); }
.stage.drag-active .stage-empty strong { color:var(--accent-2); }
.stage-empty { pointer-events:auto; }
.stage-empty strong { font-size:15px; }

</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>雪碧图拆帧工具 <span style="font-size:10px;font-weight:500;color:#6f7680">v1.1.0</span></h1>
        <p>本地运行 · 静态/动态图拆帧 · 画布拖入/粘贴 · PNG / WebP / GIF</p>
      </div>
      <div class="status-pill" id="runtimeStatus">检查本地编码器…</div>
    </header>

    <main class="workspace">
      <aside class="panel left-panel">
        <section class="panel-section config-section">
          <div class="grid-3-compact">
            <label class="field"><span>总帧数</span><input id="frameCount" type="number" min="1" max="300" value="10" /></label>
            <label class="field"><span>切片排列</span>
              <select id="layoutMode">
                <option value="vertical">单竖列</option>
                <option value="horizontal">单横列</option>
                <option value="columns" selected>按列数排列</option>
              </select>
            </label>
            <label class="field"><span>列数</span><input id="columnCount" type="number" min="1" max="300" value="2" /></label>
          </div>
        </section>
        <section class="panel-section preview-section">
          <div class="section-row preview-head">
            <div class="section-title">动画预览</div>
            <div class="preview-actions">
              <label class="preview-fps"><span>FPS</span><input id="previewFps" type="number" min="1" max="60" value="12" /></label>
              <button class="btn primary" id="playBtn" disabled>开始预览</button>
            </div>
          </div>
          <div class="preview-wrap empty" id="previewWrap">
            <canvas id="previewCanvas"></canvas>
            <span id="previewEmpty">导入图片后可预览</span>
          </div>
          <div class="preview-info" id="previewInfo">—</div>
        </section>
        <section class="panel-section compact-selected">
          <div class="section-row">
            <div class="section-title">当前切片</div>
            <span class="frame-badge" id="selectedBadge">未选择</span>
          </div>
          <label class="compact-input-row"><span>名称</span><input id="frameName" type="text" placeholder="frame_001" disabled /></label>
          <label class="compact-slider-row"><span>缩放</span><input id="scaleRange" type="range" min="10" max="400" step="1" value="100" disabled /><b id="scaleValue">100%</b></label>
          <label class="compact-slider-row"><span>橡皮</span><input id="eraseSizeRange" type="range" min="4" max="120" step="1" value="24" disabled /><b id="eraseSizeValue">24px</b></label>
          <div class="button-row compact-actions">
            <button class="btn secondary" id="resetFrameBtn" disabled>重置当前帧</button>
            <button class="btn secondary" id="copyPrevBtn" disabled>复制上一帧</button>
          </div>
          <button class="btn ghost full compact-clear" id="clearEraseBtn" disabled>清除当前帧擦除</button>
        </section>
      </aside>

      <section class="stage-panel">
        <div class="stage-toolbar">
          <div>
            <b>切片画布</b>
            <span id="gridMeta">等待导入图片</span>
          </div>
          <div class="toolbar-actions">
            <button class="btn ghost active" id="toggleRulersBtn" disabled>标尺：显示</button>
            <button class="btn ghost active" id="toggleGuidesBtn" disabled>参考线：显示</button>
            <button class="btn ghost" id="toggleEraseBtn" disabled>擦除：关闭</button>
            <button class="btn ghost" id="clearGuidesBtn" disabled>清空参考线</button>
            <button class="btn ghost" id="resetAllBtn" disabled>重置全部帧</button>
            <button class="btn ghost" id="fitStageBtn" disabled>适应窗口</button>
          </div>
        </div>
        <div class="stage no-image" id="stage">
          <input id="fileInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/apng,.apng" hidden />
          <div class="ruler-corner" id="rulerCorner" title="标尺原点"></div>
          <canvas class="ruler horizontal" id="horizontalRuler" title="向下拖出竖向参考线"></canvas>
          <canvas class="ruler vertical" id="verticalRuler" title="向右拖出横向参考线"></canvas>
          <div class="stage-viewport" id="stageViewport">
            <div class="stage-empty" id="stageEmpty">
              <div class="stage-icon">✦</div>
              <strong>拖入图片，或 ⌘V / Ctrl+V 粘贴</strong>
              <span>支持 PNG / JPG / GIF / WebP / APNG，拖到中间画布即可导入</span>
            </div>
            <div class="canvas-editor" id="canvasEditor">
              <div class="canvas-stack" id="canvasStack">
                <canvas id="mainCanvas"></canvas>
                <div class="guide-layer" id="guideLayer"></div>
              </div>
            </div>
          </div>
          <div class="ruler-tip" id="rulerTip"></div>
        </div>
      </section>

      <aside class="panel right-panel">
        <section class="panel-section frame-list-section">
          <div class="section-row sticky-row">
            <div>
              <div class="section-title">切片列表</div>
              <div class="section-sub" id="frameListMeta">0 帧</div>
            </div>
          </div>
          <div class="frame-list" id="frameList"></div>
        </section>

        <section class="panel-section export-section">
          <div class="section-title">导出 PNG 序列</div>
          <div class="grid-2">
            <label class="field">
              <span>尺寸倍率</span>
              <select id="pngScale">
                <option value="0.5">50%</option>
                <option value="0.75">75%</option>
                <option value="1" selected>100%</option>
                <option value="1.5">150%</option>
                <option value="2">200%</option>
              </select>
            </label>
            <label class="field">
              <span>PNG 压缩</span>
              <select id="pngCompression">
                <option value="smart" selected>智能压缩（Tinify 风格 · 推荐）</option>
                <option value="128">强压缩（128 色）</option>
                <option value="64">极致压缩（64 色）</option>
                <option value="lossless">无损重编码（仅去元数据）</option>
              </select>
            </label>
          </div>
          <button class="btn primary full" id="exportPngBtn" disabled>导出 PNG 序列 ZIP</button>
          <div class="export-result" id="pngExportResult">智能压缩会保留透明通道，并通过颜色量化显著减小 PNG 体积。</div>
        </section>

        <section class="panel-section export-section">
          <div class="section-title">导出动态 WebP</div>
          <div class="grid-2">
            <label class="field">
              <span>宽度 px</span>
              <input id="webpWidth" type="number" min="1" value="200" />
            </label>
            <label class="field">
              <span>高度 px</span>
              <input id="webpHeight" type="number" min="1" value="200" />
            </label>
          </div>
          <div class="grid-2">
            <label class="field">
              <span>FPS</span>
              <input id="webpFps" type="number" min="1" max="60" value="12" />
            </label>
            <label class="field">
              <span>质量</span>
              <input id="webpQuality" type="number" min="10" max="100" value="82" />
            </label>
          </div>
          <label class="field">
            <span>目标体积 KB（0 = 不限制）</span>
            <input id="webpTargetKb" type="number" min="0" value="0" />
          </label>
          <label class="checkbox-row">
            <input id="lockAspect" type="checkbox" checked />
            <span>锁定切片宽高比</span>
          </label>
          <button class="btn primary full" id="exportWebpBtn" disabled>导出动态 WebP</button>
          <div class="export-result" id="exportResult"></div>
        </section>
        <section class="panel-section export-section">
          <div class="section-title">导出 GIF</div>

  async function decodeAnimation(file, bytes, mime) {

  function applyLoadedSource(drawable, file, sourceLabel, options={}) {
    pushHistory();
    clearPlaybackTimer();
    state.image=drawable;
    state.fileName=file.name || 'clipboard.png';
    state.importedAnimated=!!options.animated;
    state.animatedSourceType=options.animatedSourceType || '';
    state.sourceGrid=options.sourceGrid || null;
    state.sourceFrameDurations=options.durations || [];

  let importSequence=0;
  async function setImage(file, sourceLabel='') {
    if(!file || !isImageFile(file)) return;
    const sequence=++importSequence;
    try {
      setBusy(true,'正在导入图片','检查图片类型与动画帧…',3);
      const mime=guessMimeType(file);
      const bytes=(mime==='image/gif'||mime==='image/webp'||mime==='image/png')?new Uint8Array(await file.arrayBuffer()):null;
      if(bytes && hasAnimationChunk(bytes,mime)) {
        updateBusy('正在读取动态图所有帧…',10);

        const result=packAnimationFrames(decoded,mime);
        if(sequence!==importSequence)return;
        applyLoadedSource(result.drawable,file,sourceLabel,{animated:true,...result});
        updateBusy(`已拆分 ${result.frameCount} 帧`,100);
      } else {
        const image=await loadStaticDrawable(file);
        if(sequence!==importSequence)return;
        applyLoadedSource(image,file,sourceLabel,{animated:false});

      }
      setTimeout(()=>{if(sequence===importSequence)setBusy(false);},140);
    } catch(e) {
      if(sequence!==importSequence)return;
      console.error(e);setBusy(false);
      alert(`图片导入失败：${e.message || e}`);
    }
  }

  function enableProjectControls(enabled) {
    [els.resetFrameBtn, els.copyPrevBtn, els.playBtn, els.resetAllBtn, els.fitStageBtn, els.toggleRulersBtn, els.toggleGuidesBtn, els.toggleEraseBtn, els.clearGuidesBtn, els.exportPngBtn, els.exportWebpBtn, els.exportGifBtn]
      .forEach(el => el.disabled = !enabled);
    els.eraseSizeRange.disabled = !enabled || state.selected < 0;
    els.clearEraseBtn.disabled = !enabled || state.selected < 0;
    els.columnCount.disabled = !enabled || state.layoutMode !== 'columns';
  }

  function sourceCellOrigin(frame) {

  }

  }

  function getHandleRect(index) {
    const { col, row } = positionCellOrigin(index);
    const x = col * state.cellW;
    const y = row * state.cellH;
    const w = Math.min(state.cellW, Math.max(42, 62 / state.stageScale));
    const h = Math.min(state.cellH, Math.max(18, 22 / state.stageScale));
    return { x, y, w, h };
  }

  function drawFrame(ctx, index, targetX, targetY, targetW, targetH, options = {}) {
    if (!state.image || !state.frames[index]) return;
    const frame = state.frames[index];
    const { col, row } = sourceCellOrigin(frame);
    const sx = targetW / state.cellW;
    const sy = targetH / state.cellH;

    ctx.save();
    if (options.alpha != null) ctx.globalAlpha = options.alpha;
    ctx.beginPath();
    ctx.rect(targetX, targetY, targetW, targetH);
    ctx.clip();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const cropCenterX = (col + 0.5) * state.cellW;
    const cropCenterY = (row + 0.5) * state.cellH;
    ctx.translate(targetX + targetW / 2 + frame.dx * sx, targetY + targetH / 2 + frame.dy * sy);
    ctx.scale(frame.scale * sx, frame.scale * sy);

      const labelH = Math.min(targetH, Math.max(18, 22 / state.stageScale));
      ctx.fillStyle = options.selected ? 'rgba(244,201,107,.97)' : 'rgba(10,12,15,.82)';
      ctx.fillRect(targetX, targetY, labelW, labelH);

      ctx.textBaseline = 'middle';

      ctx.rect(targetX, targetY, labelW, labelH);

      ctx.fillText(label, targetX + 6 / state.stageScale, targetY + labelH / 2);

  function applyFrameErase(ctx, frame, targetX, targetY, targetW, targetH) {

  function syncGuideToolbar() {
    const hasImage = !!state.image;

    els.toggleGuidesBtn.textContent = `参考线：${state.guidesVisible ? '显示' : '隐藏'}`;

  function rulerMajorStep() {
    const desired = 72;
    const raw = desired / Math.max(.0001, state.stageScale);
    const steps = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
    return steps.find(v => v >= raw) || Math.ceil(raw / 10000) * 10000;
  }

  function prepareRulerCanvas(canvas, cssW, cssH) {
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

    canvas.style.height = `${Math.max(0, cssH)}px`;
    const bw = Math.max(1, Math.round(cssW * dpr));
    const bh = Math.max(1, Math.round(cssH * dpr));
