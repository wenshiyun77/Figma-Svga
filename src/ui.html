      const startPreviewPlayback = () => {
        if (!state.package?.project) return;
        if (state.previewPlaying) return;
        state.previewPlaying = true;
        state.previewStartedAt = performance.now() - (state.previewFrame / projectFps()) * 1000;
        updatePlayButton();
        const tick = (now) => {
          if (!state.previewPlaying) return;
          const fps = projectFps();
          const totalFrames = projectFrameCount();
          const elapsed = Math.max(0, (now - state.previewStartedAt) / 1000);
          const frame = Math.floor(elapsed * fps) % totalFrames;
          state.previewFrame = frame;
          renderPreview(frame);
          state.previewRaf = window.requestAnimationFrame(tick);
        };
        state.previewRaf = window.requestAnimationFrame(tick);
      };

      const togglePreviewPlayback = () => {
        if (state.previewPlaying) {
          stopPreviewPlayback();
          renderPreview(state.previewFrame);
          return;
        }
        startPreviewPlayback();
      };

      const setCanvasZoom = (value) => {
        state.canvasZoom = clamp(Number(value) || 1, 0.1, 4);
        renderPreview(state.previewFrame);
      };

      const selectedProjectAsset = () => {
        if (!state.package || !state.selectedKey) return null;
        return state.package.project.assets.find((asset) => asset.key === state.selectedKey) || null;
      };

      const normalizeAssetTransform = (asset) => {
        asset.transform = {
          x: Number(asset.transform?.x || 0),
          y: Number(asset.transform?.y || 0),
          scale: Math.max(0.01, Number(asset.transform?.scale || 1)),
          rotate: Number(asset.transform?.rotate || 0),
        };
        return asset.transform;
      };

      const assetRenderGeometry = (asset, payloadOverride = null) => {
        const payload = payloadOverride || assetPayloadByKey(asset.key);
        const imageWidth = Math.max(1, Math.round(Number(payload?.width || asset.source?.absoluteBoundingBox?.width || asset.width || 1)));
        const imageHeight = Math.max(1, Math.round(Number(payload?.height || asset.source?.absoluteBoundingBox?.height || asset.height || 1)));
        const baseWidth = Math.max(1, Number(asset.source?.absoluteBoundingBox?.width || asset.width || imageWidth));
        const baseHeight = Math.max(1, Number(asset.source?.absoluteBoundingBox?.height || asset.height || imageHeight));
        const transform = normalizeAssetTransform(asset);
        const scale = Math.max(0.01, Number(transform.scale || 1));
        return {
          imageWidth,
          imageHeight,
          baseWidth,
          baseHeight,
          displayWidth: baseWidth * scale,
          displayHeight: baseHeight * scale,
          x: Number(transform.x || 0),
          y: Number(transform.y || 0),
          scale,
          rotate: Number(transform.rotate || 0),
        };
      };

      const updateSelectionOverlay = () => {
        const interaction = $("canvasInteraction");
        const box = $("selectionBox");
        const asset = selectedProjectAsset();
        const project = state.package?.project;
        if (!interaction || !box || !asset || !project?.canvas) {
          if (interaction) interaction.hidden = true;
          $("alignmentTools").hidden = true;
          return;
        }

        const geometry = assetRenderGeometry(asset);
        const zoom = state.canvasZoom;
        interaction.hidden = false;
        $("alignmentTools").hidden = false;
        box.style.left = `${geometry.x * zoom}px`;
        box.style.top = `${geometry.y * zoom}px`;
        box.style.width = `${geometry.displayWidth * zoom}px`;
        box.style.height = `${geometry.displayHeight * zoom}px`;
        box.style.transform = `rotate(${geometry.rotate}deg)`;
      };

      const syncTransformControlLimits = () => {
        const project = state.package?.project;
        const width = Math.max(100, Math.round(Number(project?.canvas?.width || 750)));
        const height = Math.max(100, Math.round(Number(project?.canvas?.height || 750)));
        $("transformX").min = String(-width);
        $("transformX").max = String(width * 2);
        $("transformY").min = String(-height);
        $("transformY").max = String(height * 2);
      };

      const syncTransformControls = () => {
        const asset = selectedProjectAsset();
        const disabled = !asset;
        for (const id of ["transformX", "transformY", "transformScale", "transformRotate", "resetTransformBtn"]) {
          $(id).disabled = disabled;
        }
        syncTransformControlLimits();
        if (!asset) {
          $("transformXValue").textContent = "0";
          $("transformYValue").textContent = "0";
          $("transformScaleValue").textContent = "1.00x";
          $("transformRotateValue").textContent = "0°";
          updateSelectionOverlay();
          return;
        }
        const transform = normalizeAssetTransform(asset);
        $("transformX").value = String(Math.round(transform.x));
        $("transformY").value = String(Math.round(transform.y));
        $("transformScale").value = String(round(transform.scale, 2));
        $("transformRotate").value = String(Math.round(transform.rotate));
        $("transformXValue").textContent = String(Math.round(transform.x));
        $("transformYValue").textContent = String(Math.round(transform.y));
        $("transformScaleValue").textContent = `${Number(transform.scale).toFixed(2)}x`;
        $("transformRotateValue").textContent = `${Math.round(transform.rotate)}°`;
        updateSelectionOverlay();
      };

      const updateSelectedAssetTransform = (patch, renderMode = "full") => {
        const asset = selectedProjectAsset();
        if (!asset) return;
        const transform = normalizeAssetTransform(asset);
        asset.transform = {
          ...transform,
          ...patch,
          scale: Math.max(0.01, Number(patch.scale ?? transform.scale ?? 1)),
        };
        syncTransformControls();
        if (renderMode === "full") {
          renderLayers();
        } else {
          renderPreview(state.previewFrame);
        }
      };

      const resetSelectedTransform = () => {
        updateSelectedAssetTransform({ scale: 1, rotate: 0 }, "preview");
      };

      const canvasPointFromEvent = (event) => {
        const project = state.package?.project;
        const frame = $("canvasFrame");
        if (!project?.canvas || !frame) return null;
        const rect = frame.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return null;
        return {
          x: ((event.clientX - rect.left) / rect.width) * Number(project.canvas.width || 1),
          y: ((event.clientY - rect.top) / rect.height) * Number(project.canvas.height || 1),
        };
      };

      const pointInAsset = (point, asset) => {
        const geometry = assetRenderGeometry(asset);
        const cx = geometry.x + geometry.displayWidth / 2;
        const cy = geometry.y + geometry.displayHeight / 2;
        const radians = (-geometry.rotate * Math.PI) / 180;
        const cos = Math.cos(radians);
        const sin = Math.sin(radians);
        const dx = point.x - cx;
        const dy = point.y - cy;
        const localX = dx * cos - dy * sin + geometry.displayWidth / 2;
        const localY = dx * sin + dy * cos + geometry.displayHeight / 2;
        return localX >= 0 && localX <= geometry.displayWidth && localY >= 0 && localY <= geometry.displayHeight;
      };

      const hitTestAsset = (point) => {
        const assets = state.package?.project?.assets || [];
        for (let index = assets.length - 1; index >= 0; index -= 1) {
          const asset = assets[index];
          if (asset.visible === false) continue;
          if (pointInAsset(point, asset)) return asset;
        }
        return null;
      };

      const beginCanvasDrag = (event, mode = "translate") => {
        const asset = selectedProjectAsset();
        const point = canvasPointFromEvent(event);
        if (!asset || !point) return;
        const geometry = assetRenderGeometry(asset);
        state.canvasDrag = {
          mode,
          pointerId: event.pointerId,
          startPoint: point,
          startX: geometry.x,
          startY: geometry.y,
          startScale: geometry.scale,
          startRotate: geometry.rotate,
          centerX: geometry.x + geometry.displayWidth / 2,
          centerY: geometry.y + geometry.displayHeight / 2,
        };
        try {
          event.target.setPointerCapture(event.pointerId);
        } catch (_error) {}
        event.preventDefault();
        event.stopPropagation();
      };

      const moveCanvasDrag = (event) => {
        const drag = state.canvasDrag;
        if (!drag) return;
        const point = canvasPointFromEvent(event);
        if (!point) return;

        if (drag.mode === "translate") {
          updateSelectedAssetTransform({
            x: drag.startX + point.x - drag.startPoint.x,
            y: drag.startY + point.y - drag.startPoint.y,
          }, "preview");
        } else if (drag.mode === "scale") {
          const startDistance = Math.max(1, Math.hypot(drag.startPoint.x - drag.centerX, drag.startPoint.y - drag.centerY));
          const currentDistance = Math.max(1, Math.hypot(point.x - drag.centerX, point.y - drag.centerY));
          updateSelectedAssetTransform({
            scale: clamp(drag.startScale * (currentDistance / startDistance), 0.05, 5),
          }, "preview");
        } else if (drag.mode === "rotate") {
          const startRadians = Math.atan2(drag.startPoint.y - drag.centerY, drag.startPoint.x - drag.centerX);
          const currentRadians = Math.atan2(point.y - drag.centerY, point.x - drag.centerX);
          updateSelectedAssetTransform({
            rotate: drag.startRotate + ((currentRadians - startRadians) * 180) / Math.PI,
          }, "preview");
        }
      };

      const endCanvasDrag = (event) => {
        if (!state.canvasDrag) return;
        try {
          event.target.releasePointerCapture(state.canvasDrag.pointerId);
        } catch (_error) {}
        state.canvasDrag = null;
        syncTransformControls();
        renderLayers();
      };

      const alignSelectedAsset = (type) => {
        const asset = selectedProjectAsset();
        const project = state.package?.project;
        if (!asset || !project?.canvas) return;
        const geometry = assetRenderGeometry(asset);
        const canvasWidth = Number(project.canvas.width || 1);
        const canvasHeight = Number(project.canvas.height || 1);
        const next = {};
        if (type === "left") next.x = 0;
        if (type === "center-h") next.x = (canvasWidth - geometry.displayWidth) / 2;
        if (type === "right") next.x = canvasWidth - geometry.displayWidth;
        if (type === "top") next.y = 0;
        if (type === "center-v") next.y = (canvasHeight - geometry.displayHeight) / 2;
        if (type === "bottom") next.y = canvasHeight - geometry.displayHeight;
        updateSelectedAssetTransform(next, "full");
      };

      const renderLayers = () => {
        const list = $("layerList");
        const project = state.package?.project;
        if (!project?.assets?.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "选中 Figma 画布后打开插件会自动同步图层";
          list.replaceChildren(empty);
          $("canvasMeta").textContent = "未导入";
          $("layerCountBadge").textContent = "0";
          $("downloadJsonBtn").disabled = true;
          $("exportSvgaBtn").disabled = true;
          state.selectedKey = null;
          syncControlsFromSelected();
          renderPreview();
          return;
        }

        $("canvasMeta").textContent = `${project.canvas.width}x${project.canvas.height} / ${project.assets.length} 层`;
        $("layerCountBadge").textContent = String(project.assets.length);
        $("downloadJsonBtn").disabled = false;
        $("exportSvgaBtn").disabled = state.busy;

        list.replaceChildren();
        for (const asset of project.assets) {
          const isParticleLayer = asset.type === "effect" && asset.effectConfig?.type === "particles";
          const status = isParticleLayer ? null : state.layerStatuses.get(asset.key);
          const isStale = status?.changed === true;
          const row = document.createElement("div");
          row.className = `layer-row${asset.key === state.selectedKey ? " selected" : ""}${isStale ? " stale" : ""}`;
          row.dataset.key = asset.key;
          const thumb = document.createElement("span");
          thumb.className = "layer-thumb";
          thumb.textContent = isParticleLayer ? "P" : "L";

          const copy = document.createElement("span");
          copy.className = "layer-copy";

          const name = document.createElement("span");
          name.className = "layer-name";
          name.title = asset.label || asset.key;
          name.textContent = asset.label || asset.key;

          const meta = document.createElement("span");
          meta.className = "layer-meta";
          meta.textContent = isParticleLayer
            ? `粒子 / ${PARTICLE_SYSTEM_LABELS[asset.effectConfig?.particleSystemType || "falling"] || "粒子"}`
            : isStale ? "已变化" : MOTION_LABELS[asset.animation?.type || "none"] || "无动画";

          const updateBtn = document.createElement("button");
          updateBtn.className = "layer-update-btn";
          updateBtn.type = "button";
          updateBtn.textContent = "更新";
          updateBtn.hidden = isParticleLayer;

          row.addEventListener("click", () => {
            state.selectedKey = asset.key;
            syncControlsFromSelected();
            renderLayers();
          });
          updateBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            if (isParticleLayer) return;
            void updateLayer(asset.key);
          });
          copy.append(name, meta);
          row.append(thumb, copy, updateBtn);
          list.appendChild(row);
        }
        syncControlsFromSelected();
        renderPreview();
      };

      const renderMotionOptions = () => {
        const selectedType = $("animationType").value || "none";
        const disabled = $("animationType").disabled;
        for (const button of document.querySelectorAll("[data-motion]")) {
          const isActive = button.dataset.motion === selectedType;
          button.classList.toggle("active", isActive);
          button.disabled = disabled;
        }
        $("motionControlPanel").hidden = disabled || selectedType === "none";
        $("intensityField").hidden = selectedType === "spin";
      };

      const ensureProjectEffects = () => {
        if (!state.package?.project) return [];
        if (!Array.isArray(state.package.project.effects)) {
          state.package.project.effects = [];
        }
        return state.package.project.effects;
      };

      const selectedSweepEffect = () => {
        const asset = selectedProjectAsset();
        if (!asset || asset.type === "effect") return null;
        return ensureProjectEffects().find(
          (effect) => effect.type === "sweep" && effect.sweepTarget === asset.key,
        ) || null;
      };

      const isParticleAsset = (asset) =>
        asset?.type === "effect" && asset.effectConfig?.type === "particles";

      const activeParticleAssets = (project) =>
        (project?.assets || []).filter((asset) => isParticleAsset(asset) && asset.visible !== false && asset.effectConfig?.enabled !== false);

      const selectedParticleEffect = () => {
        const asset = selectedProjectAsset();
        return isParticleAsset(asset) ? asset.effectConfig : null;
      };

      const makeDefaultSweepEffect = (assetKey) => ({
        id: `sweep_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        type: "sweep",
        enabled: true,
        sweepTarget: assetKey,
        sweepShape: "straight",
        sweepSpeed: 1,
        sweepColor: "#ffffff",
        sweepWidth: 100,
        sweepFeather: 20,
        sweepAngle: 30,
        sweepOpacity: 1,
        sweepBlendMode: "screen",
        sweepFadeEnabled: false,
      });

      const updateSweepValueLabels = () => {
        $("sweepSpeedValue").textContent = `${Number($("sweepSpeed").value || 1).toFixed(1)}x`;
        $("sweepWidthValue").textContent = String(Math.round(Number($("sweepWidth").value || 100)));
        $("sweepFeatherValue").textContent = String(Math.round(Number($("sweepFeather").value || 20)));
        $("sweepAngleValue").textContent = `${Math.round(Number($("sweepAngle").value || 0))}°`;
        $("sweepOpacityValue").textContent = Number($("sweepOpacity").value || 1).toFixed(2);
      };

      const syncSweepControlsFromSelected = () => {
        const asset = selectedProjectAsset();
        const effect = selectedSweepEffect();
        const canAttachSweep = Boolean(asset && !isParticleAsset(asset));
        $("addSweepBtn").disabled = !canAttachSweep || Boolean(effect);
        $("sweepEmpty").hidden = Boolean(effect);
        $("sweepControls").hidden = !effect;
        if (!asset) {
          $("sweepEmpty").textContent = "选择图层后可添加扫光。";
          return;
        }
        if (isParticleAsset(asset)) {
          $("sweepEmpty").textContent = "粒子层不支持添加扫光。";
          return;
        }
        if (!effect) {
          $("sweepEmpty").textContent = "当前图层未添加扫光。";
          return;
        }
        $("sweepShape").value = effect.sweepShape || "straight";
        $("sweepColor").value = effect.sweepColor || "#ffffff";
        $("sweepColorPreview").value = effect.sweepColor || "#ffffff";
        $("sweepSpeed").value = String(effect.sweepSpeed || 1);
        $("sweepWidth").value = String(effect.sweepWidth || 100);
        $("sweepFeather").value = String(effect.sweepFeather ?? 20);
        $("sweepAngle").value = String(effect.sweepAngle || 0);
        $("sweepOpacity").value = String(effect.sweepOpacity == null ? 1 : effect.sweepOpacity);
        $("sweepBlendBtn").textContent = `混合: ${effect.sweepBlendMode === "normal" ? "普通" : "滤色"}`;
        $("sweepFadeBtn").textContent = `淡入淡出: ${effect.sweepFadeEnabled ? "开" : "关"}`;
        updateSweepValueLabels();
      };

      const syncSweepFromControls = () => {
        const effect = selectedSweepEffect();
        if (!effect) return;
        effect.sweepShape = $("sweepShape").value;
        effect.sweepColor = $("sweepColor").value || "#ffffff";
        effect.sweepSpeed = Number($("sweepSpeed").value || 1);
        effect.sweepWidth = Number($("sweepWidth").value || 100);
        effect.sweepFeather = Number($("sweepFeather").value || 20);
        effect.sweepAngle = Number($("sweepAngle").value || 0);
        effect.sweepOpacity = Number($("sweepOpacity").value || 1);
        updateSweepValueLabels();
        renderPreview(state.previewFrame);
      };

      const addSweepToSelected = () => {
        const asset = selectedProjectAsset();
        if (!asset || selectedSweepEffect()) return;
        ensureProjectEffects().push(makeDefaultSweepEffect(asset.key));
        syncSweepControlsFromSelected();
        renderPreview(state.previewFrame);
      };

      const removeSweepFromSelected = () => {
        const asset = selectedProjectAsset();
        if (!asset || !state.package?.project) return;
        state.package.project.effects = ensureProjectEffects().filter(
          (effect) => !(effect.type === "sweep" && effect.sweepTarget === asset.key),
        );
        syncSweepControlsFromSelected();
        renderPreview(state.previewFrame);
      };

      const makeDefaultParticleEffect = (id) => ({
        id,
        type: "particles",
        enabled: true,
        particleSystemType: "falling",
        particleShape: "snow",
        particleCount: 30,
        particleDensity: 1,
        particleSpeed: 1,
        particleSize: 15,
        particleLifeSpan: 1,
        particleDecay: 0.2,
        particleRandomness: 0.5,
        particleColorMode: "solid",
        particleColor: "#ffffff",
        particleGradientColors: ["#ffffff", "#000000"],
        emissionOriginX: 0.5,
        emissionOriginY: 0.5,
        emissionAngle: 270,
        emissionSpread: 45,
        starPoints: 5,
        starInnerRadius: 0.5,
        sparkleIntensity: 0.6,
      });

      const makeDefaultParticleAsset = () => {
        const project = state.package?.project;
        const width = Math.max(1, Math.round(Number(project?.canvas?.width || 750)));
        const height = Math.max(1, Math.round(Number(project?.canvas?.height || 750)));
        const id = `particle_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
        return {
          key: `particle_layer_${id}`,
          label: `粒子特效_${id.slice(-4)}`,
          type: "effect",
          visible: true,
          width,
          height,
          transform: { x: 0, y: 0, scale: 1, rotate: 0 },
          animation: { type: "none", speed: 1, intensity: 1 },
          effectConfig: makeDefaultParticleEffect(id),
        };
      };

      const updateParticleValueLabels = () => {
        $("particleCountValue").textContent = String(Math.round(Number($("particleCount").value || 30)));
        $("particleSizeValue").textContent = String(Math.round(Number($("particleSize").value || 15)));
        $("particleSpeedValue").textContent = Number($("particleSpeed").value || 1).toFixed(1);
        $("particleRandomnessValue").textContent = Number($("particleRandomness").value || 0.5).toFixed(2);
        $("particleLifeSpanValue").textContent = Number($("particleLifeSpan").value || 1).toFixed(2);
        $("particleDecayValue").textContent = Number($("particleDecay").value || 0.2).toFixed(2);
        $("emissionOriginXValue").textContent = `${Math.round(Number($("emissionOriginX").value || 0.5) * 100)}%`;
        $("emissionOriginYValue").textContent = `${Math.round(Number($("emissionOriginY").value || 0.5) * 100)}%`;
        $("emissionAngleValue").textContent = `${Math.round(Number($("emissionAngle").value || 270))}°`;
        $("emissionSpreadValue").textContent = `${Math.round(Number($("emissionSpread").value || 45))}°`;
      };

      const syncParticleControlsFromSelected = () => {
        const project = state.package?.project;
        const asset = selectedProjectAsset();
        const effect = selectedParticleEffect();
        $("addParticleBtn").disabled = !project?.canvas;
        $("particleControls").hidden = !effect;
        $("particleEmpty").hidden = Boolean(effect);
        if (!project?.canvas) {
          $("particleEmpty").textContent = "导入 Figma 画布后可添加粒子层。";
          return;
        }
        if (!effect) {
          $("particleEmpty").textContent = asset
            ? "当前选中图层不是粒子层，点击添加粒子可新建粒子层。"
            : "点击添加粒子新建粒子层。";
          return;
        }
        $("particleSystemType").value = effect.particleSystemType || "falling";
        $("particleShape").value = effect.particleShape || "snow";
        $("particleCount").value = String(effect.particleCount || 30);
        $("particleSize").value = String(effect.particleSize || 15);
        $("particleSpeed").value = String(effect.particleSpeed || 1);
        $("particleRandomness").value = String(effect.particleRandomness == null ? 0.5 : effect.particleRandomness);
        $("particleLifeSpan").value = String(effect.particleLifeSpan || 1);
        $("particleDecay").value = String(effect.particleDecay == null ? 0.2 : effect.particleDecay);
        $("particleColorMode").value = effect.particleColorMode || "solid";
        $("particleColor").value = effect.particleColor || "#ffffff";
        $("particleColorPreview").value = effect.particleColor || "#ffffff";
        $("particleSecondaryColor").value = effect.particleGradientColors?.[1] || "#000000";
        $("particleSecondaryColorPreview").value = effect.particleGradientColors?.[1] || "#000000";
        $("emissionOriginX").value = String(effect.emissionOriginX == null ? 0.5 : effect.emissionOriginX);
        $("emissionOriginY").value = String(effect.emissionOriginY == null ? 0.5 : effect.emissionOriginY);
        $("emissionAngle").value = String(effect.emissionAngle == null ? 270 : effect.emissionAngle);
        $("emissionSpread").value = String(effect.emissionSpread == null ? 45 : effect.emissionSpread);
        $("particleSecondaryColorField").hidden = $("particleColorMode").value === "solid";
        $("particleSystemPanel").hidden = !["emission", "flame", "wave", "vortex"].includes($("particleSystemType").value);
        updateParticleValueLabels();
      };

      const syncParticleFromControls = () => {
        const effect = selectedParticleEffect();
        if (!effect) return;
        effect.particleSystemType = $("particleSystemType").value;
        effect.particleShape = $("particleShape").value;
        effect.particleCount = Number($("particleCount").value || 30);
        effect.particleSize = Number($("particleSize").value || 15);
        effect.particleSpeed = Number($("particleSpeed").value || 1);
        effect.particleRandomness = Number($("particleRandomness").value || 0.5);
        effect.particleLifeSpan = Number($("particleLifeSpan").value || 1);
        effect.particleDecay = Number($("particleDecay").value || 0.2);
        effect.particleColorMode = $("particleColorMode").value;
        effect.particleColor = $("particleColor").value || "#ffffff";
        effect.particleGradientColors = [effect.particleColor, $("particleSecondaryColor").value || "#000000"];
        effect.emissionOriginX = Number($("emissionOriginX").value || 0.5);
        effect.emissionOriginY = Number($("emissionOriginY").value || 0.5);
        effect.emissionAngle = Number($("emissionAngle").value || 270);
        effect.emissionSpread = Number($("emissionSpread").value || 45);
        syncParticleControlsFromSelected();
        renderLayers();
      };

      const addParticleLayer = () => {
        const project = state.package?.project;
        if (!project?.canvas) return;
        const particleAsset = makeDefaultParticleAsset();
        project.assets = [particleAsset, ...(project.assets || [])];
        state.selectedKey = particleAsset.key;
        syncParticleControlsFromSelected();
        renderLayers();
      };

      const removeSelectedParticleLayer = () => {
        const asset = selectedProjectAsset();
        const project = state.package?.project;
        if (!project || !isParticleAsset(asset)) return;
        project.assets = project.assets.filter((item) => item.key !== asset.key);
        state.selectedKey = project.assets[0]?.key || null;
        renderLayers();
      };

      const syncControlsFromSelected = () => {
        const asset = selectedProjectAsset();
        const disabled = !asset || isParticleAsset(asset);
        for (const id of ["animationType", "speed", "intensity"]) $(id).disabled = disabled;
        syncTransformControls();
        if (!asset) {
          $("animationType").value = "none";
          $("speed").value = "1";
          $("intensity").value = "1";
          $("speedValue").textContent = "1.0";
          $("intensityValue").textContent = "1.0";
          renderMotionOptions();
          syncSweepControlsFromSelected();
          syncParticleControlsFromSelected();
          return;
        }
        const animation = asset.animation || { type: "none", speed: 1, intensity: 1 };
        $("animationType").value = animation.type || "none";
        $("speed").value = String(animation.speed || 1);
        $("intensity").value = String(animation.intensity || 1);
        $("speedValue").textContent = Number($("speed").value).toFixed(1);
        $("intensityValue").textContent = Number($("intensity").value).toFixed(1);
        renderMotionOptions();
        syncSweepControlsFromSelected();
        syncParticleControlsFromSelected();
      };

      const syncSelectedFromControls = () => {
        const asset = selectedProjectAsset();
        if (!asset) return;
        asset.animation = {
          type: $("animationType").value,
          speed: Number($("speed").value),
          intensity: Number($("intensity").value),
        };
        if (state.package?.project) {
          state.package.project.exportRules = {
            fps: Number($("fps").value || 24),
            frames: Number($("frames").value || 72),
          };
        }
        renderMotionOptions();
        renderLayers();
      };

      const currentCaptureOptions = () => ({
        materialType: $("materialType").value || "figma_selection",
        exportScale: Number($("exportScale").value || 1),
        fps: Number($("fps").value || 24),
        frames: Number($("frames").value || 72),
        defaultAnimation: { type: "none", speed: 1, intensity: 1 },
      });

      const startUpdatePolling = () => {
        if (state.updateTimer) window.clearInterval(state.updateTimer);
        state.updateTimer = window.setInterval(() => {
          void checkLayerUpdates(false);
        }, 2200);
      };

      const captureSelection = (reason = "manual") => {
        setBusy(true);
        state.layerStatuses.clear();
        state.canvasStale = false;
        state.previewImageCache.clear();
        state.previewFrame = 0;
        log(reason === "auto" ? "正在自动同步 Figma 选区..." : "正在从 Figma 选区导出 PNG 图层...");
        postPlugin("capture-selection", { options: currentCaptureOptions() });
      };

      const applyLayerUpdateStatus = (payload) => {
        if (!payload) return;
        state.canvasStale = Boolean(payload.canvas?.changed);
        state.layerStatuses = new Map(
          (payload.layers || []).map((layer) => [layer.key, layer]),
        );
        renderLayers();
      };

      const checkLayerUpdates = async (logErrors = true) => {
        if (!state.package?.project || state.busy) return;
        try {
          const response = await requestPlugin("check-layer-updates", {
            project: state.package.project,
          });
          applyLayerUpdateStatus(response.payload);
        } catch (error) {
          if (logErrors) log(`检查图层更新失败: ${error.message}`);
        }
      };

      const updateLayer = async (key) => {
        const asset = state.package?.project?.assets?.find((item) => item.key === key);
        if (!asset) return;
        try {
          setBusy(true);
          const response = await requestPlugin("update-layer", {
            project: state.package.project,
            asset,
            exportScale: Number($("exportScale").value || asset.source?.exportScale || 1),
          });
          const updated = response.payload;
          state.package.project.canvas = {
            width: updated.canvas.width,
            height: updated.canvas.height,
          };
          state.package.project.metadata = {
            ...(state.package.project.metadata || {}),
            sourceCanvasName:
              updated.canvas.sourceCanvasName ||
              state.package.project.metadata?.sourceCanvasName ||
              null,
            sourceCanvasAbsoluteBoundingBox: updated.canvas.absoluteBoundingBox,
            updatedAt: new Date().toISOString(),
          };
          state.package.project.assets = state.package.project.assets.map((item) =>
            item.key === key ? updated.asset : item,
          );
          state.package.assets = state.package.assets.map((item) =>
            item.key === key ? updated.payload : item,
          );
          state.layerStatuses.delete(key);
          state.canvasStale = false;
          state.selectedKey = key;
          renderLayers();
          log(`已更新图层: ${updated.asset.label || key}`);
          void checkLayerUpdates(false);
        } catch (error) {
          log(`更新图层失败: ${error.message}`);
        } finally {
          setBusy(false);
        }
      };

      const base64ToBytes = (base64) => {
        const clean = String(base64 || "").replace(/\s/g, "");
        const binary = atob(clean);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      };

      const bytesToBase64 = (bytes) => {
        let binary = "";
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
        }
        return btoa(binary);
      };

      const parseDataUrlBytes = (dataUrl) => {
        const match = String(dataUrl || "").match(/^data:([^;,]+);base64,(.+)$/);
        if (!match) throw new Error("图片数据格式无效。");
        return {
          mimeType: match[1],
          bytes: base64ToBytes(match[2]),
        };
      };

      const blobToDataUrl = (blob) =>
        new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(new Error("图片压缩失败。"));
          reader.readAsDataURL(blob);
        });

      const canvasToDataUrl = (canvas, mimeType = "image/png", quality) =>
        new Promise((resolve) => {
          if (!canvas.toBlob) {
            resolve(canvas.toDataURL(mimeType, quality));
            return;
          }
          canvas.toBlob(
            (blob) => {
              if (!blob) {
                resolve(canvas.toDataURL(mimeType, quality));
                return;
              }
              void blobToDataUrl(blob).then(resolve, () => resolve(canvas.toDataURL(mimeType, quality)));
            },
            mimeType,
            quality,
          );
        });

      const canvasHasAlpha = (ctx, width, height) => {
        try {
          const data = ctx.getImageData(0, 0, width, height).data;
          const pixelCount = width * height;
          const step = Math.max(1, Math.floor(pixelCount / 50000));
          for (let pixel = 0; pixel < pixelCount; pixel += step) {
            if (data[pixel * 4 + 3] < SVGA_ALPHA_THRESHOLD) return true;
          }
          return false;
        } catch (_error) {
          return true;
        }
      };

      const compressedRasterScale = (width, height) => {
        const maxEdge = Math.max(width, height);
        if (maxEdge <= 96) return 1;
        return Math.max(0.25, Math.min(1, SVGA_IMAGE_SCALE, SVGA_IMAGE_MAX_EDGE / maxEdge));
      };

      const optimizeImagePayloadForSvga = async (projectAsset, payload) => {
        if (!projectAsset || !payload?.dataUrl) return payload;
        try {
          const original = parseDataUrlBytes(payload.dataUrl);
          const image = await loadPreviewImage(payload);
          const sourceWidth = Math.max(1, Math.round(Number(image.naturalWidth || image.width || payload.width || 1)));
          const sourceHeight = Math.max(1, Math.round(Number(image.naturalHeight || image.height || payload.height || 1)));
          const scale = compressedRasterScale(sourceWidth, sourceHeight);
          const targetWidth = Math.max(1, Math.round(sourceWidth * scale));
          const targetHeight = Math.max(1, Math.round(sourceHeight * scale));
          if (targetWidth === sourceWidth && targetHeight === sourceHeight && original.mimeType === "image/jpeg") {
            return payload;
          }

          const canvas = document.createElement("canvas");
          canvas.width = targetWidth;
          canvas.height = targetHeight;
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          if (!ctx) return payload;
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.clearRect(0, 0, targetWidth, targetHeight);
          ctx.drawImage(image, 0, 0, targetWidth, targetHeight);

          const hasAlpha = canvasHasAlpha(ctx, targetWidth, targetHeight);
          const mimeType = hasAlpha ? "image/png" : "image/jpeg";
          const dataUrl = await canvasToDataUrl(
            canvas,
            mimeType,
            hasAlpha ? undefined : SVGA_JPEG_QUALITY,
          );
          const optimized = parseDataUrlBytes(dataUrl);
          if (optimized.bytes.length >= original.bytes.length) return payload;
          return {
            ...payload,
            mimeType,
            width: targetWidth,
            height: targetHeight,
            dataUrl,
          };
        } catch (_error) {
          return payload;
        }
      };

      const optimizeAssetPayloadsForSvga = async (project, assetPayloads) => {
        const projectAssetByKey = new Map((project.assets || []).map((asset) => [asset.key, asset]));
        return Promise.all(
          assetPayloads.map((payload) => {
            const projectAsset = projectAssetByKey.get(payload.key);
            if (!projectAsset || projectAsset.type !== "image") return payload;
            return optimizeImagePayloadForSvga(projectAsset, payload);
          }),
        );
      };

      const base64UrlToBytes = (value) => {
        const normalized = String(value || "").replace(/-/g, "+").replace(/_/g, "/");
        const padded = normalized.padEnd(Math.ceil(normalized.length / 4) * 4, "=");
        return base64ToBytes(padded);
      };

      const bytesToText = (bytes) => new TextDecoder().decode(bytes);

      const parseLicenseCode = (code) => {
        const compact = String(code || "").trim().replace(/\s+/g, "");
        const parts = compact.split(".");
        if (parts.length !== 3 || parts[0] !== "SVGA1") {
          throw new Error("授权码格式不正确。");
        }
        const payload = JSON.parse(bytesToText(base64UrlToBytes(parts[1])));
        return {
          signedText: `${parts[0]}.${parts[1]}`,
          payload,
          signature: base64UrlToBytes(parts[2]),
        };
      };

      const verifyLicenseCode = async (code) => {
        if (!crypto?.subtle) {
          throw new Error("当前 Figma 环境不支持授权验签。");
        }
        if (!LICENSE_PUBLIC_KEY_JWK.x || !LICENSE_PUBLIC_KEY_JWK.y) {
          throw new Error("插件尚未配置授权公钥。");
        }

        const parsed = parseLicenseCode(code);
        const key = await crypto.subtle.importKey(
          "jwk",
          LICENSE_PUBLIC_KEY_JWK,
          { name: "ECDSA", namedCurve: "P-256" },
          false,
          ["verify"],
        );
        const ok = await crypto.subtle.verify(
          { name: "ECDSA", hash: "SHA-256" },
          key,
          parsed.signature,
          new TextEncoder().encode(parsed.signedText),
        );
        if (!ok) throw new Error("授权码签名无效。");
        if (parsed.payload.product !== LICENSE_PRODUCT_ID) {
          throw new Error("授权码不适用于当前插件。");
        }
        if (
          parsed.payload.installationId &&
          state.license?.installationId &&
          parsed.payload.installationId !== state.license.installationId
        ) {
          throw new Error("授权码与当前授权识别码不匹配。");
        }
        if (parsed.payload.expiresAt && Date.parse(parsed.payload.expiresAt) <= Date.now()) {
          throw new Error("授权码已过期。");
        }
        return parsed.payload;
      };

      const renderLicenseState = (payload) => {
        state.license = payload || state.license;
        if (!state.license) return;
        const freeRemaining = Number(state.license.freeExportsRemaining || 0);
        const freeLimit = Number(state.license.freeExportLimit || 10);
        const storageSuffix = state.license.storageMode === "memory" ? "（临时）" : "";
        $("freeCount").textContent = `${freeRemaining} / ${freeLimit}`;
        $("installationId").textContent = state.license.installationId || "-";
        if (state.license.activated) {
          const label = state.license.license?.expiresAt
            ? `已激活 ${new Date(state.license.license.expiresAt).toLocaleDateString("zh-CN")}`
            : "已激活";
          $("activationState").textContent = label;
          $("licenseState").textContent = `可导出${storageSuffix}`;
        } else {
          $("activationState").textContent = "未激活";
          $("licenseState").textContent = `${freeRemaining > 0 ? "试用中" : "需授权"}${storageSuffix}`;
        }
        $("contactPanel").classList.toggle(
          "visible",
          !state.license.activated && freeRemaining <= 0,
        );
      };

      const refreshLicenseState = async () => {
        const response = await requestPlugin("license-get-state");
        renderLicenseState(response.payload);
      };

      const activateLicense = async () => {
        const code = $("licenseCode").value;
        const license = await verifyLicenseCode(code);
        const response = await requestPlugin("license-save", { license });
        if (!response.allowed) {
          throw new Error(response.message || "授权保存失败。");
        }
        renderLicenseState(response.payload);
        $("licenseCode").value = "";
        log("授权码已激活。");
      };

      const round = (value, digits = 4) => {
        const factor = 10 ** digits;
        return Math.round((Number(value) || 0) * factor) / factor;
      };

      const makeTransform = ({ x, y, imageWidth, imageHeight, displayWidth, displayHeight, rotation, extraScale, animX, animY }) => {
        const sx = (displayWidth / Math.max(1, imageWidth)) * extraScale;
        const sy = (displayHeight / Math.max(1, imageHeight)) * extraScale;
        const radians = rotation || 0;
        const cos = Math.cos(radians);
        const sin = Math.sin(radians);
        const a = cos * sx;
        const b = sin * sx;
        const c = -sin * sy;
        const d = cos * sy;
        const cx = imageWidth / 2;
        const cy = imageHeight / 2;
        const centerX = x + displayWidth / 2 + animX;
        const centerY = y + displayHeight / 2 + animY;
        return {
          a: round(a, 6),
          b: round(b, 6),
          c: round(c, 6),
          d: round(d, 6),
          tx: round(centerX - a * cx - c * cy, 2),
          ty: round(centerY - b * cx - d * cy, 2),
        };
      };

      const frameMotion = (asset, frameIndex, totalFrames, fps) => {
        const animation = asset.animation || {};
        const type = animation.type || "none";
        const speed = Number(animation.speed || 1);
        const intensity = Number(animation.intensity || 1);
        const progress = (frameIndex / Math.max(1, totalFrames)) * speed;
        const wave = Math.sin(progress * Math.PI * 2);
        let animX = 0;
        let animY = 0;
        let extraScale = 1;
        let rotation = ((Number(asset.transform?.rotate || 0) || 0) * Math.PI) / 180;

        if (type === "float") animY = wave * 20 * intensity;
        if (type === "swing") rotation += wave * ((15 * intensity * Math.PI) / 180);
        if (type === "pulse") extraScale = 1 + wave * 0.1 * intensity;
        if (type === "spin") rotation += progress * Math.PI * 2;

        return { animX, animY, extraScale, rotation, fps };
      };

      const encodeLayout = (writer, layout) => {
        writer.float32(1, layout.x);
        writer.float32(2, layout.y);
        writer.float32(3, layout.width);
        writer.float32(4, layout.height);
      };

      const encodeTransform = (writer, transform) => {
        writer.float32(1, transform.a);
        writer.float32(2, transform.b);
        writer.float32(3, transform.c);
        writer.float32(4, transform.d);
        writer.float32(5, transform.tx);
        writer.float32(6, transform.ty);
      };

      const encodeFrame = (writer, frame) => {
        writer.float32(1, frame.alpha);
        writer.message(2, (layoutWriter) => encodeLayout(layoutWriter, frame.layout));
        writer.message(3, (transformWriter) => encodeTransform(transformWriter, frame.transform));
      };

      const encodeSprite = (writer, sprite) => {
        writer.string(1, sprite.imageKey);
        for (const frame of sprite.frames) {
          writer.message(2, (frameWriter) => encodeFrame(frameWriter, frame));
        }
      };

      const sweepTextureSize = (targetGeometry) => {
        const displayWidth = Math.max(1, Math.round(targetGeometry.displayWidth));
        const displayHeight = Math.max(1, Math.round(targetGeometry.displayHeight));
        const maxEdge = Math.max(displayWidth, displayHeight);
        const scale = Math.max(
          0.18,
          Math.min(1, SVGA_SWEEP_TEXTURE_SCALE, SVGA_SWEEP_TEXTURE_MAX_EDGE / maxEdge),
        );
        return {
          width: Math.max(1, Math.round(displayWidth * scale)),
          height: Math.max(1, Math.round(displayHeight * scale)),
        };
      };

      const makeSweepMaskedPayload = ({ effect, image, targetGeometry, textureIndex, textureCount }) => {
        const { width, height } = sweepTextureSize(targetGeometry);
        const progress = sweepProgress(effect, textureIndex, textureCount);
        const canvas = makeSweepMaskCanvas({
          image,
          effect,
          progress,
          width,
          height,
        });
        return {
          key: `${effect.id || effect.sweepTarget}_masked_${String(textureIndex).padStart(3, "0")}`,
          dataUrl: canvas.toDataURL("image/png"),
          width,
          height,
        };
      };

      const buildSweepMaskedPayloads = async (project, payloadByKey, frameCount) => {
        const sweeps = [];
        for (const effect of activeSweepEffects(project)) {
          const target = (project.assets || []).find((asset) => asset.key === effect.sweepTarget);
          const targetPayload = target ? payloadByKey.get(target.key) : null;
          if (!target || !targetPayload?.dataUrl) continue;
          try {
            const targetImage = await loadPreviewImage(targetPayload);
            const targetGeometry = assetRenderGeometry(target);
            const textureCount = Math.max(1, Math.min(frameCount, SVGA_SWEEP_TEXTURE_STEPS));
            for (let textureIndex = 0; textureIndex < textureCount; textureIndex += 1) {
              sweeps.push({
                effect,
                target,
                targetGeometry,
                textureIndex,
                textureCount,
                payload: makeSweepMaskedPayload({
                  effect,
                  image: targetImage,
                  targetGeometry,
                  textureIndex,
                  textureCount,
                }),
              });
            }
          } catch (_error) {
            // If the target image cannot be decoded, skip the sweep instead of corrupting the export.
          }
        }
        return sweeps;
      };

      const buildParticlePayloads = (project) =>
        activeParticleAssets(project).map((asset) => {
          const canvas = makeParticleTextureCanvas(asset.effectConfig);
          return {
            asset,
            key: asset.key,
            dataUrl: canvas.toDataURL("image/png"),
            width: canvas.width,
            height: canvas.height,
            count: particleCountForEffect(asset.effectConfig),
          };
        });

      const encodeMovie = async (project, assetPayloads) => {
        const fps = Math.max(1, Math.min(60, Math.round(Number(project.exportRules?.fps || 24))));
        const frameCount = Math.max(1, Math.min(600, Math.round(Number(project.exportRules?.frames || 72))));
        const canvasWidth = Math.max(1, Math.round(Number(project.canvas?.width || 300)));
        const canvasHeight = Math.max(1, Math.round(Number(project.canvas?.height || 300)));
        const payloadByKey = new Map(assetPayloads.map((asset) => [String(asset.key), asset]));
        const sweepPayloads = await buildSweepMaskedPayloads(project, payloadByKey, frameCount);
        const particlePayloads = buildParticlePayloads(project);
        const writer = new ProtoWriter();

        writer.string(1, "2.0");
        writer.message(2, (params) => {
          params.float32(1, canvasWidth);
          params.float32(2, canvasHeight);
          params.uint32(3, fps);
          params.uint32(4, frameCount);
        });

        for (const projectAsset of project.assets || []) {
          const payload = payloadByKey.get(projectAsset.key);
          if (!payload?.dataUrl) continue;
          const image = parseDataUrlBytes(payload.dataUrl);
          writer.message(3, (entry) => {
            entry.string(1, projectAsset.key);
            entry.rawBytes(2, image.bytes);
          });
        }

        for (const sweep of sweepPayloads) {
          const image = parseDataUrlBytes(sweep.payload.dataUrl);
          writer.message(3, (entry) => {
            entry.string(1, sweep.payload.key);
            entry.rawBytes(2, image.bytes);
          });
        }

        for (const particle of particlePayloads) {
          const image = parseDataUrlBytes(particle.dataUrl);
          writer.message(3, (entry) => {
            entry.string(1, particle.key);
            entry.rawBytes(2, image.bytes);
          });
        }

        for (const projectAsset of project.assets || []) {
          const payload = payloadByKey.get(projectAsset.key);
          if (!payload?.dataUrl) continue;
          const geometry = assetRenderGeometry(projectAsset, payload);
          const imageWidth = geometry.imageWidth;
          const imageHeight = geometry.imageHeight;
          const displayWidth = geometry.displayWidth;
          const displayHeight = geometry.displayHeight;
          const x = geometry.x;
          const y = geometry.y;
          const frames = [];

          for (let index = 0; index < frameCount; index += 1) {
            const motion = frameMotion(projectAsset, index, frameCount, fps);
            frames.push({
              alpha: projectAsset.visible === false ? 0 : 1,
              layout: { x: 0, y: 0, width: imageWidth, height: imageHeight },
              transform: makeTransform({
                x,
                y,
                imageWidth,
                imageHeight,
                displayWidth,
                displayHeight,
                rotation: motion.rotation,
                extraScale: motion.extraScale,
                animX: motion.animX,
                animY: motion.animY,
              }),
            });
          }

          writer.message(4, (spriteWriter) =>
            encodeSprite(spriteWriter, {
              imageKey: projectAsset.key,
              frames,
            }),
          );
        }

        for (const sweep of sweepPayloads) {
          const frames = [];
          for (let index = 0; index < frameCount; index += 1) {
            const progress = sweepProgress(sweep.effect, index, frameCount);
            const fade = sweep.effect.sweepFadeEnabled ? Math.sin(progress * Math.PI) : 1;
            const textureIndex = Math.min(
              sweep.textureCount - 1,
              Math.floor((index / Math.max(1, frameCount)) * sweep.textureCount),
            );
            const opacity = textureIndex === sweep.textureIndex
              ? clamp(Number(sweep.effect.sweepOpacity == null ? 1 : sweep.effect.sweepOpacity) * fade, 0, 1)
              : 0;
            const motion = frameMotion(sweep.target, index, frameCount, fps);
            frames.push({
              alpha: sweep.target.visible === false ? 0 : opacity,
              layout: { x: 0, y: 0, width: sweep.payload.width, height: sweep.payload.height },
              transform: makeTransform({
                x: sweep.targetGeometry.x,
                y: sweep.targetGeometry.y,
                imageWidth: sweep.payload.width,
                imageHeight: sweep.payload.height,
                displayWidth: sweep.targetGeometry.displayWidth,
                displayHeight: sweep.targetGeometry.displayHeight,
                rotation: motion.rotation,
                extraScale: motion.extraScale,
                animX: motion.animX,
                animY: motion.animY,
              }),
            });
          }
          writer.message(4, (spriteWriter) =>
            encodeSprite(spriteWriter, {
              imageKey: sweep.payload.key,
              frames,
            }),
          );
        }

        for (const particle of particlePayloads) {
          for (let particleIndex = 0; particleIndex < particle.count; particleIndex += 1) {
            const frames = [];
            for (let frameIndex = 0; frameIndex < frameCount; frameIndex += 1) {
              const sample = sampleParticle(particle.asset, particleIndex, frameIndex, frameCount);
              frames.push({
                alpha: particle.asset.visible === false ? 0 : sample.alpha,
                layout: { x: 0, y: 0, width: particle.width, height: particle.height },
                transform: makeTransform({
                  x: sample.x - particle.width / 2,
                  y: sample.y - particle.height / 2,
                  imageWidth: particle.width,
                  imageHeight: particle.height,
                  displayWidth: particle.width,
                  displayHeight: particle.height,
                  rotation: sample.rotation,
                  extraScale: sample.scale,
                  animX: 0,
                  animY: 0,
                }),
              });
            }
            writer.message(4, (spriteWriter) =>
              encodeSprite(spriteWriter, {
                imageKey: particle.key,
                frames,
              }),
            );
          }
        }

        return writer.finish();
      };

      const adler32 = (bytes) => {
        const mod = 65521;
        let a = 1;
        let b = 0;
        for (const byte of bytes) {
          a = (a + byte) % mod;
          b = (b + a) % mod;
        }
        return ((b << 16) | a) >>> 0;
      };

      const zlibStore = (bytes) => {
        const blockCount = Math.max(1, Math.ceil(bytes.length / 65535));
        const output = new Uint8Array(2 + bytes.length + blockCount * 5 + 4);
        let offset = 0;
        output[offset++] = 0x78;
        output[offset++] = 0x01;

        for (let start = 0; start < bytes.length || (bytes.length === 0 && start === 0); start += 65535) {
          const end = Math.min(bytes.length, start + 65535);
          const length = end - start;
          const finalBlock = end >= bytes.length;
          output[offset++] = finalBlock ? 0x01 : 0x00;
          output[offset++] = length & 255;
          output[offset++] = (length >> 8) & 255;
          const nlen = (~length) & 65535;
          output[offset++] = nlen & 255;
          output[offset++] = (nlen >> 8) & 255;
          output.set(bytes.subarray(start, end), offset);
          offset += length;
          if (bytes.length === 0) break;
        }

        const checksum = adler32(bytes);
        output[offset++] = (checksum >>> 24) & 255;
        output[offset++] = (checksum >>> 16) & 255;
        output[offset++] = (checksum >>> 8) & 255;
        output[offset++] = checksum & 255;
        return output.subarray(0, offset);
      };

      const zlibDeflate = async (bytes) => {
        if (typeof CompressionStream === "function") {
          try {
            const stream = new Blob([bytes])
              .stream()
              .pipeThrough(new CompressionStream("deflate"));
            return new Uint8Array(await new Response(stream).arrayBuffer());
          } catch (_error) {
            // Fall back to a valid zlib stream without compression in older plugin runtimes.
          }
        }
        return zlibStore(bytes);
      };

      const downloadBytes = (filename, mimeType, bytes) => {
        const blob = new Blob([bytes], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      };

      const downloadText = (filename, text, type = "application/json") => {
        downloadBytes(filename, type, new TextEncoder().encode(text));
      };

      const safeFilename = (value) =>
        String(value || "figma-selection")
          .trim()
          .replace(/[\\/:*?"<>|]+/g, "_")
          .replace(/\s+/g, "_")
          .slice(0, 80) || "figma-selection";

      const exportSvga = async () => {
        if (!state.package) throw new Error("请先导入 Figma 选区。");
        state.package.project.materialType = $("materialType").value || "figma_selection";
        state.package.project.exportRules = {
          fps: Number($("fps").value || 24),
          frames: Number($("frames").value || 72),
        };
        const optimizedAssets = await optimizeAssetPayloadsForSvga(
          state.package.project,
          state.package.assets,
        );
        const movieBytes = await encodeMovie(state.package.project, optimizedAssets);
        const svgaBytes = await zlibDeflate(movieBytes);
        const filename = `${safeFilename(state.package.project.materialType)}.svga`;
        downloadBytes(filename, "application/octet-stream", svgaBytes);
        return { filename, bytes: svgaBytes.length, movieBytes: movieBytes.length };
      };

      const requestWindowResize = (width, height) => {
        const next = {
          width: Math.max(760, Math.min(1600, Math.round(width))),
          height: Math.max(560, Math.min(1100, Math.round(height))),
        };
        state.windowSize = next;
        state.pendingResize = next;
        if (state.resizeRaf) return;
        state.resizeRaf = window.requestAnimationFrame(() => {
          state.resizeRaf = null;
          if (!state.pendingResize) return;
          postPlugin("resize", state.pendingResize);
          state.pendingResize = null;
        });
      };

      window.addEventListener("resize", () => {
        state.windowSize = {
          width: window.innerWidth || state.windowSize.width,
          height: window.innerHeight || state.windowSize.height,
        };
      });

      $("resizeHandle").addEventListener("pointerdown", (event) => {
        event.preventDefault();
        state.resizeDrag = {
          startX: event.clientX,
          startY: event.clientY,
          width: window.innerWidth || state.windowSize.width,
          height: window.innerHeight || state.windowSize.height,
        };
      });

      window.addEventListener("pointermove", (event) => {
        if (!state.resizeDrag) return;
        const nextWidth = state.resizeDrag.width + event.clientX - state.resizeDrag.startX;
        const nextHeight = state.resizeDrag.height + event.clientY - state.resizeDrag.startY;
        requestWindowResize(nextWidth, nextHeight);
      });

      window.addEventListener("pointerup", () => {
        state.resizeDrag = null;
      });

      $("windowShrinkBtn").addEventListener("click", () => {
        requestWindowResize((window.innerWidth || state.windowSize.width) - 120, (window.innerHeight || state.windowSize.height) - 80);
      });

      $("windowGrowBtn").addEventListener("click", () => {
        requestWindowResize((window.innerWidth || state.windowSize.width) + 120, (window.innerHeight || state.windowSize.height) + 80);
      });

      $("canvasZoomOutBtn").addEventListener("click", () => {
        setCanvasZoom(state.canvasZoom - 0.1);
      });

      $("canvasZoomInBtn").addEventListener("click", () => {
        setCanvasZoom(state.canvasZoom + 0.1);
      });

      $("canvasZoomResetBtn").addEventListener("click", () => {
        setCanvasZoom(1);
      });

      for (const swatch of document.querySelectorAll(".swatch")) {
        swatch.addEventListener("click", () => {
          state.canvasBg = swatch.dataset.bg || "checkered";
          updateCanvasBackground();
        });
      }

      $("playPreviewBtn").addEventListener("click", togglePreviewPlayback);

      const setLicensePopoverOpen = (open) => {
        $("licensePopover").hidden = !open;
        $("licenseToggleBtn").setAttribute("aria-expanded", open ? "true" : "false");
      };

      $("licenseToggleBtn").addEventListener("click", (event) => {
        event.stopPropagation();
        setLicensePopoverOpen($("licensePopover").hidden);
      });

      $("licenseCloseBtn").addEventListener("click", (event) => {
        event.stopPropagation();
        setLicensePopoverOpen(false);
      });

      document.addEventListener("click", (event) => {
        if (event.target.closest(".license-menu")) return;
        setLicensePopoverOpen(false);
      });

      $("canvasFrame").addEventListener("pointerdown", (event) => {
        if (!state.package?.project) return;
        if (event.target.closest("[data-drag-mode]")) return;
        const point = canvasPointFromEvent(event);
        if (!point) return;
        const asset = hitTestAsset(point);
        if (!asset) {
          state.selectedKey = null;
          syncControlsFromSelected();
          renderLayers();
          return;
        }
        state.selectedKey = asset.key;
        syncControlsFromSelected();
        renderLayers();
        beginCanvasDrag(event, "translate");
      });

      for (const handle of document.querySelectorAll("[data-drag-mode]")) {
        handle.addEventListener("pointerdown", (event) => {
          beginCanvasDrag(event, handle.dataset.dragMode || "translate");
        });
      }

      window.addEventListener("pointermove", moveCanvasDrag);
      window.addEventListener("pointerup", endCanvasDrag);
      window.addEventListener("pointercancel", endCanvasDrag);

      for (const button of document.querySelectorAll("[data-align]")) {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          alignSelectedAsset(button.dataset.align);
        });
      }

      $("scanBtn").addEventListener("click", () => {
        postPlugin("scan-selection");
        void checkLayerUpdates(true);
      });
      $("captureBtn").addEventListener("click", () => {
        captureSelection("manual");
      });
      $("downloadJsonBtn").addEventListener("click", () => {
        if (!state.package) return;
        state.package.project.materialType = $("materialType").value || "figma_selection";
        state.package.project.exportRules = {
          fps: Number($("fps").value || 24),
          frames: Number($("frames").value || 72),
        };
        downloadText("figma-svga-project.json", JSON.stringify(state.package, null, 2));
      });
      $("exportSvgaBtn").addEventListener("click", () => {
        void (async () => {
          try {
            setBusy(true);
            const access = await requestPlugin("license-request-export");
            renderLicenseState(access.payload);
            if (!access.allowed) {
              log("免费导出次数已用完，请扫码联系获取授权码。");
              return;
            }
            const result = await exportSvga();
            const remaining = access.payload?.activated
              ? "授权导出"
              : `剩余免费 ${access.payload?.freeExportsRemaining ?? 0} 次`;
            log(`已导出 ${result.filename} (${Math.round(result.bytes / 1024)} KB)，${remaining}。`);
          } catch (error) {
            log(`导出失败: ${error.message}`);
          } finally {
            setBusy(false);
          }
        })();
      });
      $("activateLicenseBtn").addEventListener("click", () => {
        void (async () => {
          try {
            setBusy(true);
            await activateLicense();
          } catch (error) {
            log(`激活失败: ${error.message}`);
          } finally {
            setBusy(false);
          }
        })();
      });
      $("copyInstallIdBtn").addEventListener("click", () => {
        const value = $("installationId").textContent.trim();
        if (!value || value === "-") return;
        void navigator.clipboard?.writeText(value).then(
          () => log("授权识别码已复制。"),
          () => log("复制失败，请手动复制授权识别码。"),
        );
      });

      $("resetTransformBtn").addEventListener("click", () => {
        resetSelectedTransform();
      });

      const transformInputMap = {
        transformX: "x",
        transformY: "y",
        transformScale: "scale",
        transformRotate: "rotate",
      };
      for (const id of Object.keys(transformInputMap)) {
        $(id).addEventListener("input", () => {
          const key = transformInputMap[id];
          updateSelectedAssetTransform({ [key]: Number($(id).value) }, "preview");
        });
      }

      for (const button of document.querySelectorAll("[data-motion]")) {
        button.addEventListener("click", () => {
          if (button.disabled) return;
          $("animationType").value = button.dataset.motion || "none";
          syncSelectedFromControls();
        });
      }

      for (const id of ["animationType", "speed", "intensity"]) {
        $(id).addEventListener("input", syncSelectedFromControls);
      }
      for (const id of ["fps", "frames"]) {
        $(id).addEventListener("input", () => {
          if (state.package?.project) {
            state.package.project.exportRules = {
              fps: Number($("fps").value || 24),
              frames: Number($("frames").value || 72),
            };
            state.previewFrame = Math.min(state.previewFrame, projectFrameCount() - 1);
            renderPreview(state.previewFrame);
          }
        });
      }
      $("speed").addEventListener("input", () => {
        $("speedValue").textContent = Number($("speed").value).toFixed(1);
      });
      $("intensity").addEventListener("input", () => {
        $("intensityValue").textContent = Number($("intensity").value).toFixed(1);
      });

      $("addSweepBtn").addEventListener("click", addSweepToSelected);
      $("removeSweepBtn").addEventListener("click", removeSweepFromSelected);
      for (const id of ["sweepShape", "sweepSpeed", "sweepWidth", "sweepFeather", "sweepAngle", "sweepOpacity"]) {
        $(id).addEventListener("input", syncSweepFromControls);
      }
      $("sweepColor").addEventListener("input", () => {
        $("sweepColorPreview").value = $("sweepColor").value;
        syncSweepFromControls();
      });
      $("sweepColorPreview").addEventListener("input", () => {
        $("sweepColor").value = $("sweepColorPreview").value;
        syncSweepFromControls();
      });
      $("sweepBlendBtn").addEventListener("click", () => {
        const effect = selectedSweepEffect();
        if (!effect) return;
        effect.sweepBlendMode = effect.sweepBlendMode === "screen" ? "normal" : "screen";
        syncSweepControlsFromSelected();
        renderPreview(state.previewFrame);
      });
      $("sweepFadeBtn").addEventListener("click", () => {
        const effect = selectedSweepEffect();
        if (!effect) return;
        effect.sweepFadeEnabled = !effect.sweepFadeEnabled;
        syncSweepControlsFromSelected();
        renderPreview(state.previewFrame);
      });

      $("addParticleBtn").addEventListener("click", addParticleLayer);
      $("removeParticleBtn").addEventListener("click", removeSelectedParticleLayer);
      for (const id of [
        "particleSystemType",
        "particleShape",
        "particleCount",
        "particleSize",
        "particleSpeed",
        "particleRandomness",
        "particleLifeSpan",
        "particleDecay",
        "particleColorMode",
        "emissionOriginX",
        "emissionOriginY",
        "emissionAngle",
        "emissionSpread",
      ]) {
        $(id).addEventListener("input", syncParticleFromControls);
      }
      $("particleColor").addEventListener("input", () => {
        $("particleColorPreview").value = $("particleColor").value;
        syncParticleFromControls();
      });
      $("particleColorPreview").addEventListener("input", () => {
        $("particleColor").value = $("particleColorPreview").value;
        syncParticleFromControls();
      });
      $("particleSecondaryColor").addEventListener("input", () => {
        $("particleSecondaryColorPreview").value = $("particleSecondaryColor").value;
        syncParticleFromControls();
      });
      $("particleSecondaryColorPreview").addEventListener("input", () => {
        $("particleSecondaryColor").value = $("particleSecondaryColorPreview").value;
        syncParticleFromControls();
      });

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (resolvePluginRequest(message)) return;

        if (message.type === "license-state") {
          renderLicenseState(message.payload);
        }

        if (message.type === "figma-document-changed") {
          const changedIds = new Set(message.nodeIds || []);
          let touched = false;
          for (const asset of state.package?.project?.assets || []) {
            if (changedIds.has(asset.source?.figmaNodeId)) {
              state.layerStatuses.set(asset.key, {
                key: asset.key,
                changed: true,
                status: "changed",
                message: "Figma 图层已调整",
              });
              touched = true;
            }
          }
          if (touched) renderLayers();
        }

        if (message.type === "selection-summary") {
          state.selection = message.payload;
          renderSelection();
          if (!state.autoCaptured && !state.package && Number(message.payload?.count || 0) > 0) {
            state.autoCaptured = true;
            window.setTimeout(() => captureSelection("auto"), 80);
          }
        }

        if (message.type === "capture-started") {
          setBusy(true);
        }

        if (message.type === "capture-complete") {
          stopPreviewPlayback();
          state.package = message.payload;
          ensureProjectEffects();
          state.selectedKey = state.package.project.assets[0]?.key || null;
          state.layerStatuses.clear();
          state.canvasStale = false;
          state.previewImageCache.clear();
          state.previewFrame = 0;
          $("fps").value = String(state.package.project.exportRules.fps || 24);
          $("frames").value = String(state.package.project.exportRules.frames || 72);
          renderLayers();
          setBusy(false);
          startUpdatePolling();
          log(`已同步 ${state.package.summary.layerCount} 个图层。`);
        }

        if (message.type === "plugin-error") {
          setBusy(false);
          log(`插件错误: ${message.message}`);
        }
      };

      if (CONTACT_QR_DATA_URL.startsWith("data:image/")) {
        $("contactQr").src = CONTACT_QR_DATA_URL;
      }
      void refreshLicenseState().catch((error) => {
        log(`授权状态读取失败: ${error.message}`);
      });
      postPlugin("scan-selection");
    </script>
  </body>
</html>
