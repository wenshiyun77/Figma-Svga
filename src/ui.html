<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVGA Editor</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--figma-color-bg, #f7f7f8);
        --panel: var(--figma-color-bg-secondary, #ffffff);
        --text: var(--figma-color-text, #171717);
        --muted: var(--figma-color-text-secondary, #686868);
        --border: var(--figma-color-border, #dddddf);
        --accent: var(--figma-color-bg-brand, #1677ff);
        --accent-text: var(--figma-color-text-onbrand, #ffffff);
        --ok: #079455;
        --danger: #d92d20;
        --warning-bg: #fff7e6;
        --warning-border: #ffd591;
        --shadow: rgba(0, 0, 0, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 360px;
        color: var(--text);
        background: var(--bg);
        font: 12px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        height: 32px;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        background: var(--panel);
        padding: 0 10px;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button.primary {
        border-color: var(--accent);
        color: var(--accent-text);
        background: var(--accent);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      input,
      select {
        width: 100%;
        height: 30px;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        background: var(--panel);
        padding: 0 8px;
      }

      input[type="range"] {
        padding: 0;
      }

      .app {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 14px 10px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }

      .title {
        display: grid;
        gap: 2px;
      }

      .title strong {
        font-size: 14px;
        line-height: 1.2;
      }

      .ready {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        white-space: nowrap;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
      }

      .content {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .band {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 1px 2px var(--shadow);
      }

      .band-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 10px 6px;
      }

      .band-title {
        font-weight: 650;
      }

      .band-body {
        display: grid;
        gap: 8px;
        padding: 0 10px 10px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .field {
        display: grid;
        gap: 4px;
      }

      .field label {
        color: var(--muted);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .selection {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        color: var(--muted);
      }

      .license-summary {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        color: var(--muted);
      }

      .metric {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px;
        background: var(--bg);
      }

      .metric strong {
        display: block;
        color: var(--text);
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .layers {
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      .layer-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
        align-items: center;
        min-height: 34px;
        padding: 7px 8px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }

      .layer-row.stale {
        background: color-mix(in srgb, var(--warning-bg) 74%, transparent);
      }

      .layer-row:last-child {
        border-bottom: 0;
      }

      .layer-row.selected {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }

      .layer-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .layer-meta {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .layer-update-btn {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 8px;
      }

      .layer-row.stale .layer-update-btn {
        border-color: var(--accent);
        color: var(--accent-text);
        background: var(--accent);
      }

      .preview-viewport {
        overflow: auto;
        max-height: 320px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background:
          linear-gradient(45deg, color-mix(in srgb, var(--border) 42%, transparent) 25%, transparent 25%),
          linear-gradient(-45deg, color-mix(in srgb, var(--border) 42%, transparent) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, color-mix(in srgb, var(--border) 42%, transparent) 75%),
          linear-gradient(-45deg, transparent 75%, color-mix(in srgb, var(--border) 42%, transparent) 75%);
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        background-size: 16px 16px;
      }

      .preview-canvas {
        position: relative;
        min-width: 1px;
        min-height: 1px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: inset 0 0 0 1px var(--border);
      }

      .preview-layer {
        position: absolute;
        display: block;
        object-fit: fill;
        pointer-events: none;
      }

      .preview-layer.selected {
        outline: 2px solid var(--accent);
        outline-offset: 0;
      }

      .log {
        max-height: 92px;
        overflow: auto;
        white-space: pre-wrap;
        color: var(--muted);
      }

      .empty {
        color: var(--muted);
        padding: 10px;
        text-align: center;
      }

      .contact-panel {
        display: none;
        grid-template-columns: 96px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        border: 1px solid var(--warning-border);
        border-radius: 8px;
        padding: 8px;
        color: #6b3d00;
        background: var(--warning-bg);
      }

      .contact-panel.visible {
        display: grid;
      }

      .contact-panel img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        border-radius: 6px;
        background: #fff;
      }

      .contact-copy {
        display: grid;
        gap: 5px;
        min-width: 0;
      }

      .contact-copy strong {
        color: #4f2d00;
      }

      .code-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px;
        align-items: center;
      }

      .install-id {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
        color: var(--text);
        background: var(--bg);
        font-variant-numeric: tabular-nums;
      }

      textarea {
        min-height: 74px;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        background: var(--panel);
        padding: 8px;
        font: inherit;
      }

      .danger-text {
        color: var(--danger);
      }

      :root {
        color-scheme: dark;
        --bg: #030303;
        --panel: rgba(8, 8, 9, 0.92);
        --panel-2: rgba(16, 16, 18, 0.9);
        --panel-3: rgba(24, 24, 27, 0.88);
        --text: rgba(255, 255, 255, 0.94);
        --muted: rgba(255, 255, 255, 0.52);
        --soft: rgba(255, 255, 255, 0.32);
        --border: rgba(255, 255, 255, 0.09);
        --accent: #6366f1;
        --accent-2: #8b5cf6;
        --accent-text: #ffffff;
        --ok: #22c55e;
        --danger: #ef4444;
        --warning-bg: rgba(245, 158, 11, 0.12);
        --warning-border: rgba(245, 158, 11, 0.28);
        --shadow: rgba(0, 0, 0, 0.46);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        min-width: 760px;
        color: var(--text);
        background: var(--bg);
        font: 12px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button {
        height: 32px;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: rgba(255, 255, 255, 0.72);
        background: rgba(255, 255, 255, 0.055);
        transition:
          background 140ms ease,
          border-color 140ms ease,
          color 140ms ease,
          transform 140ms ease;
      }

      button:hover {
        border-color: rgba(255, 255, 255, 0.16);
        color: #ffffff;
        background: rgba(255, 255, 255, 0.09);
      }

      button:active {
        transform: translateY(1px);
      }

      button.primary {
        border-color: rgba(255, 255, 255, 0.9);
        color: #050505;
        background: #ffffff;
        font-weight: 800;
      }

      input,
      select,
      textarea {
        border-color: var(--border);
        color: var(--text);
        background: rgba(255, 255, 255, 0.06);
      }

      textarea {
        resize: none;
      }

      .editor-shell {
        position: relative;
        height: 100vh;
        min-height: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 0%, rgba(99, 102, 241, 0.13), transparent 30%),
          radial-gradient(circle at 88% 8%, rgba(139, 92, 246, 0.1), transparent 28%),
          #030303;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        height: 72px;
        padding: 14px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(0, 0, 0, 0.52);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        display: grid;
        width: 42px;
        height: 42px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 14px;
        color: #ffffff;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        box-shadow: 0 0 24px rgba(99, 102, 241, 0.32);
        font-weight: 950;
        font-style: italic;
      }

      .brand-copy {
        min-width: 0;
      }

      .brand-title {
        margin: 0;
        font-size: 18px;
        font-weight: 950;
        font-style: italic;
        letter-spacing: 0;
        line-height: 1;
        text-transform: uppercase;
      }

      .brand-subtitle {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex: 0 0 auto;
        min-width: 0;
      }

      .license-menu {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        min-width: 210px;
        justify-content: flex-end;
      }

      .license-compact {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        width: min(300px, 100%);
        height: 44px;
        padding: 6px 10px;
        border-radius: 14px;
        text-align: left;
        background: rgba(255, 255, 255, 0.045);
      }

      .license-compact span {
        display: block;
        min-width: 0;
        overflow: hidden;
        color: rgba(255, 255, 255, 0.38);
        font-size: 9px;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .license-compact strong {
        display: block;
        min-width: 0;
        overflow: hidden;
        color: rgba(255, 255, 255, 0.92);
        font-size: 12px;
        font-weight: 900;
        line-height: 1.3;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .license-state-hidden {
        display: none;
      }

      .license-popover {
        position: absolute;
        top: calc(100% + 12px);
        right: 0;
        z-index: 20;
        display: grid;
        width: 380px;
        max-width: calc(100vw - 36px);
        gap: 12px;
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 18px;
        padding: 14px;
        background: rgba(8, 8, 9, 0.98);
        box-shadow: 0 26px 80px rgba(0, 0, 0, 0.52);
      }

      .license-popover[hidden] {
        display: none;
      }

      .license-popover-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .license-popover-title strong {
        color: rgba(255, 255, 255, 0.9);
        font-size: 13px;
        font-weight: 900;
      }

      .tool-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 0;
        height: 38px;
        padding: 0 13px;
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .tool-button.icon-only {
        width: 38px;
        padding: 0;
        font-size: 14px;
        letter-spacing: 0;
      }

      .editor-layout {
        display: grid;
        grid-template-columns: 300px minmax(360px, 1fr) 300px;
        height: calc(100vh - 72px);
        min-height: 0;
        overflow: hidden;
      }

      .sidebar {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex-direction: column;
        background: rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(16px);
      }

      .left-sidebar {
        border-right: 1px solid rgba(255, 255, 255, 0.08);
      }

      .right-sidebar {
        border-left: 1px solid rgba(255, 255, 255, 0.08);
      }

      .sidebar-section {
        display: grid;
        gap: 10px;
        padding: 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-width: 0;
      }

      .section-title-main {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        color: rgba(255, 255, 255, 0.46);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .section-title-main strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .section-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        height: 20px;
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.66);
        background: rgba(255, 255, 255, 0.09);
        font-size: 9px;
        font-weight: 850;
      }

      .selection {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .metric {
        border-color: rgba(255, 255, 255, 0.075);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.045);
      }

      .metric span {
        display: block;
        color: rgba(255, 255, 255, 0.4);
        font-size: 10px;
        font-weight: 750;
      }

      .metric strong {
        margin-top: 3px;
        color: #ffffff;
      }

      .layers {
        flex: 1;
        max-height: none;
        min-height: 0;
        overflow: auto;
        border: 0;
        border-radius: 0;
        padding: 8px;
        background: transparent;
      }

      .layer-row {
        grid-template-columns: 26px minmax(0, 1fr) auto;
        gap: 8px;
        min-height: 50px;
        margin-bottom: 7px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.045);
      }

      .layer-row:last-child {
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .layer-row:hover {
        border-color: rgba(99, 102, 241, 0.28);
        background: rgba(255, 255, 255, 0.07);
      }

      .layer-row.selected {
        border-color: rgba(99, 102, 241, 0.58);
        background: rgba(99, 102, 241, 0.14);
      }

      .layer-row.stale {
        border-color: rgba(245, 158, 11, 0.45);
        background: rgba(245, 158, 11, 0.12);
      }

      .layer-thumb {
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 8px;
        color: rgba(129, 140, 248, 0.92);
        background: rgba(99, 102, 241, 0.12);
        font-size: 13px;
        font-weight: 900;
      }

      .layer-copy {
        display: grid;
        min-width: 0;
        gap: 4px;
      }

      .layer-name {
        color: rgba(255, 255, 255, 0.88);
        font-size: 12px;
        font-weight: 760;
      }

      .layer-meta {
        color: rgba(255, 255, 255, 0.42);
        font-size: 10px;
      }

      .layer-update-btn {
        height: 26px;
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.58);
        background: rgba(255, 255, 255, 0.055);
        font-size: 10px;
        font-weight: 800;
      }

      .stage {
        position: relative;
        display: flex;
        min-width: 0;
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
        background: #09090b;
      }

      .stage-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        height: 46px;
        padding: 0 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(0, 0, 0, 0.22);
      }

      .stage-meta {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 2px;
      }

      .stage-meta strong {
        overflow: hidden;
        color: rgba(255, 255, 255, 0.78);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stage-zoom {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
      }

      .zoom-value {
        min-width: 48px;
        color: rgba(255, 255, 255, 0.58);
        font-size: 10px;
        font-weight: 800;
        text-align: center;
      }

      .stage-viewport {
        position: relative;
        display: flex;
        flex: 1;
        min-width: 0;
        min-height: 0;
        align-items: center;
        justify-content: center;
        overflow: auto;
        padding: 30px;
      }

      .stage-viewport::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.04;
        background-image: radial-gradient(#ffffff 1px, transparent 1px);
        background-size: 20px 20px;
      }

      .canvas-frame {
        position: relative;
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        max-width: none;
        max-height: none;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        background: #030303;
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      .canvas-frame.bg-white {
        background: #ffffff;
      }

      .canvas-frame.bg-checkered {
        background-color: #f0f0f0;
        background-image:
          linear-gradient(45deg, #d7d7d7 25%, transparent 25%),
          linear-gradient(-45deg, #d7d7d7 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #d7d7d7 75%),
          linear-gradient(-45deg, transparent 75%, #d7d7d7 75%);
        background-position: 0 0, 0 10px, 10px -10px, -10px 0;
        background-size: 20px 20px;
      }

      .preview-canvas {
        display: block;
        min-width: 1px;
        min-height: 1px;
        background: transparent;
        box-shadow: none;
      }

      .preview-empty {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.22);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.18em;
        pointer-events: none;
        text-transform: uppercase;
      }

      .canvas-interaction {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        touch-action: none;
      }

      .canvas-interaction[hidden] {
        display: none;
      }

      .selection-box {
        position: absolute;
        pointer-events: none;
        transform-origin: center center;
      }

      .selection-border {
        position: absolute;
        inset: 0;
        border: 1.5px solid #3b82f6;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.42);
        cursor: move;
        pointer-events: auto;
      }

      .selection-handle {
        position: absolute;
        width: 8px;
        height: 8px;
        border: 1.5px solid #3b82f6;
        background: #ffffff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        pointer-events: auto;
      }

      .selection-handle.nw {
        left: 0;
        top: 0;
        cursor: nwse-resize;
        transform: translate(-50%, -50%);
      }

      .selection-handle.ne {
        right: 0;
        top: 0;
        cursor: nesw-resize;
        transform: translate(50%, -50%);
      }

      .selection-handle.se {
        right: 0;
        bottom: 0;
        cursor: nwse-resize;
        transform: translate(50%, 50%);
      }

      .selection-handle.sw {
        left: 0;
        bottom: 0;
        cursor: nesw-resize;
        transform: translate(-50%, 50%);
      }

      .rotation-stem {
        position: absolute;
        left: 50%;
        top: -24px;
        width: 1px;
        height: 24px;
        background: #3b82f6;
        transform: translateX(-50%);
      }

      .rotation-handle {
        position: absolute;
        left: 50%;
        top: -31px;
        width: 12px;
        height: 12px;
        border: 1.5px solid #3b82f6;
        border-radius: 999px;
        background: #ffffff;
        cursor: crosshair;
        pointer-events: auto;
        transform: translate(-50%, -50%);
      }

      .playbar {
        position: absolute;
        right: 0;
        bottom: 22px;
        left: 0;
        z-index: 3;
        display: flex;
        justify-content: center;
        pointer-events: none;
      }

      .playbar-inner {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.62);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.36);
        backdrop-filter: blur(18px);
        pointer-events: auto;
      }

      .align-tools {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 999px;
        padding: 4px 6px;
        background: rgba(255, 255, 255, 0.045);
      }

      .align-tools[hidden] {
        display: none;
      }

      .align-button {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        padding: 0;
        color: rgba(255, 255, 255, 0.5);
        font-size: 10px;
        font-weight: 900;
      }

      .align-button:hover {
        color: #ffffff;
      }

      .bg-switcher {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 999px;
        padding: 4px 6px;
        background: rgba(255, 255, 255, 0.045);
      }

      .swatch {
        width: 22px;
        height: 22px;
        border-radius: 8px;
        padding: 0;
      }

      .swatch.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.34);
      }

      .swatch.checkered {
        background-color: #eeeeee;
        background-image:
          linear-gradient(45deg, #c8c8c8 25%, transparent 25%),
          linear-gradient(-45deg, #c8c8c8 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #c8c8c8 75%),
          linear-gradient(-45deg, transparent 75%, #c8c8c8 75%);
        background-position: 0 0, 0 5px, 5px -5px, -5px 0;
        background-size: 10px 10px;
      }

      .swatch.black {
        background: #030303;
      }

      .swatch.white {
        background: #ffffff;
      }

      .play-button {
        display: inline-flex;
        width: 44px;
        height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        border-color: rgba(255, 255, 255, 0.92);
        color: #050505;
        background: #ffffff;
        font-size: 14px;
        font-weight: 900;
      }

      .field {
        gap: 6px;
      }

      .field label {
        color: rgba(255, 255, 255, 0.42);
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .inspector-scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }

      .inspector-card {
        display: grid;
        gap: 12px;
        padding: 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .license-summary {
        grid-template-columns: 1fr 1fr;
      }

      .motion-select {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .motion-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .motion-option {
        height: 36px;
        justify-content: flex-start;
        border-color: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 0 12px;
        color: rgba(255, 255, 255, 0.52);
        background: rgba(255, 255, 255, 0.045);
        font-weight: 850;
        text-align: left;
      }

      .motion-option.active {
        border-color: rgba(99, 102, 241, 0.58);
        color: #ffffff;
        background: rgba(99, 102, 241, 0.18);
      }

      .motion-option:disabled {
        opacity: 0.42;
      }

      .motion-control-panel,
      .sweep-controls,
      .particle-controls {
        display: grid;
        gap: 12px;
      }

      .motion-control-panel[hidden],
      .sweep-controls[hidden],
      .particle-controls[hidden],
      .field[hidden] {
        display: none;
      }

      .inline-field {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
      }

      .inspector-subtitle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding-top: 2px;
        color: rgba(255, 255, 255, 0.3);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .reset-button {
        height: 24px;
        border: 0;
        padding: 0;
        color: rgba(129, 140, 248, 0.92);
        background: transparent;
        font-size: 9px;
        font-weight: 900;
      }

      .transform-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .color-input {
        width: 48px;
        height: 32px;
        padding: 2px;
      }

      .sweep-header-button {
        height: 28px;
        padding: 0 10px;
        border-radius: 9px;
        color: #050505;
        background: #ffffff;
        font-size: 10px;
        font-weight: 900;
      }

      .sweep-empty {
        border: 1px dashed rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 12px;
        color: rgba(255, 255, 255, 0.34);
        font-size: 11px;
        text-align: center;
      }

      .sweep-actions,
      .particle-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .contact-panel {
        grid-template-columns: 82px minmax(0, 1fr);
        border-color: rgba(245, 158, 11, 0.26);
        color: rgba(255, 237, 213, 0.78);
        background: rgba(245, 158, 11, 0.1);
      }

      .contact-panel img {
        width: 82px;
        height: 82px;
      }

      .contact-copy strong {
        color: #fff7ed;
      }

      .install-id {
        border-color: rgba(255, 255, 255, 0.075);
        color: rgba(255, 255, 255, 0.8);
        background: rgba(255, 255, 255, 0.045);
      }

      .empty {
        color: rgba(255, 255, 255, 0.3);
      }

      .resize-handle {
        position: absolute;
        right: 0;
        bottom: 0;
        z-index: 10;
        width: 22px;
        height: 22px;
        cursor: nwse-resize;
      }

      .resize-handle::before {
        content: "";
        position: absolute;
        right: 6px;
        bottom: 6px;
        width: 10px;
        height: 10px;
        border-right: 2px solid rgba(255, 255, 255, 0.35);
        border-bottom: 2px solid rgba(255, 255, 255, 0.35);
      }

      @media (max-width: 980px) {
        .editor-layout {
          grid-template-columns: 260px minmax(320px, 1fr) 280px;
        }

        .tool-button span.optional {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app editor-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">S</div>
          <div class="brand-copy">
            <h1 class="brand-title">SVGA 编辑器</h1>
            <span class="brand-subtitle">Figma layers to motion</span>
          </div>
        </div>
        <div class="license-menu">
          <button id="licenseToggleBtn" class="license-compact" type="button" aria-expanded="false" aria-controls="licensePopover">
            <span>
              免费导出
              <strong id="freeCount">10 / 10</strong>
            </span>
            <span>
              授权状态
              <strong id="activationState">未激活</strong>
            </span>
          </button>
          <span id="licenseState" class="license-state-hidden">读取中</span>
          <div id="licensePopover" class="license-popover" hidden>
            <div class="license-popover-title">
              <strong>授权信息</strong>
              <button id="licenseCloseBtn" class="tool-button icon-only" type="button" title="收起授权">×</button>
            </div>
            <div id="contactPanel" class="contact-panel">
              <img id="contactQr" alt="联系二维码" />
              <div class="contact-copy">
                <strong>免费次数已用完</strong>
                <span>扫码联系我，发送下方识别码后获取授权码。</span>
              </div>
            </div>
            <div class="field">
              <label for="installationId">授权识别码</label>
              <div class="code-row">
                <div id="installationId" class="install-id">-</div>
                <button id="copyInstallIdBtn" type="button">复制</button>
              </div>
            </div>
            <div class="field">
              <label for="licenseCode">授权码</label>
              <textarea id="licenseCode" spellcheck="false" placeholder="SVGA1..."></textarea>
            </div>
            <button id="activateLicenseBtn" type="button">激活授权码</button>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="scanBtn" class="tool-button" type="button">刷新 Figma</button>
          <button id="captureBtn" class="tool-button" type="button">重新同步</button>
          <button id="downloadJsonBtn" class="tool-button" type="button" disabled>导出工程</button>
          <button id="exportSvgaBtn" class="tool-button primary" type="button" disabled>导出 SVGA</button>
          <button id="windowShrinkBtn" class="tool-button icon-only" type="button" title="缩小窗口">-</button>
          <button id="windowGrowBtn" class="tool-button icon-only" type="button" title="放大窗口">+</button>
        </div>
      </header>

      <section class="editor-layout">
        <aside class="sidebar left-sidebar">
          <div class="sidebar-section">
            <div class="section-title">
              <div class="section-title-main">
                <span>LAYERS</span>
                <strong>图层资产管理器</strong>
              </div>
              <span id="layerCountBadge" class="section-badge">0</span>
            </div>
            <div class="selection">
              <div class="metric">
                <span>图层</span>
                <strong id="selectionCount">0</strong>
              </div>
              <div class="metric">
                <span>宽</span>
                <strong id="selectionWidth">-</strong>
              </div>
              <div class="metric">
                <span>高</span>
                <strong id="selectionHeight">-</strong>
              </div>
            </div>
          </div>
          <div id="layerList" class="layers">
            <div class="empty">选中 Figma 画布后打开插件会自动同步图层</div>
          </div>
        </aside>

        <section class="stage">
          <div class="stage-toolbar">
            <div class="stage-meta">
              <strong id="canvasMeta">未导入</strong>
              <span id="previewMeta" class="layer-meta">等待同步 Figma 画布</span>
            </div>
            <div class="stage-zoom">
              <button id="canvasZoomOutBtn" class="tool-button icon-only" type="button" title="缩小画布">-</button>
              <span id="canvasZoomValue" class="zoom-value">100%</span>
              <button id="canvasZoomInBtn" class="tool-button icon-only" type="button" title="放大画布">+</button>
              <button id="canvasZoomResetBtn" class="tool-button" type="button">1:1</button>
            </div>
          </div>

          <div id="stageViewport" class="stage-viewport">
            <div id="canvasFrame" class="canvas-frame bg-checkered">
              <canvas id="previewCanvas" class="preview-canvas"></canvas>
              <div id="canvasInteraction" class="canvas-interaction" hidden>
                <div id="selectionBox" class="selection-box">
                  <div class="selection-border" data-drag-mode="translate"></div>
                  <div class="selection-handle nw" data-drag-mode="scale"></div>
                  <div class="selection-handle ne" data-drag-mode="scale"></div>
                  <div class="selection-handle se" data-drag-mode="scale"></div>
                  <div class="selection-handle sw" data-drag-mode="scale"></div>
                  <div class="rotation-stem"></div>
                  <div class="rotation-handle" data-drag-mode="rotate"></div>
                </div>
              </div>
              <div id="previewEmpty" class="preview-empty">Engine standby</div>
            </div>
          </div>

          <div class="playbar">
            <div class="playbar-inner">
              <div class="bg-switcher" aria-label="预览背景">
                <button class="swatch checkered active" data-bg="checkered" type="button" title="透明背景"></button>
                <button class="swatch black" data-bg="black" type="button" title="黑色背景"></button>
                <button class="swatch white" data-bg="white" type="button" title="白色背景"></button>
              </div>
              <div id="alignmentTools" class="align-tools" hidden aria-label="对齐工具">
                <button class="align-button" data-align="left" type="button" title="左对齐">左</button>
                <button class="align-button" data-align="center-h" type="button" title="水平居中">中</button>
                <button class="align-button" data-align="right" type="button" title="右对齐">右</button>
                <button class="align-button" data-align="top" type="button" title="顶部对齐">上</button>
                <button class="align-button" data-align="center-v" type="button" title="垂直居中">中</button>
                <button class="align-button" data-align="bottom" type="button" title="底部对齐">下</button>
              </div>
              <button id="playPreviewBtn" class="play-button" type="button" title="播放预览">▶</button>
            </div>
          </div>
        </section>

        <aside class="sidebar right-sidebar">
          <div class="inspector-scroll">
            <div class="inspector-card">
              <div class="section-title">
                <div class="section-title-main">
                  <span>PROJECT</span>
                  <strong>工程设置</strong>
                </div>
              </div>
              <div class="grid-2">
                <div class="field">
                  <label for="materialType">类型</label>
                  <input id="materialType" value="figma_selection" />
                </div>
                <div class="field">
                  <label for="exportScale">导出倍数</label>
                  <select id="exportScale">
                    <option value="1">1x</option>
                    <option value="2">2x</option>
                    <option value="3">3x</option>
                  </select>
                </div>
              </div>
              <div class="grid-2">
                <div class="field">
                  <label for="fps">FPS</label>
                  <input id="fps" type="number" min="1" max="60" value="24" />
                </div>
                <div class="field">
                  <label for="frames">帧数</label>
                  <input id="frames" type="number" min="1" max="600" value="72" />
                </div>
              </div>
            </div>

            <div class="inspector-card">
              <div class="section-title">
                <div class="section-title-main">
                  <span>MOTION</span>
                  <strong>图层动效</strong>
                </div>
              </div>
              <div class="inspector-subtitle">
                <span>Transform & Animation</span>
                <button id="resetTransformBtn" class="reset-button" type="button" disabled>RESET</button>
              </div>
              <div class="transform-grid">
                <div class="field">
                  <label for="transformX">位置 X <span id="transformXValue">0</span></label>
                  <input id="transformX" type="range" min="-2000" max="4000" step="1" value="0" disabled />
                </div>
                <div class="field">
                  <label for="transformY">位置 Y <span id="transformYValue">0</span></label>
                  <input id="transformY" type="range" min="-2000" max="4000" step="1" value="0" disabled />
                </div>
                <div class="field">
                  <label for="transformScale">缩放 <span id="transformScaleValue">1.00x</span></label>
                  <input id="transformScale" type="range" min="0.05" max="5" step="0.01" value="1" disabled />
                </div>
                <div class="field">
                  <label for="transformRotate">旋转 <span id="transformRotateValue">0°</span></label>
                  <input id="transformRotate" type="range" min="-180" max="180" step="1" value="0" disabled />
                </div>
              </div>
              <div class="inspector-subtitle">
                <span>Animation Core</span>
                <span class="section-badge">MOTION</span>
              </div>
              <select id="animationType" class="motion-select" disabled>
                <option value="none">无动画</option>
                <option value="float">上下浮动</option>
                <option value="swing">左右摇摆</option>
                <option value="pulse">呼吸缩放</option>
                <option value="spin">旋转</option>
              </select>
              <div id="motionOptions" class="motion-options" aria-label="图层动效">
                <button class="motion-option active" data-motion="none" type="button" disabled>无动画</button>
                <button class="motion-option" data-motion="float" type="button" disabled>上下浮动</button>
                <button class="motion-option" data-motion="swing" type="button" disabled>左右摇摆</button>
                <button class="motion-option" data-motion="pulse" type="button" disabled>呼吸缩放</button>
                <button class="motion-option" data-motion="spin" type="button" disabled>旋转</button>
              </div>
              <div id="motionControlPanel" class="motion-control-panel" hidden>
                <div class="field">
                  <label for="speed">速度 <span id="speedValue">1.0</span></label>
                  <input id="speed" type="range" min="0.1" max="5" step="0.1" value="1" disabled />
                </div>
                <div id="intensityField" class="field">
                  <label for="intensity">强度 <span id="intensityValue">1.0</span></label>
                  <input id="intensity" type="range" min="0.1" max="5" step="0.1" value="1" disabled />
                </div>
              </div>
            </div>

            <div class="inspector-card">
              <div class="section-title">
                <div class="section-title-main">
                  <span>SWEEP</span>
                  <strong>高级扫光特效</strong>
                </div>
                <button id="addSweepBtn" class="sweep-header-button" type="button" disabled>添加扫光</button>
              </div>
              <div id="sweepEmpty" class="sweep-empty">选择图层后可添加扫光。</div>
              <div id="sweepControls" class="sweep-controls" hidden>
                <div class="field">
                  <label for="sweepShape">扫光形状</label>
                  <select id="sweepShape">
                    <option value="straight">直线扫光</option>
                    <option value="curve">弧形扫光</option>
                    <option value="centerLine">中心线扫光</option>
                    <option value="centerCircle">中心圆扫光</option>
                    <option value="centerFlow">中心流光</option>
                  </select>
                </div>
                <div class="inline-field">
                  <div class="field">
                    <label for="sweepColor">扫光颜色</label>
                    <input id="sweepColor" type="color" value="#ffffff" />
                  </div>
                  <input id="sweepColorPreview" class="color-input" type="color" value="#ffffff" aria-label="扫光颜色" />
                </div>
                <div class="field">
                  <label for="sweepSpeed">循环速度 <span id="sweepSpeedValue">1</span></label>
                  <input id="sweepSpeed" type="range" min="0.2" max="6" step="0.1" value="1" />
                </div>
                <div class="field">
                  <label for="sweepWidth">扫光粗细 <span id="sweepWidthValue">100</span></label>
                  <input id="sweepWidth" type="range" min="8" max="500" step="1" value="100" />
                </div>
                <div class="field">
                  <label for="sweepFeather">扫光羽化 <span id="sweepFeatherValue">20</span></label>
                  <input id="sweepFeather" type="range" min="0" max="160" step="1" value="20" />
                </div>
                <div class="field">
                  <label for="sweepAngle">扫光角度 <span id="sweepAngleValue">30°</span></label>
                  <input id="sweepAngle" type="range" min="-180" max="180" step="1" value="30" />
                </div>
                <div class="field">
                  <label for="sweepOpacity">扫光透明度 <span id="sweepOpacityValue">1.00</span></label>
                  <input id="sweepOpacity" type="range" min="0" max="1" step="0.01" value="1" />
                </div>
                <div class="sweep-actions">
                  <button id="sweepBlendBtn" type="button">混合: 滤色</button>
                  <button id="sweepFadeBtn" type="button">淡入淡出: 关</button>
                </div>
                <button id="removeSweepBtn" type="button">移除扫光</button>
              </div>
            </div>

            <div class="inspector-card">
              <div class="section-title">
                <div class="section-title-main">
                  <span>PARTICLE</span>
                  <strong>粒子特效</strong>
                </div>
                <button id="addParticleBtn" class="sweep-header-button" type="button" disabled>添加粒子</button>
              </div>
              <div id="particleEmpty" class="sweep-empty">导入 Figma 画布后可添加粒子层。</div>
              <div id="particleControls" class="particle-controls" hidden>
                <div class="field">
                  <label for="particleSystemType">粒子动态形式</label>
                  <select id="particleSystemType">
                    <option value="falling">飘落</option>
                    <option value="emission">发射</option>
                    <option value="flame">火焰升腾</option>
                    <option value="wave">波浪游动</option>
                    <option value="vortex">漩涡聚合</option>
                    <option value="sparkle">闪烁星星</option>
                  </select>
                </div>
                <div class="field">
                  <label for="particleShape">粒子样式</label>
                  <select id="particleShape">
                    <option value="snow">雪花</option>
                    <option value="star">星星</option>
                    <option value="flash">闪光</option>
                    <option value="circle">圆点</option>
                  </select>
                </div>
                <div class="grid-2">
                  <div class="field">
                    <label for="particleCount">粒子数量 <span id="particleCountValue">30</span></label>
                    <input id="particleCount" type="range" min="4" max="180" step="1" value="30" />
                  </div>
                  <div class="field">
                    <label for="particleSize">粒子大小 <span id="particleSizeValue">15</span></label>
                    <input id="particleSize" type="range" min="4" max="120" step="1" value="15" />
                  </div>
                </div>
                <div class="grid-2">
                  <div class="field">
                    <label for="particleSpeed">速度 <span id="particleSpeedValue">1.0</span></label>
                    <input id="particleSpeed" type="range" min="0.1" max="10" step="0.1" value="1" />
                  </div>
                  <div class="field">
                    <label for="particleRandomness">随机 <span id="particleRandomnessValue">0.5</span></label>
                    <input id="particleRandomness" type="range" min="0" max="1" step="0.05" value="0.5" />
                  </div>
                </div>
                <div class="grid-2">
                  <div class="field">
                    <label for="particleLifeSpan">生命周期 <span id="particleLifeSpanValue">1.00</span></label>
                    <input id="particleLifeSpan" type="range" min="0.1" max="1" step="0.05" value="1" />
                  </div>
                  <div class="field">
                    <label for="particleDecay">衰减 <span id="particleDecayValue">0.20</span></label>
                    <input id="particleDecay" type="range" min="0" max="1" step="0.05" value="0.2" />
                  </div>
                </div>
                <div class="field">
                  <label for="particleColorMode">颜色模式</label>
                  <select id="particleColorMode">
                    <option value="solid">纯色</option>
                    <option value="linearGradient">线性渐变</option>
                    <option value="quadrantGradient">径向渐变</option>
                  </select>
                </div>
                <div class="inline-field">
                  <div class="field">
                    <label for="particleColor">主颜色</label>
                    <input id="particleColor" type="color" value="#ffffff" />
                  </div>
                  <input id="particleColorPreview" class="color-input" type="color" value="#ffffff" aria-label="粒子主颜色" />
                </div>
                <div id="particleSecondaryColorField" class="inline-field" hidden>
                  <div class="field">
                    <label for="particleSecondaryColor">渐变辅色</label>
                    <input id="particleSecondaryColor" type="color" value="#000000" />
                  </div>
                  <input id="particleSecondaryColorPreview" class="color-input" type="color" value="#000000" aria-label="粒子渐变辅色" />
                </div>
                <div id="particleSystemPanel" class="grid-2" hidden>
                  <div class="field">
                    <label for="emissionOriginX">X 起点 <span id="emissionOriginXValue">50%</span></label>
                    <input id="emissionOriginX" type="range" min="0" max="1" step="0.01" value="0.5" />
                  </div>
                  <div class="field">
                    <label for="emissionOriginY">Y 起点 <span id="emissionOriginYValue">50%</span></label>
                    <input id="emissionOriginY" type="range" min="0" max="1" step="0.01" value="0.5" />
                  </div>
                  <div class="field">
                    <label for="emissionAngle">发射角度 <span id="emissionAngleValue">270°</span></label>
                    <input id="emissionAngle" type="range" min="0" max="360" step="1" value="270" />
                  </div>
                  <div class="field">
                    <label for="emissionSpread">扩散角 <span id="emissionSpreadValue">45°</span></label>
                    <input id="emissionSpread" type="range" min="0" max="360" step="1" value="45" />
                  </div>
                </div>
                <div class="particle-actions">
                  <button id="removeParticleBtn" type="button">删除粒子层</button>
                </div>
              </div>
            </div>
          </div>
        </aside>
      </section>
      <div id="resizeHandle" class="resize-handle" title="拖拽调整插件窗口"></div>

      class ProtoWriter {
        constructor() {
          this.chunks = [];
          this.scratch = [];
          this.length = 0;
        }

        flush() {
          if (this.scratch.length === 0) return;
          const chunk = Uint8Array.from(this.scratch);
          this.chunks.push(chunk);
          this.scratch = [];
        }

        byte(value) {
          this.scratch.push(value & 255);
          this.length += 1;
        }

        bytes(value) {
          this.flush();
          this.chunks.push(value);
          this.length += value.length;
        }

        varint(value) {
          let next = Number(value) >>> 0;
          while (next > 127) {
            this.byte((next & 127) | 128);
            next >>>= 7;
          }
          this.byte(next);
        }

        tag(field, wireType) {
          this.varint((field << 3) | wireType);
        }

        uint32(field, value) {
          this.tag(field, 0);
          this.varint(value);
        }

        float32(field, value) {
          const buffer = new ArrayBuffer(4);
          new DataView(buffer).setFloat32(0, Number(value) || 0, true);
          this.tag(field, 5);
          this.bytes(new Uint8Array(buffer));
        }

        string(field, value) {
          const encoded = new TextEncoder().encode(String(value || ""));
          this.tag(field, 2);
          this.varint(encoded.length);
          this.bytes(encoded);
        }

        rawBytes(field, value) {
          this.tag(field, 2);
          this.varint(value.length);
          this.bytes(value);
        }

        message(field, callback) {
          const nested = new ProtoWriter();
          callback(nested);
          const encoded = nested.finish();
          this.tag(field, 2);
          this.varint(encoded.length);
          this.bytes(encoded);
        }

        finish() {
          this.flush();
          const output = new Uint8Array(this.length);
          let offset = 0;
          for (const chunk of this.chunks) {
            output.set(chunk, offset);
            offset += chunk.length;
          }
          return output;
        }
      }

      const requestPlugin = (type, payload = {}) =>
        new Promise((resolve, reject) => {
          const requestId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
          const timer = window.setTimeout(() => {
            state.pendingRequests.delete(requestId);
            reject(new Error("插件响应超时。"));
          }, 15000);
          state.pendingRequests.set(requestId, { resolve, reject, timer });
          postPlugin(type, { ...payload, requestId });
        });

      const resolvePluginRequest = (message) => {
        if (!message.requestId) return false;
        const pending = state.pendingRequests.get(message.requestId);
        if (!pending) return false;
        window.clearTimeout(pending.timer);
        state.pendingRequests.delete(message.requestId);
        if (message.type === "plugin-error") {
          pending.reject(new Error(message.message || "插件请求失败。"));
        } else {
          pending.resolve(message);
        }
        return true;

        const node = $("log");
        if (!node) return;
        const stamp = new Date().toLocaleTimeString("zh-CN", { hour12: false });
        node.textContent = `${node.textContent || ""}\n[${stamp}] ${message}`.trim();
        node.scrollTop = node.scrollHeight;
      };

      const setBusy = (busy) => {
        state.busy = busy;
        for (const id of ["scanBtn", "captureBtn", "downloadJsonBtn", "exportSvgaBtn", "activateLicenseBtn"]) {
          const el = $(id);
          if (el) {
            el.disabled =
              busy ||
              ((id === "exportSvgaBtn" || id === "downloadJsonBtn") && !state.package);
          }
        }
      };

      const renderSelection = () => {
        const payload = state.selection || { count: 0, bounds: null };
        $("selectionCount").textContent = String(payload.count || 0);
        $("selectionWidth").textContent = payload.bounds ? `${Math.round(payload.bounds.width)}px` : "-";
        $("selectionHeight").textContent = payload.bounds ? `${Math.round(payload.bounds.height)}px` : "-";
      };

      const assetPayloadByKey = (key) =>
        state.package?.assets?.find((asset) => asset.key === key) || null;

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

      const projectFrameCount = () =>
        Math.max(1, Math.min(600, Math.round(Number(state.package?.project?.exportRules?.frames || $("frames").value || 72))));

      const projectFps = () =>
        Math.max(1, Math.min(60, Math.round(Number(state.package?.project?.exportRules?.fps || $("fps").value || 24))));

      const updateCanvasBackground = () => {
        const frame = $("canvasFrame");
        frame.classList.toggle("bg-checkered", state.canvasBg === "checkered");
        frame.classList.toggle("bg-white", state.canvasBg === "white");
        for (const swatch of document.querySelectorAll(".swatch")) {
          swatch.classList.toggle("active", swatch.dataset.bg === state.canvasBg);
        }
      };

      const updatePreviewChrome = () => {
        const canvas = $("previewCanvas");
        const project = state.package?.project;
        if (!project?.canvas) {
          canvas.width = 320;
          canvas.height = 320;
          canvas.style.width = "320px";
          canvas.style.height = "320px";
          $("canvasFrame").style.width = "320px";
          $("canvasFrame").style.height = "320px";
          $("previewEmpty").style.display = "flex";
          $("previewMeta").textContent = "等待同步 Figma 画布";
          $("canvasZoomValue").textContent = `${Math.round(state.canvasZoom * 100)}%`;
          updateCanvasBackground();
          return;
        }

        const width = Math.max(1, Math.round(Number(project.canvas.width || 1)));
        const height = Math.max(1, Math.round(Number(project.canvas.height || 1)));
        const cssWidth = Math.max(1, Math.round(width * state.canvasZoom));
        const cssHeight = Math.max(1, Math.round(height * state.canvasZoom));
        if (canvas.width !== width) canvas.width = width;
        if (canvas.height !== height) canvas.height = height;
        canvas.style.width = `${cssWidth}px`;
        canvas.style.height = `${cssHeight}px`;
        $("canvasFrame").style.width = `${cssWidth}px`;
        $("canvasFrame").style.height = `${cssHeight}px`;
        $("previewEmpty").style.display = "none";
        $("canvasZoomValue").textContent = `${Math.round(state.canvasZoom * 100)}%`;
        updateCanvasBackground();
        $("previewMeta").textContent = state.canvasStale
          ? `${width}x${height} 画布已变化`
          : `${width}x${height} / frame ${state.previewFrame + 1}/${projectFrameCount()}`;
      };

      const loadPreviewImage = (payload) => {
        if (!payload?.dataUrl) return Promise.reject(new Error("缺少图片数据。"));
        const cached = state.previewImageCache.get(payload.key);
        if (cached && cached.src === payload.dataUrl) return cached.promise;
        const promise = new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("预览图片加载失败。"));
          img.src = payload.dataUrl;
        });
        state.previewImageCache.set(payload.key, { src: payload.dataUrl, promise });
        return promise;
      };

      const hexToRgb = (value) => {
        const hex = String(value || "#ffffff").replace("#", "").trim();
        const full = hex.length === 3
          ? hex.split("").map((part) => part + part).join("")
          : hex.padEnd(6, "f").slice(0, 6);
        const parsed = Number.parseInt(full, 16);
        if (!Number.isFinite(parsed)) return { r: 255, g: 255, b: 255 };
        return {
          r: (parsed >> 16) & 255,
          g: (parsed >> 8) & 255,
          b: parsed & 255,
        };
      };

      const rgbaFromHex = (hex, alpha) => {
        const color = hexToRgb(hex);
        return `rgba(${color.r}, ${color.g}, ${color.b}, ${clamp(alpha, 0, 1)})`;
      };

      const activeSweepEffects = (project) =>
        (project?.effects || []).filter((effect) => effect.type === "sweep" && effect.enabled !== false);

      const sweepProgress = (effect, frameIndex, totalFrames) =>
        ((frameIndex / Math.max(1, totalFrames)) * Math.max(0.01, Number(effect.sweepSpeed || 1))) % 1;

      const drawLinearSweep = (ctx, effect, progress, diagonal) => {
        const width = Math.max(4, Number(effect.sweepWidth || 100));
        const feather = Math.max(0, Number(effect.sweepFeather || 20));
        const totalWidth = Math.max(4, width + feather * 2);
        const travel = diagonal * 2 + totalWidth;
        const sweepX = -travel / 2 + progress * travel;
        const gradient = ctx.createLinearGradient(
          sweepX - totalWidth / 2,
          0,
          sweepX + totalWidth / 2,
          0,
        );
        gradient.addColorStop(0, rgbaFromHex(effect.sweepColor, 0));
        gradient.addColorStop(0.5, rgbaFromHex(effect.sweepColor, 1));
        gradient.addColorStop(1, rgbaFromHex(effect.sweepColor, 0));
        ctx.fillStyle = gradient;
        ctx.fillRect(-diagonal * 1.2, -diagonal, diagonal * 2.4, diagonal * 2);
      };

      const drawCircleSweep = (ctx, effect, progress, diagonal) => {
        const width = Math.max(4, Number(effect.sweepWidth || 100));
        const feather = Math.max(0, Number(effect.sweepFeather || 20));
        const radius = progress * diagonal;
        const inner = Math.max(0, radius - width / 2 - feather);
        const middleA = Math.max(inner + 0.1, radius - width / 2);
        const middleB = Math.max(middleA + 0.1, radius + width / 2);
        const outer = Math.max(middleB + 0.1, radius + width / 2 + feather);
        const gradient = ctx.createRadialGradient(0, 0, inner, 0, 0, outer);
        gradient.addColorStop(0, rgbaFromHex(effect.sweepColor, 0));
        gradient.addColorStop(clamp((middleA - inner) / (outer - inner), 0, 1), rgbaFromHex(effect.sweepColor, 0.9));
        gradient.addColorStop(clamp((middleB - inner) / (outer - inner), 0, 1), rgbaFromHex(effect.sweepColor, 0.9));
        gradient.addColorStop(1, rgbaFromHex(effect.sweepColor, 0));
        ctx.fillStyle = gradient;
        ctx.fillRect(-diagonal, -diagonal, diagonal * 2, diagonal * 2);
      };

      const drawSweepShape = (ctx, effect, progress, diagonal) => {
        if (effect.sweepShape === "centerCircle") {
          drawCircleSweep(ctx, effect, progress, diagonal);
          return;
        }
        drawLinearSweep(ctx, effect, progress, diagonal);
        if (effect.sweepShape === "centerFlow") {
          drawLinearSweep(ctx, effect, (progress + 0.5) % 1, diagonal);
        }
      };

      const makeSweepMaskCanvas = ({ image, effect, progress, width, height }) => {
        const maskWidth = Math.max(1, Math.round(width));
        const maskHeight = Math.max(1, Math.round(height));
        const diagonal = Math.sqrt(maskWidth * maskWidth + maskHeight * maskHeight);
        const canvas = document.createElement("canvas");
        canvas.width = maskWidth;
        canvas.height = maskHeight;
        const maskCtx = canvas.getContext("2d");
        if (!maskCtx) return canvas;

        maskCtx.save();
        maskCtx.translate(maskWidth / 2, maskHeight / 2);
        maskCtx.rotate(((Number(effect.sweepAngle || 0) || 0) * Math.PI) / 180);
        drawSweepShape(maskCtx, effect, progress, diagonal);
        maskCtx.restore();

        maskCtx.globalCompositeOperation = "destination-in";
        maskCtx.drawImage(image, 0, 0, maskWidth, maskHeight);
        maskCtx.globalCompositeOperation = "source-over";
        return canvas;
      };

      const hashSeed = (value) => {
        let hash = 2166136261;
        const text = String(value || "particle");
        for (let index = 0; index < text.length; index += 1) {
          hash ^= text.charCodeAt(index);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      };

      const seededRandom = (seed) => {
        let stateValue = seed >>> 0;
        return () => {
          stateValue += 0x6d2b79f5;
          let next = stateValue;
          next = Math.imul(next ^ (next >>> 15), next | 1);
          next ^= next + Math.imul(next ^ (next >>> 7), next | 61);
          return ((next ^ (next >>> 14)) >>> 0) / 4294967296;
        };
      };

      const particleCanvasSize = (effect) =>
        effect.particleSystemType === "flame"
          ? 100
          : Math.max(20, Math.round(Number(effect.particleSize || 15)));

      const drawStarPath = (ctx, cx, cy, outerRadius, points = 5, innerRatio = 0.5) => {
        const step = Math.PI / Math.max(3, points);
        const start = Math.PI * 1.5;
        const innerRadius = outerRadius * innerRatio;
        ctx.beginPath();
        for (let index = 0; index < points; index += 1) {
          ctx.lineTo(cx + Math.cos(start + step * index * 2) * outerRadius, cy + Math.sin(start + step * index * 2) * outerRadius);
          ctx.lineTo(cx + Math.cos(start + step * (index * 2 + 1)) * innerRadius, cy + Math.sin(start + step * (index * 2 + 1)) * innerRadius);
        }
        ctx.closePath();
      };

      const makeParticleTextureCanvas = (effect) => {
        const size = particleCanvasSize(effect);
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        if (!ctx) return canvas;
        const cx = size / 2;
        const cy = size / 2;
        const baseSize = Math.min(size, Math.max(4, Number(effect.particleSize || 15))) * 0.82;
        const color = effect.particleColor || "#ffffff";
        const secondary = effect.particleGradientColors?.[1] || "#000000";
        if (effect.particleSystemType === "flame") {
          const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, size / 2);
          gradient.addColorStop(0, "rgba(255, 244, 170, 0.95)");
          gradient.addColorStop(0.32, "rgba(255, 138, 24, 0.72)");
          gradient.addColorStop(0.72, "rgba(180, 20, 0, 0.22)");
          gradient.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
          ctx.fill();
          return canvas;
        }
        if (effect.particleColorMode === "linearGradient") {
          const gradient = ctx.createLinearGradient(0, 0, size, size);
          gradient.addColorStop(0, color);
          gradient.addColorStop(1, secondary);
          ctx.fillStyle = gradient;
        } else if (effect.particleColorMode === "quadrantGradient") {
          const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseSize / 2);
          gradient.addColorStop(0, color);
          gradient.addColorStop(1, secondary);
          ctx.fillStyle = gradient;
        } else {
          ctx.fillStyle = color;
        }
        if (effect.particleShape === "star") {
          const intensity = Number(effect.sparkleIntensity || 0);
          if (intensity > 0) {
            const rgb = hexToRgb(color);
            const glow = ctx.createRadialGradient(cx, cy, baseSize * 0.1, cx, cy, baseSize * (0.72 + intensity * 0.4));
            glow.addColorStop(0, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.72)`);
            glow.addColorStop(1, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0)`);
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(cx, cy, baseSize * (0.72 + intensity * 0.4), 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = color;
          }
          drawStarPath(ctx, cx, cy, baseSize / 2, Math.round(effect.starPoints || 5), Number(effect.starInnerRadius || 0.5));
          ctx.fill();
        } else if (effect.particleShape === "flash") {
          const rgb = hexToRgb(color);
          const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseSize / 2);
          glow.addColorStop(0, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 1)`);
          glow.addColorStop(0.34, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.58)`);
          glow.addColorStop(1, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0)`);
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(cx, cy, baseSize / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          drawStarPath(ctx, cx, cy, baseSize / 2, 4, 0.12);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(cx, cy, baseSize / 2, 0, Math.PI * 2);
          ctx.fill();
          if (effect.particleShape !== "snow") {
            ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
            ctx.beginPath();
            ctx.arc(cx - baseSize / 6, cy - baseSize / 6, baseSize / 7, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        return canvas;
      };

      const particleCountForEffect = (effect) => {
        const base = Math.max(1, Math.round(Number(effect.particleCount || 30) * Number(effect.particleDensity || 1)));
        const multiplier = effect.particleSystemType === "flame" ? 5 : 1;
        return Math.min(260, base * multiplier);
      };

      const sampleParticle = (asset, particleIndex, frameIndex, totalFrames) => {
        const effect = asset.effectConfig || {};
        const geometry = assetRenderGeometry(asset);
        const tWidth = Math.max(1, geometry.displayWidth);
        const tHeight = Math.max(1, geometry.displayHeight);
        const sizeFactor = Math.max(0.2, Math.min(tWidth, tHeight) / 750);
        const rng = seededRandom(hashSeed(`${effect.id || asset.key}:${particleIndex}`));
        const randomness = Number(effect.particleRandomness == null ? 0.5 : effect.particleRandomness);
        const baseSize = Number(effect.particleSize || 15);
        const globalSpeed = Number(effect.particleSpeed || 1) * 5 * sizeFactor;
        const phase = rng() * Math.PI * 2;
        const rotationSpeed = (rng() - 0.5) * 0.12;
        const baseAlpha = 0.3 + rng() * 0.7;
        let particleScale = (0.5 + rng() * Math.max(0.05, randomness)) * sizeFactor;
        let localX = rng() * tWidth;
        let localY = rng() * tHeight;
        let alpha = baseAlpha;
        const systemType = effect.particleSystemType || "falling";
        const lifeSpan = Number(effect.particleLifeSpan || 1);
        const decay = Math.max(0.001, Number(effect.particleDecay == null ? 0.2 : effect.particleDecay));
        const flutterSpeed = 0.05 + rng() * 0.1;
        const flutter = baseSize * rng() * 2 * sizeFactor;
        const startFrameOffset = Math.floor(rng() * totalFrames);
        const maxLifeFrames = Math.max(1, Math.floor(totalFrames * lifeSpan * (0.5 + rng() * 0.5)));
        const originX = Number(effect.emissionOriginX == null ? 0.5 : effect.emissionOriginX) * tWidth;
        const originY = Number(effect.emissionOriginY == null ? 0.5 : effect.emissionOriginY) * tHeight;
        const emissionAngle = ((Number(effect.emissionAngle == null ? 270 : effect.emissionAngle)) * Math.PI) / 180;
        const spread = ((Number(effect.emissionSpread == null ? 45 : effect.emissionSpread)) * Math.PI) / 180;
        const finalAngle = emissionAngle + (rng() - 0.5) * spread;
        const speed = globalSpeed * (0.5 + rng() * Math.max(0.05, randomness));
        const velocityX = Math.cos(finalAngle) * speed * 2;
        const velocityY = Math.sin(finalAngle) * speed * 2;
        const age = (frameIndex - startFrameOffset + totalFrames) % Math.max(totalFrames, maxLifeFrames);

        if (systemType === "falling") {
          localY = (localY + frameIndex * speed) % tHeight;
          localX += Math.sin(phase + frameIndex * flutterSpeed) * flutter;
          const edgeFade = Math.min(30, tHeight * 0.12);
          if (localY < edgeFade) alpha *= localY / edgeFade;
          if (localY > tHeight - edgeFade) alpha *= (tHeight - localY) / edgeFade;
        } else if (systemType === "sparkle") {
          const pulse = (Math.sin((frameIndex / totalFrames) * Math.PI * 2 * Math.ceil(Number(effect.particleSpeed || 1) * 3 * (0.5 + rng())) + phase) + 1) / 2;
          const sparklePulse = Math.pow(pulse, 4);
          alpha *= sparklePulse;
          particleScale *= sparklePulse;
        } else if (systemType === "flame") {
          const flameDecay = (rng() * 0.02 + 0.015) * Math.max(0.1, 2 - lifeSpan);
          const flameLife = 1 - age * flameDecay;
          const radius = Math.pow(rng(), 2);
          const angle = rng() * Math.PI * 2;
          localX = originX + Math.cos(angle) * radius * 18 * sizeFactor + (rng() - 0.5) * globalSpeed * age;
          localY = originY + Math.sin(angle) * radius * 10 * sizeFactor - (rng() * 3 + 2) * globalSpeed * age * 0.5;
          particleScale *= Math.max(0, 1 - age * 0.018);
          alpha = Math.max(0, flameLife) * baseAlpha * 1.5;
        } else {
          if (age > maxLifeFrames) {
            alpha = 0;
          } else {
            const lifeRatio = age / maxLifeFrames;
            localX = originX + velocityX * age;
            localY = originY + velocityY * age;
            if (systemType === "wave") {
              const perpAngle = finalAngle + Math.PI / 2;
              const wave = Math.sin(phase + age * flutterSpeed * 2) * flutter * 2;
              localX += Math.cos(perpAngle) * wave;
              localY += Math.sin(perpAngle) * wave;
            }
            if (systemType === "vortex") {
              const radius = flutter * 2 + speed * age * 0.5;
              const vortexAngle = finalAngle + age * rotationSpeed * 2;
              localX = originX + Math.cos(vortexAngle) * radius;
              localY = originY + Math.sin(vortexAngle) * radius;
            }
            if (lifeRatio > 1 - decay) alpha *= 1 - (lifeRatio - (1 - decay)) / decay;
            if (lifeRatio < 0.1) alpha *= lifeRatio / 0.1;
          }
        }

        const rotation = ((Number(geometry.rotate || 0) || 0) * Math.PI) / 180;
        const cos = Math.cos(rotation);
        const sin = Math.sin(rotation);
        const offsetX = localX - tWidth / 2;
        const offsetY = localY - tHeight / 2;
        return {
          alpha: clamp(alpha, 0, 1),
          x: geometry.x + tWidth / 2 + cos * offsetX - sin * offsetY,
          y: geometry.y + tHeight / 2 + sin * offsetX + cos * offsetY,
          scale: Math.max(0, particleScale),
          rotation: rotation + phase + frameIndex * rotationSpeed,
        };
      };

      const drawParticleEffects = (ctx, project, frameIndex, totalFrames) => {
        for (const asset of activeParticleAssets(project)) {
          const texture = makeParticleTextureCanvas(asset.effectConfig);
          const count = particleCountForEffect(asset.effectConfig);
          for (let index = 0; index < count; index += 1) {
            const sample = sampleParticle(asset, index, frameIndex, totalFrames);
            if (sample.alpha <= 0 || sample.scale <= 0) continue;
            ctx.save();
            ctx.globalAlpha = sample.alpha;
            ctx.translate(sample.x, sample.y);
            ctx.rotate(sample.rotation);
            ctx.scale(sample.scale, sample.scale);
            ctx.drawImage(texture, -texture.width / 2, -texture.height / 2);
            ctx.restore();
          }
        }
      };

      const drawSweepEffects = (ctx, project, items, frameIndex, totalFrames, fps) => {
        const itemByKey = new Map(items.map((item) => [item.asset.key, item]));
        for (const effect of activeSweepEffects(project)) {
          const item = itemByKey.get(effect.sweepTarget);
          if (!item) continue;
          const width = Math.max(1, item.displayWidth);
          const height = Math.max(1, item.displayHeight);
          const progress = sweepProgress(effect, frameIndex, totalFrames);
          const fade = effect.sweepFadeEnabled ? Math.sin(progress * Math.PI) : 1;
          const opacity = clamp(Number(effect.sweepOpacity == null ? 1 : effect.sweepOpacity) * fade, 0, 1);
          if (opacity <= 0) continue;

          const motion = frameMotion(item.asset, frameIndex, totalFrames, fps);
          const maskedSweep = makeSweepMaskCanvas({
            image: item.img,
            effect,
            progress,
            width,
            height,
          });
          const centerX = item.x + width / 2 + motion.animX;
          const centerY = item.y + height / 2 + motion.animY;

          ctx.save();
          ctx.globalAlpha = opacity;
          ctx.globalCompositeOperation = effect.sweepBlendMode === "normal" ? "source-over" : "screen";
          ctx.translate(centerX, centerY);
          ctx.rotate(motion.rotation);
          ctx.scale(motion.extraScale, motion.extraScale);
          ctx.drawImage(maskedSweep, -width / 2, -height / 2, width, height);
          ctx.restore();
        }
      };

      const drawSelectionOutlines = (ctx, items, frameIndex, totalFrames, fps) => {
        for (const item of items) {
          if (item.asset.key !== state.selectedKey) continue;
          const motion = frameMotion(item.asset, frameIndex, totalFrames, fps);
          const centerX = item.x + item.displayWidth / 2 + motion.animX;
          const centerY = item.y + item.displayHeight / 2 + motion.animY;
          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.rotate(motion.rotation);
          ctx.scale(motion.extraScale, motion.extraScale);
          ctx.lineWidth = 2 / Math.max(0.2, motion.extraScale);
          ctx.strokeStyle = "#6366f1";
          ctx.strokeRect(
            -item.displayWidth / 2,
            -item.displayHeight / 2,
            item.displayWidth,
            item.displayHeight,
          );
          ctx.restore();
        }
      };

      const drawPreviewFrame = async (frameIndex = state.previewFrame) => {
        const token = ++state.previewDrawToken;
        const canvas = $("previewCanvas");
        const ctx = canvas.getContext("2d");
        const project = state.package?.project;
        if (!ctx || !project?.canvas) {
          if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
          return;
        }

        const fps = projectFps();
        const totalFrames = projectFrameCount();
        const items = [];
        for (const asset of project.assets || []) {
          if (asset.visible === false) continue;
          const payload = assetPayloadByKey(asset.key);
          if (!payload?.dataUrl) continue;
          try {
            const img = await loadPreviewImage(payload);
            const geometry = assetRenderGeometry(asset);
            items.push({
              asset,
              img,
              x: geometry.x,
              y: geometry.y,
              displayWidth: geometry.displayWidth,
              displayHeight: geometry.displayHeight,
            });
          } catch (_error) {
            // A missing image should not block the rest of the Figma layer preview.
          }
        }
        if (token !== state.previewDrawToken) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const item of items) {
          const motion = frameMotion(item.asset, frameIndex, totalFrames, fps);
          const centerX = item.x + item.displayWidth / 2 + motion.animX;
          const centerY = item.y + item.displayHeight / 2 + motion.animY;
          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.rotate(motion.rotation);
          ctx.scale(motion.extraScale, motion.extraScale);
          ctx.drawImage(
            item.img,
            -item.displayWidth / 2,
            -item.displayHeight / 2,
            item.displayWidth,
            item.displayHeight,
          );
          ctx.restore();
        }
        drawSweepEffects(ctx, project, items, frameIndex, totalFrames, fps);
        drawParticleEffects(ctx, project, frameIndex, totalFrames);
        drawSelectionOutlines(ctx, items, frameIndex, totalFrames, fps);
      };

      const renderPreview = (frameIndex = state.previewFrame) => {
        state.previewFrame = frameIndex;
        updatePreviewChrome();
        updateSelectionOverlay();
        void drawPreviewFrame(frameIndex);
      };

      const updatePlayButton = () => {
        const button = $("playPreviewBtn");
        button.textContent = state.previewPlaying ? "II" : "▶";
        button.title = state.previewPlaying ? "暂停预览" : "播放预览";
      };

      const stopPreviewPlayback = () => {
        state.previewPlaying = false;
        if (state.previewRaf) window.cancelAnimationFrame(state.previewRaf);
        state.previewRaf = null;
        updatePlayButton();
      };
